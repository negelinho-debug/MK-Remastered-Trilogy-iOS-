            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.mkremastered.trilogy" \
            build \
            | tee output/xcodebuild.log

      # ==========================================================
      # LOCATE APP
      # ==========================================================

      - name: Locate built app
        run: |
          set -e

          echo
          echo "===== APPS ====="

          find build \
            -type d \
            -name "*.app" \
            -print


          APP=$(
            find build/Build/Products \
              -type d \
              -name "iDOS.app" \
              | head -1
          )


          if [ -z "$APP" ]; then

            APP=$(
              find build/Build/Products \
                -type d \
                -name "*.app" \
                | head -1
            )

          fi


          if [ -z "$APP" ]; then

            echo "ERROR:"
            echo "APP NOT FOUND"

            exit 1

          fi


          echo "$APP" \
            > output/app-path.txt


          echo
          echo "APP=$APP"

      # ==========================================================
      # PUT REAL GAMES INSIDE APP
      # ==========================================================

      - name: Put real MK1 MK2 MK3 inside app
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )

          rm -rf \
            "$APP/MKGames"

          mkdir -p \
            "$APP/MKGames/mk1"

          mkdir -p \
            "$APP/MKGames/mk2"

          mkdir -p \
            "$APP/MKGames/mk3"


          cp -R \
            games/mk1/. \
            "$APP/MKGames/mk1/"


          cp -R \
            games/mk2/. \
            "$APP/MKGames/mk2/"


          cp -R \
            games/mk3/. \
            "$APP/MKGames/mk3/"


          echo
          echo "===== BUNDLED EXES ====="

          find "$APP/MKGames" \
            -type f \
            \( \
              -iname "MK1.EXE" \
              -o \
              -iname "MK2.EXE" \
              -o \
              -iname "MK3.EXE" \
            \) \
            -print


          MK1=$(
            find \
              "$APP/MKGames/mk1" \
              -maxdepth 1 \
              -type f \
              -iname "MK1.EXE" \
              | head -1
          )

          MK2=$(
            find \
              "$APP/MKGames/mk2" \
              -maxdepth 1 \
              -type f \
              -iname "MK2.EXE" \
              | head -1
          )

          MK3=$(
            find \
              "$APP/MKGames/mk3" \
              -maxdepth 1 \
              -type f \
              -iname "MK3.EXE" \
              | head -1
          )


          test -n "$MK1"
          test -n "$MK2"
          test -n "$MK3"


          echo
          echo "MK1 FILES: $(
            find "$APP/MKGames/mk1" \
              -type f \
              | wc -l
          )"

          echo "MK2 FILES: $(
            find "$APP/MKGames/mk2" \
              -type f \
              | wc -l
          )"

          echo "MK3 FILES: $(
            find "$APP/MKGames/mk3" \
              -type f \
              | wc -l
          )"

      # ==========================================================
      # FINAL PLIST
      # ==========================================================

      - name: Finalize Info plist
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )

          PLIST="$APP/Info.plist"

          plutil \
            -replace CFBundleDisplayName \
            -string "MK Remastered Trilogy" \
            "$PLIST"

          plutil \
            -replace CFBundleIdentifier \
            -string "com.mkremastered.trilogy" \
            "$PLIST"

          echo
          echo "===== FINAL INFO ====="

          plutil -p "$PLIST" \
            | head -60

      # ==========================================================
      # BUILD INFO
      # ==========================================================

      - name: Create build info
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )

          {
            echo "======================================"
            echo "MORTAL KOMBAT REMASTERED TRILOGY"
            echo "======================================"
            echo
            echo "REAL DOS CLASSIC BUILD"
            echo
            echo "FEATURES:"
            echo
            echo "- REAL MK1.EXE"
            echo "- REAL MK2.EXE"
            echo "- REAL MK3.EXE"
            echo "- TRILOGY MAIN MENU"
            echo "- CUSTOM APP ICON"
            echo "- CUSTOM TOUCH CONTROLS"
            echo "- MK1 CORRECT KEYBOARD MAPPING"
            echo "- MK2 NUMPAD MAPPING"
            echo "- MK3 NUMPAD + RUN MAPPING"
            echo "- CLASSIC DISPLAY"
            echo "- CRT+ FX"
            echo "- MK3 CUE MOUNT ATTEMPT"
            echo
            echo "FILES:"
            echo "MK1=$(
              find "$APP/MKGames/mk1" \
                -type f \
                | wc -l
            )"
            echo "MK2=$(
              find "$APP/MKGames/mk2" \
                -type f \
                | wc -l
            )"
            echo "MK3=$(
              find "$APP/MKGames/mk3" \
                -type f \
                | wc -l
            )"
          } \
          > output/BUILD-INFO.txt

          cat \
            output/BUILD-INFO.txt

      # ==========================================================
      # IPA
      # ==========================================================

      - name: Create IPA
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )

          rm -rf Payload

          mkdir Payload

          cp -R \
            "$APP" \
            Payload/


          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            output/MK-Remastered-Trilogy-REAL.ipa


          echo
          echo "===== FINAL IPA ====="

          ls -lh \
            output/MK-Remastered-Trilogy-REAL.ipa

      # ==========================================================
      # SUCCESS
      # ==========================================================

      - name: Upload REAL MK Trilogy IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MK-Remastered-Trilogy-REAL
          path: |
            output/MK-Remastered-Trilogy-REAL.ipa
            output/BUILD-INFO.txt
          compression-level: 0

      # ==========================================================
      # FAILURE
      # ==========================================================

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MK-Trilogy-FAIL
          path: |
            output/xcodebuild.log
            output/BUILD-INFO.txt
          if-no-files-found: ignore
