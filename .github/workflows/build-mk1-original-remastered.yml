          '''

          text = text.replace(
              marker,
              methods + marker,
              1
          )


          layout_pattern = re.compile(
              r'(_rootContainer\s*=\s*'
              r'\[self createSceneView:_currentScene '
              r'frame:viewRect\];\s*'
              r'\[self\.view addSubview:_rootContainer\];\s*'
              r'\[self updateScreen\];)'
          )


          layout_replacement = (
              r'\1'
              '\n\t[self mkInstallRealControls];'
              '\n\t[self mkApplyOriginalRenderMode];'
          )


          text, count = layout_pattern.subn(
              layout_replacement,
              text,
              count=1
          )


          if count != 1:
              raise SystemExit(
                  "ERROR: VIEW LAYOUT PATCH FAILED"
              )


          start_marker = (
              '[[self findGamepad] '
              'applyConfiguration:_gamepadConfig];'
          )


          if start_marker not in text:
              raise SystemExit(
                  "ERROR: EMULATOR START MARKER NOT FOUND"
              )


          start_replacement = (
              start_marker +
              '\n\t[self mkInstallRealControls];' +
              '\n\t[self mkApplyOriginalRenderMode];'
          )


          text = text.replace(
              start_marker,
              start_replacement,
              1
          )


          with open(
              path,
              "w",
              encoding="utf-8"
          ) as file:
              file.write(text)


          print(
              "MK1 REAL TOUCH + RENDER MODE PATCHED"
          )
          PY

