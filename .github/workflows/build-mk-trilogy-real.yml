name: Build REAL MK Remastered Trilogy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        run: |
          set -e

          brew install innoextract p7zip

          python3 -m pip install \
            --break-system-packages pillow || \
          python3 -m pip install \
            --user pillow

          xcodebuild -version
          innoextract --version

      # ==========================================================
      # CLEAN
      # ==========================================================

      - name: Prepare folders
        run: |
          set -e

          rm -rf raw-installers
          rm -rf installers
          rm -rf release-files
          rm -rf extracted
          rm -rf games
          rm -rf dospad
          rm -rf build
          rm -rf Payload
          rm -rf output

          mkdir -p raw-installers
          mkdir -p installers
          mkdir -p release-files
          mkdir -p extracted
          mkdir -p games/mk1
          mkdir -p games/mk2
          mkdir -p games/mk3
          mkdir -p output

      # ==========================================================
      # GET INSTALLERS FROM REPOSITORY
      # ==========================================================

      - name: Collect installers from repository
        run: |
          set -e

          COUNT=0

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            COUNT=$((COUNT + 1))

            echo "FOUND: $FILE"

            cp "$FILE" \
              "raw-installers/repo_${COUNT}.exe"

          done < <(
            find . \
              -type f \
              -iname "*.exe" \
              -not -path "./.git/*" \
              -not -path "./raw-installers/*" \
              -not -path "./installers/*" \
              -not -path "./release-files/*" \
              -not -path "./extracted/*" \
              -not -path "./games/*" \
              -not -path "./dospad/*" \
              | sort
          )

          echo "===== REPOSITORY INSTALLERS ====="
          ls -lh raw-installers || true

      # ==========================================================
      # GET BIG INSTALLER FROM RELEASE
      # ==========================================================

      - name: Download installers from latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          echo "===== RELEASES ====="

          gh release list

          TAG=$(
            gh release list \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName'
          )

          echo "TAG=$TAG"

          if [ -n "$TAG" ]; then
            gh release download "$TAG" \
              --dir release-files \
              --pattern "*.exe"
          fi

          N=0

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            N=$((N + 1))

            cp "$FILE" \
              "raw-installers/release_${N}.exe"

          done < <(
            find release-files \
              -type f \
              -iname "*.exe" \
              | sort
          )

          echo "===== ALL RAW INSTALLERS ====="
          ls -lh raw-installers

          exit 0

      # ==========================================================
      # REMOVE DUPLICATES
      # ==========================================================

      - name: Deduplicate installers
        run: |
          set -e

          for FILE in raw-installers/*.exe; do
            [ -f "$FILE" ] || continue

            HASH=$(
              shasum -a 256 "$FILE" \
                | awk '{print $1}'
            )

            DEST="installers/${HASH}.exe"

            if [ ! -f "$DEST" ]; then
              cp "$FILE" "$DEST"
            fi
          done

          echo "===== UNIQUE INSTALLERS ====="

          ls -lh installers

          COUNT=$(
            find installers \
              -type f \
              -iname "*.exe" \
              | wc -l \
              | tr -d ' '
          )

          echo "COUNT=$COUNT"

          if [ "$COUNT" -lt 3 ]; then
            echo "ERROR: NEED 3 INSTALLERS"
            exit 1
          fi

      # ==========================================================
      # EXTRACT
      # ==========================================================

      - name: Extract installers
        run: |
          set -e

          N=0

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            N=$((N + 1))
            DEST="extracted/pkg${N}"

            mkdir -p "$DEST"

            echo
            echo "================================"
            echo "EXTRACTING: $FILE"
            echo "================================"

            set +e

            innoextract \
              --extract \
              --output-dir "$DEST" \
              "$FILE"

            RESULT=$?

            if [ "$RESULT" -ne 0 ]; then
              echo "Trying 7z..."

              7z x \
                "$FILE" \
                "-o$DEST" \
                -y
            fi

            set -e

          done < <(
            find installers \
              -type f \
              -iname "*.exe" \
              | sort
          )

          echo
          echo "===== GAME EXECUTABLES ====="

          find extracted \
            -type f \
            \( \
              -iname "MK1.EXE" \
              -o -iname "MK2.EXE" \
              -o -iname "MK3.EXE" \
            \) \
            -print

      # ==========================================================
      # NORMALIZE
      # IMPORTANT: IGNORE __support
      # ==========================================================

      - name: Normalize game folders
        run: |
          set -e

          MK1_EXE=$(
            find extracted \
              -type f \
              -iname "MK1.EXE" \
              -not -path "*/__support/*" \
              | head -1
          )

          MK2_EXE=$(
            find extracted \
              -type f \
              -iname "MK2.EXE" \
              -not -path "*/__support/*" \
              | head -1
          )

          MK3_EXE=$(
            find extracted \
              -type f \
              -iname "MK3.EXE" \
              -not -path "*/__support/*" \
              | head -1
          )

          echo "MK1_EXE=$MK1_EXE"
          echo "MK2_EXE=$MK2_EXE"
          echo "MK3_EXE=$MK3_EXE"

          if [ -z "$MK1_EXE" ]; then
            echo "ERROR: REAL MK1.EXE NOT FOUND"
            exit 1
          fi

          if [ -z "$MK2_EXE" ]; then
            echo "ERROR: REAL MK2.EXE NOT FOUND"
            exit 1
          fi

          if [ -z "$MK3_EXE" ]; then
            echo "ERROR: REAL MK3.EXE NOT FOUND"
            exit 1
          fi

          MK1_SRC="$(dirname "$MK1_EXE")"
          MK2_SRC="$(dirname "$MK2_EXE")"
          MK3_SRC="$(dirname "$MK3_EXE")"

          echo "MK1_SRC=$MK1_SRC"
          echo "MK2_SRC=$MK2_SRC"
          echo "MK3_SRC=$MK3_SRC"

          rm -rf games/mk1
          rm -rf games/mk2
          rm -rf games/mk3

          mkdir -p games/mk1
          mkdir -p games/mk2
          mkdir -p games/mk3

          cp -R "$MK1_SRC"/. games/mk1/
          cp -R "$MK2_SRC"/. games/mk2/
          cp -R "$MK3_SRC"/. games/mk3/

          echo "===== VALIDATE ====="

          test -n "$(
            find games/mk1 \
              -maxdepth 1 \
              -type f \
              -iname "MK1.EXE" \
              | head -1
          )"

          test -n "$(
            find games/mk2 \
              -maxdepth 1 \
              -type f \
              -iname "MK2.EXE" \
              | head -1
          )"

          test -n "$(
            find games/mk3 \
              -maxdepth 1 \
              -type f \
              -iname "MK3.EXE" \
              | head -1
          )"

          echo "MK1 FILES=$(find games/mk1 -type f | wc -l)"
          echo "MK2 FILES=$(find games/mk2 -type f | wc -l)"
          echo "MK3 FILES=$(find games/mk3 -type f | wc -l)"

          echo "NORMALIZATION SUCCESS"

      # ==========================================================
      # CLONE IDOS
      # ==========================================================

      - name: Clone iDOS
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/litchie/dospad.git \
            dospad

          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -list

      # ==========================================================
      # CONFIG
      # ==========================================================

      - name: Create game DOS configs
        run: |
          set -e

          for GAME in mk1 mk2 mk3; do

            mkdir -p \
              "games/$GAME/config"

            cp \
              dospad/Resources/configs/dospad.cfg \
              "games/$GAME/config/dospad.cfg"

          done

          python3 <<'PY'
          from pathlib import Path
          import re

          for game in ["mk1", "mk2", "mk3"]:
              path = Path(
                  f"games/{game}/config/dospad.cfg"
              )

              text = path.read_text(
                  errors="ignore"
              )

              text = re.sub(
                  r"(?m)^frameskip\s*=.*$",
                  "frameskip=0",
                  text
              )

              text = re.sub(
                  r"(?m)^core\s*=.*$",
                  "core=dynamic",
                  text
              )

              text = re.sub(
                  r"(?m)^cycles\s*=.*$",
                  "cycles=max 95%",
                  text
              )

              path.write_text(text)

          print("DOS CONFIGS READY")
          PY

      # ==========================================================
      # AUTO BOOT COMMANDS
      # ==========================================================

      - name: Create MK boot commands
        run: |
          set -e

          cat > games/mk1/MKAUTO.TXT <<'EOF'
          MK1.EXE
          EOF

          cat > games/mk2/MKAUTO.TXT <<'EOF'
          MK2.EXE
          EOF

          if [ -f "games/mk3/IMAGE/MK3.cue" ]; then

            cat > games/mk3/MKAUTO.TXT <<'EOF'
          imgmount d "C:\IMAGE\MK3.cue" -t iso
          MK3.EXE
          EOF

          else

            cat > games/mk3/MKAUTO.TXT <<'EOF'
          MK3.EXE
          EOF

          fi

          echo "===== MK1 AUTO ====="
          cat games/mk1/MKAUTO.TXT

          echo "===== MK2 AUTO ====="
          cat games/mk2/MKAUTO.TXT

          echo "===== MK3 AUTO ====="
          cat games/mk3/MKAUTO.TXT

      # ==========================================================
      # PATCH AUTOBOOT
      # ==========================================================

      - name: Patch MK auto boot
        run: |
          set -e

          FILE="dospad/dospad/Main/DOSPadEmulator.m"

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          text = open(
              path,
              "r",
              encoding="utf-8"
          ).read()

          marker = (
              '[self.commandList '
              'addObject:@"REM END AUTOMOUNT"];'
          )

          if marker not in text:
              raise SystemExit(
                  "ERROR: AUTOBOOT MARKER NOT FOUND"
              )

          if "MKTRILOGY_AUTOBOOT" in text:
              raise SystemExit(0)

          patch = marker + r'''

              // ==================================================
              // MKTRILOGY_AUTOBOOT
              // ==================================================

              NSString *mkBootFile =
                  [self.workingDirectory.path
                   stringByAppendingPathComponent:
                   @"MKAUTO.TXT"];

              if ([[NSFileManager defaultManager]
                   fileExistsAtPath:mkBootFile])
              {
                  NSError *mkError = nil;

                  NSString *mkCommands =
                      [NSString
                       stringWithContentsOfFile:mkBootFile
                       encoding:NSUTF8StringEncoding
                       error:&mkError];

                  if (mkCommands.length > 0)
                  {
                      NSArray *mkLines =
                          [mkCommands
                           componentsSeparatedByCharactersInSet:
                           [NSCharacterSet newlineCharacterSet]];

                      for (NSString *rawLine in mkLines)
                      {
                          NSString *line =
                              [rawLine
                               stringByTrimmingCharactersInSet:
                               [NSCharacterSet
                                whitespaceAndNewlineCharacterSet]];

                          if (line.length > 0)
                          {
                              [self.commandList
                               addObject:line];
                          }
                      }
                  }
              }

              // ===== END MKTRILOGY_AUTOBOOT =====
          '''

          text = text.replace(
              marker,
              patch,
              1
          )

          open(
              path,
              "w",
              encoding="utf-8"
          ).write(text)

          print("MK AUTOBOOT PATCH OK")
          PY

      # ==========================================================
      # NATIVE TRILOGY MENU
      # ==========================================================

      - name: Add MK Trilogy launcher
        run: |
          set -e

          FILE="dospad/dospad/Main/DPAppDelegate.m"

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          text = open(
              path,
              "r",
              encoding="utf-8"
          ).read()

          if "MKTRILOGY_MAIN_MENU" in text:
              raise SystemExit(0)

          import_marker = (
              '#import <AVFoundation/AVFoundation.h>'
          )

          if import_marker not in text:
              raise SystemExit(
                  "ERROR: APP DELEGATE IMPORT MARKER NOT FOUND"
              )

          menu_code = r'''

          // ======================================================
          // MKTRILOGY_MAIN_MENU
          // ======================================================

          @interface DPAppDelegate (MKTrilogy)

          - (void)mkShowLauncher;
          - (void)mkLaunchGame:(NSString *)game;

          @end


          @interface MKTrilogyLauncherViewController
              : UIViewController

          @property(nonatomic, weak)
          DPAppDelegate *owner;

          @property(nonatomic, strong)
          UILabel *titleLabel;

          @property(nonatomic, strong)
          UILabel *subtitleLabel;

          @property(nonatomic, strong)
          UILabel *chooseLabel;

          @property(nonatomic, strong)
          UISegmentedControl *filterControl;

          @property(nonatomic, strong)
          UIButton *mk1Button;

          @property(nonatomic, strong)
          UIButton *mk2Button;

          @property(nonatomic, strong)
          UIButton *mk3Button;

          @end


          @implementation
          MKTrilogyLauncherViewController


          - (UIButton *)mkButton:
              (NSString *)title
              game:(NSString *)game
          {
              UIButton *button =
                  [UIButton
                   buttonWithType:UIButtonTypeSystem];

              button.accessibilityIdentifier =
                  game;

              [button
               setTitle:title
               forState:UIControlStateNormal];

              [button
               setTitleColor:
               UIColor.whiteColor
               forState:UIControlStateNormal];

              button.titleLabel.font =
                  [UIFont
                   systemFontOfSize:20
                   weight:UIFontWeightBlack];

              button.backgroundColor =
                  [UIColor
                   colorWithRed:0.38
                   green:0.015
                   blue:0.02
                   alpha:1.0];

              button.layer.cornerRadius =
                  14;

              button.layer.borderWidth =
                  1;

              button.layer.borderColor =
                  [UIColor
                   colorWithWhite:1
                   alpha:0.17].CGColor;

              [button
               addTarget:self
               action:@selector(gamePressed:)
               forControlEvents:
               UIControlEventTouchUpInside];

              return button;
          }


          - (void)viewDidLoad
          {
              [super viewDidLoad];

              self.view.backgroundColor =
                  [UIColor
                   colorWithRed:0.018
                   green:0.008
                   blue:0.012
                   alpha:1.0];


              UIView *redGlow =
                  [[UIView alloc]
                   initWithFrame:CGRectZero];

              redGlow.tag =
                  7700;

              redGlow.backgroundColor =
                  [UIColor
                   colorWithRed:0.28
                   green:0.01
                   blue:0.015
                   alpha:0.38];

              redGlow.userInteractionEnabled =
                  NO;

              [self.view addSubview:redGlow];


              self.titleLabel =
                  [[UILabel alloc] init];

              self.titleLabel.text =
                  @"MORTAL KOMBAT";

              self.titleLabel.textAlignment =
                  NSTextAlignmentCenter;

              self.titleLabel.textColor =
                  UIColor.whiteColor;

              self.titleLabel.font =
                  [UIFont
                   systemFontOfSize:40
                   weight:UIFontWeightBlack];

              [self.view
               addSubview:self.titleLabel];


              self.subtitleLabel =
                  [[UILabel alloc] init];

              self.subtitleLabel.text =
                  @"REMASTERED TRILOGY";

              self.subtitleLabel.textAlignment =
                  NSTextAlignmentCenter;

              self.subtitleLabel.textColor =
                  [UIColor
                   colorWithRed:1
                   green:0.10
                   blue:0.08
                   alpha:1];

              self.subtitleLabel.font =
                  [UIFont
                   systemFontOfSize:20
                   weight:UIFontWeightBlack];

              [self.view
               addSubview:self.subtitleLabel];


              self.chooseLabel =
                  [[UILabel alloc] init];

              self.chooseLabel.text =
                  @"CHOOSE YOUR MK";

              self.chooseLabel.textAlignment =
                  NSTextAlignmentCenter;

              self.chooseLabel.textColor =
                  [UIColor
                   colorWithWhite:0.80
                   alpha:1];

              self.chooseLabel.font =
                  [UIFont
                   systemFontOfSize:14
                   weight:UIFontWeightBold];

              [self.view
               addSubview:self.chooseLabel];


              self.filterControl =
                  [[UISegmentedControl alloc]
                   initWithItems:
                   @[
                     @"CLASSIC",
                     @"CRT+"
                   ]];


              BOOL enhanced =
                  [[NSUserDefaults
                    standardUserDefaults]
                   boolForKey:@"MKEnhanced"];


              self.filterControl
                  .selectedSegmentIndex =
                  enhanced ? 1 : 0;


              if (@available(iOS 13.0, *))
              {
                  self.filterControl
                      .selectedSegmentTintColor =
                      [UIColor
                       colorWithRed:0.60
                       green:0.025
                       blue:0.025
                       alpha:1];
              }


              [self.filterControl
               addTarget:self
               action:@selector(filterChanged:)
               forControlEvents:
               UIControlEventValueChanged];


              [self.view
               addSubview:self.filterControl];


              self.mk1Button =
                  [self
                   mkButton:@"MORTAL KOMBAT"
                   game:@"mk1"];


              self.mk2Button =
                  [self
                   mkButton:@"MORTAL KOMBAT II"
                   game:@"mk2"];


              self.mk3Button =
                  [self
                   mkButton:@"MORTAL KOMBAT 3"
                   game:@"mk3"];


              [self.view
               addSubview:self.mk1Button];

              [self.view
               addSubview:self.mk2Button];

              [self.view
               addSubview:self.mk3Button];
          }


          - (void)filterChanged:
              (UISegmentedControl *)control
          {
              BOOL enabled =
                  control.selectedSegmentIndex == 1;

              [[NSUserDefaults
                standardUserDefaults]
               setBool:enabled
               forKey:@"MKEnhanced"];

              [[NSUserDefaults
                standardUserDefaults]
               synchronize];
          }


          - (void)gamePressed:
              (UIButton *)button
          {
              NSString *game =
                  button.accessibilityIdentifier;

              if (game.length == 0)
                  return;

              self.chooseLabel.text =
                  @"LOADING...";

              self.mk1Button.enabled =
                  NO;

              self.mk2Button.enabled =
                  NO;

              self.mk3Button.enabled =
                  NO;

              [self.owner
               mkLaunchGame:game];
          }


          - (void)viewDidLayoutSubviews
          {
              [super viewDidLayoutSubviews];

              CGFloat width =
                  CGRectGetWidth(
                      self.view.bounds
                  );

              CGFloat height =
                  CGRectGetHeight(
                      self.view.bounds
                  );


              UIView *glow =
                  [self.view
                   viewWithTag:7700];


              glow.frame =
                  CGRectMake(
                      0,
                      0,
                      width,
                      155
                  );


              self.titleLabel.frame =
                  CGRectMake(
                      0,
                      12,
                      width,
                      48
                  );


              self.subtitleLabel.frame =
                  CGRectMake(
                      0,
                      58,
                      width,
                      28
                  );


              self.chooseLabel.frame =
                  CGRectMake(
                      0,
                      88,
                      width,
                      20
                  );


              self.filterControl.frame =
                  CGRectMake(
                      (width - 250) / 2,
                      115,
                      250,
                      31
                  );


              CGFloat buttonWidth =
                  MIN(
                      430,
                      width - 100
                  );


              CGFloat x =
                  (width - buttonWidth) / 2;


              CGFloat buttonHeight =
                  55;


              CGFloat gap =
                  12;


              CGFloat y =
                  168;


              self.mk1Button.frame =
                  CGRectMake(
                      x,
                      y,
                      buttonWidth,
                      buttonHeight
                  );


              self.mk2Button.frame =
                  CGRectMake(
                      x,
                      y +
                      buttonHeight +
                      gap,
                      buttonWidth,
                      buttonHeight
                  );


              self.mk3Button.frame =
                  CGRectMake(
                      x,
                      y +
                      (buttonHeight + gap) * 2,
                      buttonWidth,
                      buttonHeight
                  );


              if (
                  CGRectGetMaxY(
                      self.mk3Button.frame
                  ) > height - 10
              )
              {
                  CGFloat scale =
                      0.90;

                  self.mk1Button.transform =
                      CGAffineTransformMakeScale(
                          scale,
                          scale
                      );

                  self.mk2Button.transform =
                      CGAffineTransformMakeScale(
                          scale,
                          scale
                      );

                  self.mk3Button.transform =
                      CGAffineTransformMakeScale(
                          scale,
                          scale
                      );
              }
          }


          - (BOOL)prefersStatusBarHidden
          {
              return YES;
          }


          - (UIInterfaceOrientationMask)
              supportedInterfaceOrientations
          {
              return
                  UIInterfaceOrientationMaskLandscape;
          }


          @end

          // ===== END MKTRILOGY_MAIN_MENU =====
          '''

          text = text.replace(
              import_marker,
              import_marker +
              "\n" +
              menu_code,
              1
          )


          old_start = (
              '[self performSelector:'
              '@selector(startDOS) '
              'withObject:nil '
              'afterDelay:1];'
          )


          new_start = (
              '[self performSelector:'
              '@selector(mkShowLauncher) '
              'withObject:nil '
              'afterDelay:0.25];'
          )


          if old_start not in text:
              raise SystemExit(
                  "ERROR: STARTDOS CALL NOT FOUND"
              )


          text = text.replace(
              old_start,
              new_start,
              1
          )


          method_marker = (
              '-(void)setWindowTitle:(char *)title'
          )


          if method_marker not in text:
              raise SystemExit(
                  "ERROR: METHOD MARKER NOT FOUND"
              )


          methods = r'''

          // ======================================================
          // MK LAUNCH METHODS
          // ======================================================

          - (void)mkShowLauncher
          {
              if ([DOSPadEmulator
                   sharedInstance].started)
              {
                  return;
              }


              MKTrilogyLauncherViewController
                  *launcher =
                  [[MKTrilogyLauncherViewController
                    alloc] init];


              launcher.owner =
                  self;


              launcher.modalPresentationStyle =
                  UIModalPresentationFullScreen;


              [self.emulatorController
               presentViewController:
               launcher
               animated:NO
               completion:nil];
          }


          - (void)mkLaunchGame:
              (NSString *)game
          {
              NSFileManager *fm =
                  [NSFileManager
                   defaultManager];


              NSString *bundleRoot =
                  [[[NSBundle
                     mainBundle]
                    bundlePath]
                   stringByAppendingPathComponent:
                   @"MKGames"];


              NSString *source =
                  [bundleRoot
                   stringByAppendingPathComponent:
                   game];


              NSString *documents =
                  [NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                   ) lastObject];


              NSString *root =
                  [documents
                   stringByAppendingPathComponent:
                   @"MKTrilogy"];


              NSString *destination =
                  [root
                   stringByAppendingPathComponent:
                   game];


              [fm
               createDirectoryAtPath:
               root
               withIntermediateDirectories:YES
               attributes:nil
               error:nil];


              NSString *exe =
                  nil;


              if ([game
                   isEqualToString:@"mk1"])
              {
                  exe =
                      @"MK1.EXE";
              }

              else if ([game
                        isEqualToString:@"mk2"])
              {
                  exe =
                      @"MK2.EXE";
              }

              else
              {
                  exe =
                      @"MK3.EXE";
              }


              NSString *exePath =
                  [destination
                   stringByAppendingPathComponent:
                   exe];


              if (![fm
                    fileExistsAtPath:exePath])
              {
                  [fm
                   removeItemAtPath:
                   destination
                   error:nil];


                  NSError *copyError =
                      nil;


                  BOOL copied =
                      [fm
                       copyItemAtPath:
                       source
                       toPath:
                       destination
                       error:
                       &copyError];


                  if (!copied)
                  {
                      UIAlertController *alert =
                          [UIAlertController
                           alertControllerWithTitle:
                           @"GAME COPY ERROR"
                           message:
                           copyError.localizedDescription
                           preferredStyle:
                           UIAlertControllerStyleAlert];


                      [alert
                       addAction:
                       [UIAlertAction
                        actionWithTitle:
                        @"OK"
                        style:
                        UIAlertActionStyleDefault
                        handler:nil]];


                      [
                       self.emulatorController
                       .presentedViewController
                       presentViewController:
                       alert
                       animated:YES
                       completion:nil
                      ];

                      return;
                  }
              }


              [[NSUserDefaults
                standardUserDefaults]
               setObject:game
