name: Build REAL MK Remastered Trilogy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        run: |
          set -e

          brew install innoextract p7zip

          python3 -m pip install \
            --break-system-packages pillow || \
          python3 -m pip install \
            --user pillow

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== TOOLS ====="
          innoextract --version
          7z | head -5 || true

      # ==========================================================
      # FOLDERS
      # ==========================================================

      - name: Prepare folders
        run: |
          set -e

          rm -rf raw-installers
          rm -rf installers
          rm -rf release-files
          rm -rf extracted
          rm -rf games
          rm -rf output

          mkdir -p raw-installers
          mkdir -p installers
          mkdir -p release-files
          mkdir -p extracted
          mkdir -p games/mk1
          mkdir -p games/mk2
          mkdir -p games/mk3
          mkdir -p output

      # ==========================================================
      # COLLECT INSTALLERS FROM REPOSITORY
      # ==========================================================

      - name: Collect installers from repository
        run: |
          set -e

          N=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            N=$((N + 1))

            cp "$FILE" \
              "raw-installers/repo_${N}.exe"

          done < <(
            find . \
              -type f \
              -iname "*.exe" \
              -not -path "./.git/*" \
              -not -path "./raw-installers/*" \
              -not -path "./installers/*" \
              -not -path "./release-files/*" \
              -not -path "./extracted/*" \
              -not -path "./games/*" \
              | sort
          )

          echo "===== REPOSITORY EXE ====="
          ls -lh raw-installers || true

      # ==========================================================
      # DOWNLOAD LARGE INSTALLER FROM LATEST RELEASE
      # ==========================================================

      - name: Download installers from latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          echo "===== RELEASES ====="
          gh release list

          TAG=$(
            gh release list \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName'
          )

          echo "Latest tag: $TAG"

          if [ -n "$TAG" ]; then
            gh release download "$TAG" \
              --dir release-files \
              --pattern "*.exe"
          fi

          N=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            N=$((N + 1))

            cp "$FILE" \
              "raw-installers/release_${N}.exe"

          done < <(
            find release-files \
              -type f \
              -iname "*.exe" \
              | sort
          )

          echo "===== ALL RAW INSTALLERS ====="
          ls -lh raw-installers

          exit 0

      # ==========================================================
      # REMOVE DUPLICATES
      # ==========================================================

      - name: Deduplicate installers
        run: |
          set -e

          for FILE in raw-installers/*.exe; do

            [ -f "$FILE" ] || continue

            HASH=$(
              shasum -a 256 "$FILE" \
              | awk '{print $1}'
            )

            DEST="installers/${HASH}.exe"

            if [ ! -f "$DEST" ]; then
              cp "$FILE" "$DEST"
            fi

          done

          echo "===== UNIQUE INSTALLERS ====="
          ls -lh installers

          COUNT=$(
            find installers \
              -type f \
              -iname "*.exe" \
              | wc -l \
              | tr -d ' '
          )

          echo "Unique installers: $COUNT"

          if [ "$COUNT" -lt 3 ]; then
            echo "ERROR: Need all 3 MK installers."
            exit 1
          fi

      # ==========================================================
      # EXTRACT ALL
      # ==========================================================

      - name: Extract MK installers
        run: |
          set -e

          N=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            N=$((N + 1))
            DEST="extracted/pkg${N}"

            mkdir -p "$DEST"

            echo
            echo "==================================="
            echo "EXTRACTING $FILE"
            echo "==================================="

            set +e

            innoextract \
              --extract \
              --output-dir "$DEST" \
              "$FILE"

            RESULT=$?

            if [ "$RESULT" -ne 0 ]; then

              echo "innoextract failed -> trying 7z"

              7z x \
                "$FILE" \
                "-o$DEST" \
                -y

            fi

            set -e

          done < <(
            find installers \
              -type f \
              -iname "*.exe" \
              | sort
          )

          echo
          echo "===== FOUND GAME EXES ====="

          find extracted \
            -type f \
            \( \
              -iname "MK1.EXE" \
              -o -iname "MK2.EXE" \
              -o -iname "MK3.EXE" \
            \) \
            -print

      # ==========================================================
      # NORMALIZE MK1 / MK2 / MK3
      # ==========================================================

      - name: Normalize game folders
        run: |
          set -e

          MK1_SRC=$(
            find extracted \
              -type d \
              -path "*/app/mk1" \
              | head -1
          )

          MK2_SRC=$(
            find extracted \
              -type d \
              -path "*/app/mk2" \
              | head -1
          )

          MK3_SRC=$(
            find extracted \
              -type d \
              -path "*/app/mk3" \
              | head -1
          )

          echo "MK1_SRC=$MK1_SRC"
          echo "MK2_SRC=$MK2_SRC"
          echo "MK3_SRC=$MK3_SRC"

          if [ -z "$MK1_SRC" ]; then
            MK1_EXE=$(find extracted -type f -iname "MK1.EXE" | head -1)
            MK1_SRC=$(dirname "$MK1_EXE")
          fi

          if [ -z "$MK2_SRC" ]; then
            MK2_EXE=$(find extracted -type f -iname "MK2.EXE" | head -1)
            MK2_SRC=$(dirname "$MK2_EXE")
          fi

          if [ -z "$MK3_SRC" ]; then
            MK3_EXE=$(find extracted -type f -iname "MK3.EXE" | head -1)
            MK3_SRC=$(dirname "$MK3_EXE")
          fi

          if [ ! -d "$MK1_SRC" ]; then
            echo "ERROR: MK1 folder missing"
            exit 1
          fi

          if [ ! -d "$MK2_SRC" ]; then
            echo "ERROR: MK2 folder missing"
            exit 1
          fi

          if [ ! -d "$MK3_SRC" ]; then
            echo "ERROR: MK3 folder missing"
            exit 1
          fi

          rm -rf games/mk1/*
          rm -rf games/mk2/*
          rm -rf games/mk3/*

          cp -R "$MK1_SRC"/. games/mk1/
          cp -R "$MK2_SRC"/. games/mk2/
          cp -R "$MK3_SRC"/. games/mk3/

          echo "===== VALIDATE ====="

          test -n "$(find games/mk1 -maxdepth 1 -type f -iname 'MK1.EXE' | head -1)"
          test -n "$(find games/mk2 -maxdepth 1 -type f -iname 'MK2.EXE' | head -1)"
          test -n "$(find games/mk3 -maxdepth 1 -type f -iname 'MK3.EXE' | head -1)"

          echo "MK1 files: $(find games/mk1 -type f | wc -l)"
          echo "MK2 files: $(find games/mk2 -type f | wc -l)"
          echo "MK3 files: $(find games/mk3 -type f | wc -l)"

      # ==========================================================
      # CLONE iDOS / DOSBOX
      # ==========================================================

      - name: Clone iDOS
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/litchie/dospad.git \
            dospad

          echo "===== XCODE PROJECT ====="

          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -list

      # ==========================================================
      # PATCH DOSBOX AUTO BOOT
      # ==========================================================

      - name: Add MK auto boot support
        run: |
          set -e

          FILE="dospad/dospad/Main/DOSPadEmulator.m"

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          data = open(
              path,
              "r",
              encoding="utf-8"
          ).read()

          marker = '[self.commandList addObject:@"REM END AUTOMOUNT"];'

          if marker not in data:
              raise SystemExit(
                  "ERROR: DOSPad auto-mount marker not found"
              )

          if "MKTRILOGY AUTOBOOT" in data:
              raise SystemExit(0)

          patch = marker + r'''

              // ==================================================
              // MKTRILOGY AUTOBOOT
              // ==================================================

              NSString *mkAutoFile =
                  [self.workingDirectory.path
                   stringByAppendingPathComponent:@"MKAUTO.TXT"];

              if ([[NSFileManager defaultManager]
                   fileExistsAtPath:mkAutoFile])
              {
                  NSError *mkError = nil;

                  NSString *mkCommands =
                      [NSString
                       stringWithContentsOfFile:mkAutoFile
                       encoding:NSUTF8StringEncoding
                       error:&mkError];

                  if (mkCommands.length > 0)
                  {
                      NSArray *mkLines =
                          [mkCommands
                           componentsSeparatedByCharactersInSet:
                           [NSCharacterSet newlineCharacterSet]];

                      for (NSString *mkRawLine in mkLines)
                      {
                          NSString *mkLine =
                              [mkRawLine
                               stringByTrimmingCharactersInSet:
                               [NSCharacterSet
                                whitespaceAndNewlineCharacterSet]];

                          if (mkLine.length > 0)
                          {
                              [self.commandList
                               addObject:mkLine];
                          }
                      }
                  }
              }

              // ===== END MKTRILOGY AUTOBOOT =====
          '''

          data = data.replace(
              marker,
              patch,
              1
          )

          open(
              path,
              "w",
              encoding="utf-8"
          ).write(data)

          print("MK autoboot patch OK")
          PY

      # ==========================================================
      # CREATE REAL TRILOGY LAUNCHER
      # ==========================================================

      - name: Add MK Trilogy launcher
        run: |
          set -e

          FILE="dospad/dospad/Main/DPAppDelegate.m"

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          data = open(
              path,
              "r",
              encoding="utf-8"
          ).read()

          if "MKTRILOGY_NATIVE_MENU" in data:
              print("Launcher already patched")
              raise SystemExit(0)

          import_marker = '#import <AVFoundation/AVFoundation.h>'

          if import_marker not in data:
              raise SystemExit(
                  "ERROR: AVFoundation import marker missing"
              )

          launcher = r'''
          #import <QuartzCore/QuartzCore.h>

          // ======================================================
          // MKTRILOGY_NATIVE_MENU
          // ======================================================

          @interface DPAppDelegate (MKTrilogyBridge)
          - (void)mkLaunchGame:(NSString *)game;
          @end

          @interface MKTrilogyLauncherViewController : UIViewController

          @property (nonatomic, weak) DPAppDelegate *owner;

          @property (nonatomic, strong) CAGradientLayer *backgroundGradient;

          @property (nonatomic, strong) UILabel *titleLabel;
          @property (nonatomic, strong) UILabel *subtitleLabel;
          @property (nonatomic, strong) UILabel *chooseLabel;
          @property (nonatomic, strong) UILabel *footerLabel;

          @property (nonatomic, strong) UISegmentedControl *filterControl;

          @property (nonatomic, strong) UIButton *mk1Button;
          @property (nonatomic, strong) UIButton *mk2Button;
          @property (nonatomic, strong) UIButton *mk3Button;

          @end

          @implementation MKTrilogyLauncherViewController

          - (void)viewDidLoad
          {
              [super viewDidLoad];

              self.view.backgroundColor = UIColor.blackColor;

              self.backgroundGradient =
                  [CAGradientLayer layer];

              self.backgroundGradient.colors = @[
                  (id)[UIColor
                       colorWithRed:0.18
                       green:0.005
                       blue:0.01
                       alpha:1.0].CGColor,

                  (id)[UIColor
                       colorWithRed:0.015
                       green:0.015
                       blue:0.022
                       alpha:1.0].CGColor,

                  (id)UIColor.blackColor.CGColor
              ];

              self.backgroundGradient.locations =
                  @[@0.0, @0.46, @1.0];

              [self.view.layer
               insertSublayer:self.backgroundGradient
               atIndex:0];

              self.titleLabel =
                  [[UILabel alloc] init];

              self.titleLabel.text =
                  @"MORTAL KOMBAT";

              self.titleLabel.textColor =
                  UIColor.whiteColor;

              self.titleLabel.textAlignment =
                  NSTextAlignmentCenter;

              self.titleLabel.font =
                  [UIFont
                   systemFontOfSize:34
                   weight:UIFontWeightBlack];

              [self.view
               addSubview:self.titleLabel];


              self.subtitleLabel =
                  [[UILabel alloc] init];

              self.subtitleLabel.text =
                  @"REMASTERED TRILOGY";

              self.subtitleLabel.textColor =
                  [UIColor
                   colorWithRed:0.9
                   green:0.07
                   blue:0.05
                   alpha:1.0];

              self.subtitleLabel.textAlignment =
                  NSTextAlignmentCenter;

              self.subtitleLabel.font =
                  [UIFont
                   systemFontOfSize:18
                   weight:UIFontWeightBold];

              [self.view
               addSubview:self.subtitleLabel];


              self.chooseLabel =
                  [[UILabel alloc] init];

              self.chooseLabel.text =
                  @"CHOOSE YOUR MK";

              self.chooseLabel.textColor =
                  [UIColor
                   colorWithWhite:0.82
                   alpha:1.0];

              self.chooseLabel.textAlignment =
                  NSTextAlignmentCenter;

              self.chooseLabel.font =
                  [UIFont
                   systemFontOfSize:14
                   weight:UIFontWeightSemibold];

              [self.view
               addSubview:self.chooseLabel];


              self.filterControl =
                  [[UISegmentedControl alloc]
                   initWithItems:@[
                      @"CLASSIC",
                      @"CRT+"
                   ]];

              NSInteger fx =
                  [[NSUserDefaults standardUserDefaults]
                   boolForKey:@"MKEnhanced"]
                  ? 1
                  : 0;

              self.filterControl.selectedSegmentIndex = fx;

              if (@available(iOS 13.0, *))
              {
                  self.filterControl.selectedSegmentTintColor =
                      [UIColor
                       colorWithRed:0.55
                       green:0.02
                       blue:0.02
                       alpha:1.0];
              }

              [self.filterControl
               addTarget:self
               action:@selector(filterChanged:)
               forControlEvents:UIControlEventValueChanged];

              [self.view
               addSubview:self.filterControl];


              self.mk1Button =
                  [self mkButton:@"MORTAL KOMBAT"
                              tag:1];

              self.mk2Button =
                  [self mkButton:@"MORTAL KOMBAT II"
                              tag:2];

              self.mk3Button =
                  [self mkButton:@"MORTAL KOMBAT 3"
                              tag:3];

              [self.view addSubview:self.mk1Button];
              [self.view addSubview:self.mk2Button];
              [self.view addSubview:self.mk3Button];


              self.footerLabel =
                  [[UILabel alloc] init];

              self.footerLabel.text =
                  @"REAL CLASSIC ENGINE  •  TOUCH CONTROLS  •  CRT FILTER";

              self.footerLabel.textColor =
                  [UIColor
                   colorWithWhite:0.5
                   alpha:1.0];

              self.footerLabel.textAlignment =
                  NSTextAlignmentCenter;

              self.footerLabel.font =
                  [UIFont
                   systemFontOfSize:10
                   weight:UIFontWeightMedium];

              [self.view
               addSubview:self.footerLabel];
          }


          - (UIButton *)mkButton:(NSString *)title
                            tag:(NSInteger)tag
          {
              UIButton *button =
                  [UIButton
                   buttonWithType:UIButtonTypeSystem];

              [button
               setTitle:title
               forState:UIControlStateNormal];

              [button
               setTitleColor:UIColor.whiteColor
               forState:UIControlStateNormal];

              button.titleLabel.font =
                  [UIFont
                   systemFontOfSize:20
                   weight:UIFontWeightBlack];

              button.backgroundColor =
                  [UIColor
                   colorWithRed:0.34
                   green:0.015
                   blue:0.018
                   alpha:0.96];

              button.layer.cornerRadius = 14;
              button.layer.borderWidth = 1.0;

              button.layer.borderColor =
                  [UIColor
                   colorWithWhite:1.0
                   alpha:0.14].CGColor;

              button.layer.shadowColor =
                  UIColor.blackColor.CGColor;

              button.layer.shadowOpacity = 0.55;
              button.layer.shadowRadius = 8;
              button.layer.shadowOffset =
                  CGSizeMake(0, 5);

              button.tag = tag;

              [button
               addTarget:self
               action:@selector(gamePressed:)
               forControlEvents:UIControlEventTouchUpInside];

              return button;
          }


          - (void)filterChanged:(UISegmentedControl *)sender
          {
              BOOL enhanced =
                  sender.selectedSegmentIndex == 1;

              [[NSUserDefaults standardUserDefaults]
               setBool:enhanced
               forKey:@"MKEnhanced"];

              [[NSUserDefaults standardUserDefaults]
               synchronize];
          }


          - (void)gamePressed:(UIButton *)sender
          {
              NSString *game = nil;

              if (sender.tag == 1)
                  game = @"mk1";

              if (sender.tag == 2)
                  game = @"mk2";

              if (sender.tag == 3)
                  game = @"mk3";

              if (game.length == 0)
                  return;

              self.mk1Button.enabled = NO;
              self.mk2Button.enabled = NO;
              self.mk3Button.enabled = NO;

              self.chooseLabel.text =
                  @"LOADING...";

              [self.owner
               mkLaunchGame:game];
          }


          - (void)viewDidLayoutSubviews
          {
              [super viewDidLayoutSubviews];

              CGRect bounds =
                  self.view.bounds;

              CGFloat w =
                  CGRectGetWidth(bounds);

              CGFloat h =
                  CGRectGetHeight(bounds);

              self.backgroundGradient.frame =
                  bounds;

              CGFloat contentWidth =
                  MIN(390.0, w - 80.0);

              CGFloat x =
                  (w - contentWidth) * 0.5;

              self.titleLabel.frame =
                  CGRectMake(
                      0,
                      14,
                      w,
                      42
                  );

              self.subtitleLabel.frame =
                  CGRectMake(
                      0,
                      51,
                      w,
                      28
                  );

              self.chooseLabel.frame =
                  CGRectMake(
                      0,
                      78,
                      w,
                      20
                  );

              self.filterControl.frame =
                  CGRectMake(
                      (w - 250) * 0.5,
                      101,
                      250,
                      30
                  );

              CGFloat buttonHeight = 50;
              CGFloat gap = 9;
              CGFloat startY = 143;

              self.mk1Button.frame =
                  CGRectMake(
                      x,
                      startY,
                      contentWidth,
                      buttonHeight
                  );

              self.mk2Button.frame =
                  CGRectMake(
                      x,
                      startY + buttonHeight + gap,
                      contentWidth,
                      buttonHeight
                  );

              self.mk3Button.frame =
                  CGRectMake(
                      x,
                      startY + (buttonHeight + gap) * 2,
                      contentWidth,
                      buttonHeight
                  );

              self.footerLabel.frame =
                  CGRectMake(
                      0,
                      h - 30,
                      w,
                      18
                  );
          }


          - (BOOL)prefersStatusBarHidden
          {
              return YES;
          }


          - (UIInterfaceOrientationMask)supportedInterfaceOrientations
          {
              return UIInterfaceOrientationMaskLandscape;
          }

          @end

          // ===== END MKTRILOGY_NATIVE_MENU =====
          '''

          data = data.replace(
              import_marker,
              import_marker + "\n" + launcher,
              1
          )

          old_start = '''
          #ifdef THREADED
              // FIXME at present it is a must to delay emulation thread
              [self performSelector:@selector(startDOS) withObject:nil afterDelay:1];
          #endif
          '''

          # Source formatting can differ in whitespace,
          # so replace only the actual selector call.
          target = (
              '[self performSelector:@selector(startDOS) '
              'withObject:nil afterDelay:1];'
          )

          if target not in data:
              raise SystemExit(
                  "ERROR: automatic startDOS call not found"
              )

          data = data.replace(
              target,
              '[self performSelector:@selector(mkShowLauncher) '
              'withObject:nil afterDelay:0.25];',
              1
          )

          marker = '-(void)setWindowTitle:(char *)title'

          if marker not in data:
              raise SystemExit(
                  "ERROR: setWindowTitle marker not found"
              )

          methods = r'''
          // ======================================================
          // MK TRILOGY METHODS
          // ======================================================

          - (void)mkShowLauncher
          {
              if ([DOSPadEmulator sharedInstance].started)
                  return;

              MKTrilogyLauncherViewController *launcher =
                  [[MKTrilogyLauncherViewController alloc] init];

              launcher.owner = self;

              launcher.modalPresentationStyle =
                  UIModalPresentationFullScreen;

              [self.emulatorController
               presentViewController:launcher
               animated:NO
               completion:nil];
          }


          - (NSString *)mkGamepadJSONForGame:(NSString *)game
          {
              NSDictionary *config = nil;

              if ([game isEqualToString:@"mk1"])
              {
                  config = @{
                      @"button-left": @{
                          @"key": @"key-z",
                          @"title": @"◀"
                      },

                      @"button-up": @{
                          @"key": @"key-s",
                          @"title": @"▲"
                      },

                      @"button-right": @{
                          @"key": @"key-c",
                          @"title": @"▶"
                      },

                      @"button-down": @{
                          @"key": @"key-x",
                          @"title": @"▼"
                      },

                      @"button-a": @{
                          @"key": @"key-n",
                          @"title": @"LP"
                      },

                      @"button-b": @{
                          @"key": @"key-m",
                          @"title": @"LK"
                      },

                      @"button-x": @{
                          @"key": @"key-u",
                          @"title": @"HP"
                      },

                      @"button-y": @{
                          @"key": @"key-i",
                          @"title": @"HK"
                      },

                      @"button-r1": @{
                          @"key": @"key-j",
                          @"title": @"BLK"
                      },

                      @"button-r2": @{
                          @"key": @"key-esc",
                          @"title": @"ESC"
                      },

                      @"button-l1": @{
                          @"key": @"key-f1",
                          @"title": @"START"
                      },

                      @"button-l2": @{
                          @"key": @"key-f10",
                          @"title": @"OPT"
                      }
                  };
              }


              else if ([game isEqualToString:@"mk2"])
              {
                  config = @{
                      @"button-left": @{
                          @"key": @"key-left",
                          @"title": @"◀"
                      },

                      @"button-up": @{
                          @"key": @"key-up",
                          @"title": @"▲"
                      },

                      @"button-right": @{
                          @"key": @"key-right",
                          @"title": @"▶"
                      },

                      @"button-down": @{
                          @"key": @"key-down",
                          @"title": @"▼"
                      },

                      @"button-a": @{
                          @"key": @"key-kp-page-down",
                          @"title": @"LP"
                      },

                      @"button-b": @{
                          @"key": @"key-kp-end",
                          @"title": @"LK"
                      },

                      @"button-x": @{
                          @"key": @"key-kp-page-up",
                          @"title": @"HP"
                      },

                      @"button-y": @{
                          @"key": @"key-kp-home",
                          @"title": @"HK"
                      },

                      @"button-r1": @{
                          @"key": @"key-kp-5",
                          @"title": @"BLK"
                      },

                      @"button-r2": @{
                          @"key": @"key-esc",
                          @"title": @"ESC"
                      },

                      @"button-l1": @{
                          @"key": @"key-f1",
                          @"title": @"START"
                      },

                      @"button-l2": @{
                          @"key": @"key-f10",
                          @"title": @"OPT"
                      }
                  };
              }


              else
              {
                  config = @{
                      @"button-left": @{
                          @"key": @"key-left",
                          @"title": @"◀"
                      },

                      @"button-up": @{
                          @"key": @"key-up",
                          @"title": @"▲"
                      },

                      @"button-right": @{
                          @"key": @"key-right",
                          @"title": @"▶"
                      },

                      @"button-down": @{
                          @"key": @"key-down",
                          @"title": @"▼"
                      },

                      @"button-a": @{
                          @"key": @"key-kp-end",
                          @"title": @"LP"
                      },

                      @"button-b": @{
                          @"key": @"key-kp-page-down",
                          @"title": @"LK"
                      },

                      @"button-x": @{
                          @"key": @"key-kp-left",
                          @"title": @"HP"
                      },

                      @"button-y": @{
                          @"key": @"key-kp-right",
                          @"title": @"HK"
                      },

                      @"button-r1": @{
                          @"key": @"key-kp-down",
                          @"title": @"BLK"
                      },

                      @"button-r2": @{
                          @"key": @"key-esc",
                          @"title": @"ESC"
                      },

                      @"button-l1": @{
                          @"key": @"key-kp-insert",
                          @"title": @"RUN"
                      },

                      @"button-l2": @{
                          @"key": @"key-enter",
                          @"title": @"START"
                      }
                  };
              }


              NSError *error = nil;

              NSData *jsonData =
                  [NSJSONSerialization
                   dataWithJSONObject:config
                   options:NSJSONWritingPrettyPrinted
                   error:&error];

              if (!jsonData)
              {
                  NSLog(
                      @"MK gamepad JSON error: %@",
                      error
                  );

                  return @"{}";
              }

              return
                  [[NSString alloc]
                   initWithData:jsonData
                   encoding:NSUTF8StringEncoding];
          }


          - (void)mkPrepareDOSConfigAtPath:(NSString *)path
                                      game:(NSString *)game
          {
              NSString *bundled =
                  [[[NSBundle mainBundle]
                    resourcePath]
                   stringByAppendingPathComponent:
                   @"configs/dospad.cfg"];

              NSError *error = nil;

              NSString *cfg =
                  [NSString
                   stringWithContentsOfFile:bundled
                   encoding:NSUTF8StringEncoding
                   error:&error];

              if (cfg.length == 0)
                  cfg = @"";

              cfg =
                  [cfg
                   stringByReplacingOccurrencesOfString:
                   @"core=simple"
                   withString:
                   @"core=dynamic"];

              cfg =
                  [cfg
                   stringByReplacingOccurrencesOfString:
                   @"frameskip=1"
                   withString:
                   @"frameskip=0"];

              cfg =
                  [cfg
                   stringByReplacingOccurrencesOfString:
                   @"frameskip=2"
                   withString:
                   @"frameskip=0"];

              [cfg
               writeToFile:path
               atomically:YES
               encoding:NSUTF8StringEncoding
               error:nil];
          }


          - (void)mkLaunchGame:(NSString *)game
          {
              NSFileManager *fm =
                  [NSFileManager defaultManager];

              NSString *bundleGames =
                  [[[NSBundle mainBundle]
                    bundlePath]
                   stringByAppendingPathComponent:
                   @"MKGames"];

              NSString *source =
                  [bundleGames
                   stringByAppendingPathComponent:game];

              NSString *documents =
                  [NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                   ) lastObject];

              NSString *root =
                  [documents
                   stringByAppendingPathComponent:
                   @"MK-Trilogy"];

              NSString *destination =
                  [root
                   stringByAppendingPathComponent:game];

              [fm
               createDirectoryAtPath:root
               withIntermediateDirectories:YES
               attributes:nil
               error:nil];


              NSString *exeName = nil;

              if ([game isEqualToString:@"mk1"])
                  exeName = @"MK1.EXE";

              else if ([game isEqualToString:@"mk2"])
                  exeName = @"MK2.EXE";

              else
                  exeName = @"MK3.EXE";


              NSString *destinationExe =
                  [destination
                   stringByAppendingPathComponent:
                   exeName];


              // Copy game once.
              // Afterwards the Documents copy remains,
              // so game saves and settings survive.
              if (![fm
                    fileExistsAtPath:destinationExe])
              {
                  [fm
                   removeItemAtPath:destination
                   error:nil];

                  NSError *copyError = nil;

                  BOOL copied =
                      [fm
                       copyItemAtPath:source
                       toPath:destination
                       error:&copyError];

                  if (!copied)
                  {
                      NSLog(
                          @"MK COPY ERROR: %@",
                          copyError
                      );

                      UIAlertController *alert =
                          [UIAlertController
                           alertControllerWithTitle:
                           @"GAME FILE ERROR"
                           message:
                           copyError.localizedDescription
                           preferredStyle:
                           UIAlertControllerStyleAlert];

                      [alert
                       addAction:
                       [UIAlertAction
                        actionWithTitle:@"OK"
                        style:UIAlertActionStyleDefault
                        handler:nil]];

                      [self.emulatorController.presentedViewController
                       presentViewController:alert
                       animated:YES
                       completion:nil];

                      return;
                  }
              }


              NSString *configDir =
                  [destination
                   stringByAppendingPathComponent:
                   @"config"];

              [fm
               createDirectoryAtPath:configDir
               withIntermediateDirectories:YES
               attributes:nil
               error:nil];


              // ==================================================
              // TOUCH CONTROLS
              // ==================================================

              NSString *padPath =
                  [configDir
                   stringByAppendingPathComponent:
                   @"gamepad.cfg"];

              NSString *pad =
                  [self
                   mkGamepadJSONForGame:game];

              [pad
               writeToFile:padPath
               atomically:YES
               encoding:NSUTF8StringEncoding
               error:nil];


              // ==================================================
              // DOSBOX PERFORMANCE CONFIG
              // ==================================================

              NSString *cfgPath =
                  [configDir
                   stringByAppendingPathComponent:
                   @"dospad.cfg"];

              [self
               mkPrepareDOSConfigAtPath:cfgPath
               game:game];


              // ==================================================
              // AUTO BOOT
              // ==================================================

              NSString *autoText = nil;

              if ([game isEqualToString:@"mk1"])
              {
                  autoText =
                      @"MK1.EXE\n";
              }

              else if ([game isEqualToString:@"mk2"])
              {
                  autoText =
                      @"MK2.EXE\n";
              }

              else
              {
                  NSString *cue =
                      [destination
                       stringByAppendingPathComponent:
                       @"IMAGE/MK3.cue"];

                  if ([fm fileExistsAtPath:cue])
                  {
                      autoText =
                          @"imgmount d \"C:\\IMAGE\\MK3.cue\" -t iso\n"
                           "MK3.EXE\n";
                  }

                  else
                  {
                      autoText =
                          @"MK3.EXE\n";
                  }
              }


              NSString *autoPath =
                  [destination
                   stringByAppendingPathComponent:
                   @"MKAUTO.TXT"];

              [autoText
               writeToFile:autoPath
               atomically:YES
               encoding:NSUTF8StringEncoding
               error:nil];


              // Remember currently running MK.
              [[NSUserDefaults standardUserDefaults]
               setObject:game
               forKey:@"MKCurrentGame"];

              [[NSUserDefaults standardUserDefaults]
               synchronize];


              // Set THIS game folder as C:
              [DOSPadEmulator sharedInstance].workingDirectory =
                  [NSURL
                   fileURLWithPath:destination
                   isDirectory:YES];


              UIViewController *launcher =
                  self.emulatorController.presentedViewController;

              [launcher
               dismissViewControllerAnimated:YES
               completion:^{

                  [self startDOS];

               }];
          }

          // ===== END MK TRILOGY METHODS =====

          '''

          data = data.replace(
              marker,
              methods + marker,
              1
          )

          open(
              path,
              "w",
              encoding="utf-8"
          ).write(data)

          print("MK Trilogy launcher installed")
          PY

      # ==========================================================
      # PATCH TOUCH GAMEPAD + CRT FX + PAUSE
      # ==========================================================

      - name: Add touch controls and CRT filter
        run: |
          set -e

          FILE="dospad/dospad/Main/DPEmulatorViewController.m"

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          data = open(
              path,
              "r",
              encoding="utf-8"
          ).read()

          if "MKTRILOGY_GAME_UI" in data:
              print("Game UI already patched")
              raise SystemExit(0)

          import_marker = '#import <UIKit/UIKit.h>'

          data = data.replace(
              import_marker,
              import_marker +
              '\n#import <QuartzCore/QuartzCore.h>',
              1
          )


          methods_marker = '// MARK: DOSEmulatorDelegate'

          if methods_marker not in data:
              raise SystemExit(
                  "ERROR: emulator delegate marker missing"
              )


          methods = r'''
          // ======================================================
          // MKTRILOGY_GAME_UI
          // ======================================================

          - (NSString *)mkCurrentGame
          {
              NSString *game =
                  [[NSUserDefaults standardUserDefaults]
                   stringForKey:@"MKCurrentGame"];

              return game ?: @"mk1";
          }


          - (void)mkApplyVisualFilter
          {
              if (!self.screenView)
                  return;

              BOOL enhanced =
                  [[NSUserDefaults standardUserDefaults]
                   boolForKey:@"MKEnhanced"];


              // Remove old overlay.
              UIView *old =
                  [_rootContainer
                   viewWithTag:909090];

              [old removeFromSuperview];


              if (enhanced)
              {
                  self.screenView.layer.magnificationFilter =
                      kCAFilterLinear;

                  UIView *overlay =
                      [[UIView alloc]
                       initWithFrame:self.screenView.frame];

                  overlay.tag = 909090;
                  overlay.userInteractionEnabled = NO;
                  overlay.backgroundColor =
                      [UIColor clearColor];

                  overlay.autoresizingMask =
                      UIViewAutoresizingFlexibleWidth |
                      UIViewAutoresizingFlexibleHeight;


                  // Slight contrast / dark tint.
                  CAGradientLayer *vignette =
                      [CAGradientLayer layer];

                  vignette.frame =
                      overlay.bounds;

                  vignette.colors = @[
                      (id)[UIColor
                           colorWithWhite:0
                           alpha:0.02].CGColor,

                      (id)[UIColor
                           colorWithRed:0.13
                           green:0.0
                           blue:0.0
                           alpha:0.03].CGColor,

                      (id)[UIColor
                           colorWithWhite:0
                           alpha:0.11].CGColor
                  ];

                  vignette.locations =
                      @[@0.0, @0.52, @1.0];

                  [overlay.layer
                   addSublayer:vignette];


                  // CRT scanlines.
                  CGFloat height =
                      CGRectGetHeight(overlay.bounds);

                  CGFloat width =
                      CGRectGetWidth(overlay.bounds);

                  for (CGFloat y = 1;
                       y < height;
                       y += 5)
                  {
                      UIView *line =
                          [[UIView alloc]
                           initWithFrame:
                           CGRectMake(
                               0,
                               y,
                               width,
                               1
                           )];

                      line.backgroundColor =
                          [UIColor
                           colorWithWhite:0
                           alpha:0.13];

                      line.userInteractionEnabled = NO;

                      [overlay
                       addSubview:line];
                  }


                  [_rootContainer
                   addSubview:overlay];


                  DPGamepad *pad =
                      [self findGamepad];

                  if (pad)
                      [_rootContainer
                       bringSubviewToFront:pad];
              }

              else
              {
                  self.screenView.layer.magnificationFilter =
                      kCAFilterNearest;
              }


              UIView *pause =
                  [_rootContainer
                   viewWithTag:909091];

              if (pause)
                  [_rootContainer
                   bringSubviewToFront:pause];


              UIView *fx =
                  [_rootContainer
                   viewWithTag:909092];

              if (fx)
                  [_rootContainer
                   bringSubviewToFront:fx];
          }


          - (UIButton *)mkMiniButton:(NSString *)title
                                tag:(NSInteger)tag
                              frame:(CGRect)frame
                             action:(SEL)action
          {
              UIButton *button =
                  [UIButton
                   buttonWithType:UIButtonTypeSystem];

              button.frame = frame;
              button.tag = tag;

              [button
               setTitle:title
               forState:UIControlStateNormal];

              [button
               setTitleColor:UIColor.whiteColor
               forState:UIControlStateNormal];

              button.titleLabel.font =
                  [UIFont
                   systemFontOfSize:12
                   weight:UIFontWeightBlack];

              button.backgroundColor =
                  [UIColor
                   colorWithWhite:0
                   alpha:0.58];

              button.layer.cornerRadius = 10;
              button.layer.borderWidth = 1;

              button.layer.borderColor =
                  [UIColor
                   colorWithWhite:1
                   alpha:0.25].CGColor;

              [button
               addTarget:self
               action:action
               forControlEvents:UIControlEventTouchUpInside];

              return button;
          }


          - (void)mkInstallGameHUD
          {
              if (!_rootContainer)
                  return;


              DPGamepad *pad =
                  [self findGamepad];

              if (!pad)
              {
                  [self createGamepad];
                  pad = [self findGamepad];
              }

              if (pad)
              {
                  pad.hidden = NO;
                  pad.alpha = 0.76;
              }


              UIButton *pause =
                  (UIButton *)
                  [_rootContainer
                   viewWithTag:909091];

              if (!pause)
              {
                  pause =
                      [self
                       mkMiniButton:@"Ⅱ"
                       tag:909091
                       frame:CGRectMake(
                           13,
                           10,
                           48,
                           38
                       )
                       action:@selector(mkPauseMenu)];

                  [_rootContainer
                   addSubview:pause];
              }


              UIButton *fx =
                  (UIButton *)
                  [_rootContainer
                   viewWithTag:909092];

              if (!fx)
              {
                  fx =
                      [self
                       mkMiniButton:@"FX"
                       tag:909092
                       frame:CGRectMake(
                           _rootContainer.bounds.size.width - 61,
                           10,
                           48,
                           38
                       )
                       action:@selector(mkToggleFX)];

                  fx.autoresizingMask =
                      UIViewAutoresizingFlexibleLeftMargin;

                  [_rootContainer
                   addSubview:fx];
              }


              [_rootContainer
               bringSubviewToFront:pause];

              [_rootContainer
               bringSubviewToFront:fx];
          }


          - (void)mkToggleFX
          {
              BOOL enabled =
                  [[NSUserDefaults standardUserDefaults]
                   boolForKey:@"MKEnhanced"];

              enabled = !enabled;

              [[NSUserDefaults standardUserDefaults]
               setBool:enabled
               forKey:@"MKEnhanced"];

              [[NSUserDefaults standardUserDefaults]
               synchronize];

              [self mkApplyVisualFilter];
          }


          - (NSString *)mkControlsText
          {
              NSString *game =
                  [self mkCurrentGame];

              if ([game isEqualToString:@"mk1"])
              {
                  return
                      @"D-PAD  MOVE\n"
                       "LP  LOW PUNCH\n"
                       "HP  HIGH PUNCH\n"
                       "LK  LOW KICK\n"
                       "HK  HIGH KICK\n"
                       "BLK  BLOCK\n"
                       "START  F1\n"
                       "OPT  F10";
              }

              if ([game isEqualToString:@"mk2"])
              {
                  return
                      @"D-PAD  MOVE\n"
                       "LP  LOW PUNCH\n"
                       "HP  HIGH PUNCH\n"
                       "LK  LOW KICK\n"
                       "HK  HIGH KICK\n"
                       "BLK  BLOCK\n"
                       "START  F1\n"
                       "OPT  F10";
              }

              return
                  @"D-PAD  MOVE\n"
                   "LP  LOW PUNCH\n"
                   "HP  HIGH PUNCH\n"
                   "LK  LOW KICK\n"
                   "HK  HIGH KICK\n"
                   "BLK  BLOCK\n"
                   "RUN  RUN\n"
                   "START  ENTER";
          }


          - (void)mkShowControls
          {
              UIAlertController *alert =
                  [UIAlertController
                   alertControllerWithTitle:
                   @"CONTROLS"
                   message:
                   [self mkControlsText]
                   preferredStyle:
                   UIAlertControllerStyleAlert];

              [alert
               addAction:
               [UIAlertAction
                actionWithTitle:@"BACK"
                style:UIAlertActionStyleDefault
                handler:^(UIAlertAction *action) {

                    [self mkPauseMenu];

                }]];

              [self
               presentViewController:alert
               animated:YES
               completion:nil];
          }


          - (void)mkPauseMenu
          {
              dospad_pause();

              NSString *game =
                  [[self mkCurrentGame]
                   uppercaseString];

              NSString *fxText =
                  [[NSUserDefaults standardUserDefaults]
                   boolForKey:@"MKEnhanced"]
                  ? @"CRT+ ON"
                  : @"CLASSIC";

              NSString *message =
                  [NSString
                   stringWithFormat:
                   @"%@\n%@",
                   game,
                   fxText];


              UIAlertController *alert =
                  [UIAlertController
                   alertControllerWithTitle:
                   @"PAUSED"
                   message:message
                   preferredStyle:
                   UIAlertControllerStyleAlert];


              [alert
               addAction:
               [UIAlertAction
                actionWithTitle:@"RESUME"
                style:UIAlertActionStyleDefault
                handler:^(UIAlertAction *action) {

                    dospad_resume();

                }]];


              [alert
               addAction:
               [UIAlertAction
                actionWithTitle:@"CONTROLS"
                style:UIAlertActionStyleDefault
                handler:^(UIAlertAction *action) {

                    [self mkShowControls];

                }]];


              [alert
               addAction:
               [UIAlertAction
                actionWithTitle:@"TOGGLE CRT FX"
                style:UIAlertActionStyleDefault
                handler:^(UIAlertAction *action) {

                    BOOL enabled =
                        [[NSUserDefaults standardUserDefaults]
                         boolForKey:@"MKEnhanced"];

                    [[NSUserDefaults standardUserDefaults]
                     setBool:!enabled
                     forKey:@"MKEnhanced"];

                    [[NSUserDefaults standardUserDefaults]
                     synchronize];

                    [self mkApplyVisualFilter];

                    dospad_resume();

                }]];


              [alert
               addAction:
               [UIAlertAction
                actionWithTitle:@"EXIT GAME"
                style:UIAlertActionStyleDestructive
                handler:^(UIAlertAction *action) {

                    // Current iDOS cannot cleanly stop and restart
                    // the DOSBox thread with another package.
                    // Closing here is safer than corrupting state.
                    exit(0);

                }]];


              [self
               presentViewController:alert
               animated:YES
               completion:nil];
          }

          // ===== END MKTRILOGY_GAME_UI =====

          '''

          data = data.replace(
              methods_marker,
              methods + methods_marker,
              1
          )


          layout_marker = '''\
          	[self updateScreen];
          }'''

          if layout_marker not in data:
              # spaces can vary
              layout_marker = '\t[self updateScreen];\n}'

          if layout_marker not in data:
              raise SystemExit(
                  "ERROR: updateScreen layout marker missing"
              )

          replacement = '''\
          	[self updateScreen];

              // MK Trilogy touch HUD
              [self mkInstallGameHUD];
              [self mkApplyVisualFilter];
          }'''

          data = data.replace(
              layout_marker,
              replacement,
              1
          )


          will_start_marker = '''\
          	[[self findGamepad] applyConfiguration:_gamepadConfig];'''

          if will_start_marker not in data:
              raise SystemExit(
                  "ERROR: gamepad apply marker missing"
              )

          will_start_replacement = '''\
              DPGamepad *mkPad = [self findGamepad];

              if (!mkPad)
              {
                  [self createGamepad];
                  mkPad = [self findGamepad];
              }

              if (mkPad)
              {
                  [mkPad applyConfiguration:_gamepadConfig];
                  mkPad.hidden = NO;
                  mkPad.alpha = 0.76;
              }

              [self mkInstallGameHUD];
              [self mkApplyVisualFilter];'''

          data = data.replace(
              will_start_marker,
              will_start_replacement,
              1
          )


          open(
              path,
              "w",
              encoding="utf-8"
          ).write(data)

          print(
              "Touch gamepad + pause + CRT patch OK"
          )
          PY

