                  down =
                      SDL_SCANCODE_DOWN;

                  left =
                      SDL_SCANCODE_LEFT;

                  right =
                      SDL_SCANCODE_RIGHT;

                  hp =
                      SDL_SCANCODE_KP_4;

                  lp =
                      SDL_SCANCODE_KP_1;

                  block =
                      SDL_SCANCODE_KP_2;

                  hk =
                      SDL_SCANCODE_KP_6;

                  lk =
                      SDL_SCANCODE_KP_3;

