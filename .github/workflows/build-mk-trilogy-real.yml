      - name: Generate MK Trilogy icon
        run: |
          set -e

          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import glob
          import json
          import os
          import re

          icon_sets = glob.glob(
              "dospad/Resources/**/*.appiconset",
              recursive=True
          )

          if not icon_sets:
              icon_sets = glob.glob(
                  "dospad/**/*.appiconset",
                  recursive=True
              )

          if not icon_sets:
              raise SystemExit(
                  "ERROR: APP ICON SET NOT FOUND"
              )

          preferred = [
              p for p in icon_sets
              if os.path.basename(p).lower()
              == "appicon.appiconset"
          ]

          if preferred:
              appicon = preferred[0]
          else:
              appicon = icon_sets[0]

          print(
              "APPICON:",
              appicon
          )

          contents_path = os.path.join(
              appicon,
              "Contents.json"
          )

          if os.path.exists(contents_path):
              with open(
                  contents_path,
                  "r",
                  encoding="utf-8"
              ) as file:
                  contents = json.load(file)
          else:
              contents = {
                  "images": [],
                  "info": {
                      "author": "xcode",
                      "version": 1
                  }
              }

          def get_font(size):
              paths = [
                  "/System/Library/Fonts/Supplemental/Arial Bold.ttf",
                  "/System/Library/Fonts/Supplemental/Arial.ttf"
              ]

              for path in paths:
                  if os.path.exists(path):
                      return ImageFont.truetype(
                          path,
                          size
                      )

              return ImageFont.load_default()

          def create_icon(
              pixels,
              output
          ):
              image = Image.new(
                  "RGB",
                  (
                      pixels,
                      pixels
                  ),
                  (
                      7,
                      7,
                      10
                  )
              )

              draw = ImageDraw.Draw(
                  image
              )

              for y in range(pixels):
                  t = (
                      y /
                      max(
                          pixels - 1,
                          1
                      )
                  )

                  red = int(
                      115 *
                      (1.0 - t)
                      +
                      13 *
                      t
                  )

                  green = int(
                      7 *
                      (1.0 - t)
                      +
                      3 *
                      t
                  )

                  blue = int(
                      10 *
                      (1.0 - t)
                      +
                      7 *
                      t
                  )

                  draw.line(
                      (
                          0,
                          y,
                          pixels,
                          y
                      ),
                      fill=(
                          red,
                          green,
                          blue
                      )
                  )

              margin = int(
                  pixels *
                  0.10
              )

              draw.ellipse(
                  (
                      margin,
                      margin,
                      pixels - margin,
                      pixels - margin
                  ),
                  fill=(
                      8,
                      8,
                      11
                  ),
                  outline=(
                      235,
                      42,
                      38
                  ),
                  width=max(
                      2,
                      int(
                          pixels *
                          0.025
                      )
                  )
              )

              big = get_font(
                  max(
                      12,
                      int(
                          pixels *
                          0.31
                      )
                  )
              )

              title = "MK"

              box = draw.textbbox(
                  (
                      0,
                      0
                  ),
                  title,
                  font=big
              )

              text_width = (
                  box[2] -
                  box[0]
              )

              text_height = (
                  box[3] -
                  box[1]
              )

              draw.text(
                  (
                      (
                          pixels -
                          text_width
                      ) / 2,
                      pixels *
                      0.39 -
                      text_height /
                      2
                  ),
                  title,
                  font=big,
                  fill=(
                      250,
                      250,
                      250
                  )
              )

              small = get_font(
                  max(
                      8,
                      int(
                          pixels *
                          0.073
                      )
                  )
              )

              subtitle = "TRILOGY"

              box2 = draw.textbbox(
                  (
                      0,
                      0
                  ),
                  subtitle,
                  font=small
              )

              subtitle_width = (
                  box2[2] -
                  box2[0]
              )

              draw.text(
                  (
                      (
                          pixels -
                          subtitle_width
                      ) / 2,
                      pixels *
                      0.69
                  ),
                  subtitle,
                  font=small,
                  fill=(
                      245,
                      78,
                      72
                  )
              )

              image.save(
                  output,
                  "PNG"
              )

          images = contents.get(
              "images",
              []
          )

          if not images:
              images = [
                  {
                      "idiom": "iphone",
                      "size": "60x60",
                      "scale": "2x",
                      "filename": "MK-120.png"
                  },
                  {
                      "idiom": "iphone",
                      "size": "60x60",
                      "scale": "3x",
                      "filename": "MK-180.png"
                  },
                  {
                      "idiom": "ios-marketing",
                      "size": "1024x1024",
                      "scale": "1x",
                      "filename": "MK-1024.png"
                  }
              ]

          fixed_images = []

          index = 0

          for entry in images:
              size_text = entry.get(
                  "size"
              )

              scale_text = entry.get(
                  "scale"
              )

              if not size_text or not scale_text:
                  fixed_images.append(
                      entry
                  )
                  continue

              match_size = re.match(
                  r"([0-9.]+)x",
                  size_text
              )

              match_scale = re.match(
                  r"([0-9.]+)x",
                  scale_text
              )

              if not match_size or not match_scale:
                  fixed_images.append(
                      entry
                  )
                  continue

              points = float(
                  match_size.group(1)
              )

              scale = float(
                  match_scale.group(1)
              )

              pixels = int(
                  round(
                      points *
                      scale
                  )
              )

              if pixels <= 0:
                  fixed_images.append(
                      entry
                  )
                  continue

              index += 1

              filename = (
                  f"MKIcon-{index}-{pixels}.png"
              )

              output = os.path.join(
                  appicon,
                  filename
              )

              create_icon(
                  pixels,
                  output
              )

              new_entry = dict(
                  entry
              )

              new_entry["filename"] = (
                  filename
              )

              fixed_images.append(
                  new_entry
              )

              print(
                  "CREATED:",
                  filename,
                  pixels
              )

          contents["images"] = (
              fixed_images
          )

          contents["info"] = {
              "author": "xcode",
              "version": 1
          }

          with open(
              contents_path,
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  contents,
                  file,
                  indent=2
              )

          print()
          print(
              "===== ICON SUCCESS ====="
          )

          print(
              contents_path
          )
          PY

      # ==========================================================
      # VERIFY
      # ==========================================================

      - name: Verify MK patches
        run: |
          set -e

          echo "===== AUTOBOOT ====="

          grep -n \
            "MKTRILOGY_AUTOBOOT" \
            dospad/dospad/Main/DOSPadEmulator.m

          echo "===== MENU ====="

          grep -n \
            "MKTRILOGY_MAIN_MENU" \
            dospad/dospad/Main/DPAppDelegate.m

          echo "===== TOUCH ====="

          grep -n \
            "MKTRILOGY_SAFE_TOUCH" \
            dospad/dospad/Main/DPEmulatorViewController.m

          echo
          echo "ALL PATCHES FOUND"

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build MK Trilogy engine
        run: |
          set +e
          set -o pipefail

          xattr -cr dospad || true

          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -scheme iDOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.mkremastered.trilogy" \
            build \
            2>&1 \
            | tee output/xcodebuild.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "======================================"
          echo "COMPILER ERRORS"
          echo "======================================"

          grep -n \
            -E "error:|fatal error:" \
            output/xcodebuild.log \
            | tail -120 || true

          echo
          echo "BUILD STATUS=$STATUS"

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      # ==========================================================
      # FIND APP
      # ==========================================================

      - name: Locate built app
        run: |
          set -e

          echo "===== BUILT APPS ====="

          find build \
            -type d \
            -name "*.app" \
            -print

          APP=$(
            find build/Build/Products \
              -type d \
              -name "iDOS.app" \
              | head -1
          )

          if [ -z "$APP" ]; then
            APP=$(
              find build/Build/Products \
                -type d \
                -name "*.app" \
                | head -1
            )
          fi

          if [ -z "$APP" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi

          echo "$APP" \
            > output/app-path.txt

          echo "APP=$APP"

      # ==========================================================
      # PUT REAL GAMES INSIDE APP
      # ==========================================================

      - name: Put real MK1 MK2 MK3 inside app
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )

          rm -rf \
            "$APP/MKGames"

          mkdir -p \
            "$APP/MKGames/mk1"

          mkdir -p \
            "$APP/MKGames/mk2"

          mkdir -p \
            "$APP/MKGames/mk3"

          cp -R \
            games/mk1/. \
            "$APP/MKGames/mk1/"

          cp -R \
            games/mk2/. \
            "$APP/MKGames/mk2/"

          cp -R \
            games/mk3/. \
            "$APP/MKGames/mk3/"

          echo "===== EXES INSIDE APP ====="

          find "$APP/MKGames" \
            -type f \
            \( \
              -iname "MK1.EXE" \
              -o -iname "MK2.EXE" \
              -o -iname "MK3.EXE" \
            \) \
            -print

          test -n "$(
            find "$APP/MKGames/mk1" \
              -maxdepth 1 \
              -type f \
              -iname "MK1.EXE" \
              | head -1
          )"

          test -n "$(
            find "$APP/MKGames/mk2" \
              -maxdepth 1 \
              -type f \
              -iname "MK2.EXE" \
              | head -1
          )"

          test -n "$(
            find "$APP/MKGames/mk3" \
              -maxdepth 1 \
              -type f \
              -iname "MK3.EXE" \
              | head -1
          )"

          echo "MK1=$(find "$APP/MKGames/mk1" -type f | wc -l)"
          echo "MK2=$(find "$APP/MKGames/mk2" -type f | wc -l)"
          echo "MK3=$(find "$APP/MKGames/mk3" -type f | wc -l)"

      # ==========================================================
      # FINAL PLIST
      # ==========================================================

      - name: Finalize Info plist
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )

          PLIST="$APP/Info.plist"

          plutil \
            -replace CFBundleDisplayName \
            -string "MK Remastered Trilogy" \
            "$PLIST"

          plutil \
            -replace CFBundleIdentifier \
            -string "com.mkremastered.trilogy" \
            "$PLIST"

          echo "===== FINAL INFO ====="

          plutil -p "$PLIST" \
            | head -80

      # ==========================================================
      # REPORT
      # ==========================================================

      - name: Create build info
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )

          {
            echo "========================================"
            echo "MORTAL KOMBAT REMASTERED TRILOGY"
            echo "========================================"
            echo
            echo "BUILD: REAL CLASSIC TRILOGY"
            echo
            echo "FEATURES:"
            echo "- REAL MK1.EXE"
            echo "- REAL MK2.EXE"
            echo "- REAL MK3.EXE"
            echo "- NATIVE TRILOGY MENU"
            echo "- CUSTOM APP ICON"
            echo "- TOUCH D-PAD"
            echo "- HP / LP / HK / LK"
            echo "- BLOCK"
            echo "- MK3 RUN"
            echo "- START"
            echo "- PAUSE MENU"
            echo "- SEND ESC"
            echo "- CLASSIC MODE"
            echo "- CRT+ SCANLINES"
            echo "- FX BUTTON"
            echo
            echo "FILES:"
            echo "MK1=$(find "$APP/MKGames/mk1" -type f | wc -l)"
            echo "MK2=$(find "$APP/MKGames/mk2" -type f | wc -l)"
            echo "MK3=$(find "$APP/MKGames/mk3" -type f | wc -l)"
          } \
            > output/BUILD-INFO.txt

          cat \
            output/BUILD-INFO.txt

      # ==========================================================
      # IPA
      # ==========================================================

      - name: Create IPA
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )

          rm -rf Payload

          mkdir -p Payload

          cp -R \
            "$APP" \
            Payload/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            output/MK-Remastered-Trilogy-REAL.ipa

          echo
          echo "===== FINAL IPA ====="

          ls -lh \
            output/MK-Remastered-Trilogy-REAL.ipa

      # ==========================================================
      # SUCCESS
      # ==========================================================

      - name: Upload REAL MK Trilogy IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MK-Remastered-Trilogy-REAL
          path: |
            output/MK-Remastered-Trilogy-REAL.ipa
            output/BUILD-INFO.txt
          compression-level: 0

      # ==========================================================
      # FAILURE
      # ==========================================================

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MK-Trilogy-FAIL
          path: |
            output/xcodebuild.log
            output/BUILD-INFO.txt
            output/app-path.txt
          if-no-files-found: ignore
