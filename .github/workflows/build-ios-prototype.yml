name: Build MK Remastered Trilogy iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen --version

      - name: Create project folders
        run: |
          mkdir -p MKRemasteredTrilogy
          mkdir -p MKRemasteredTrilogy/Resources

      # ==========================================================
      # XCODEGEN PROJECT
      # ==========================================================

      - name: Create project.yml
        run: |
          cat > project.yml <<'YAML'
          name: MKRemasteredTrilogy

          options:
            bundleIdPrefix: com.mkremastered

          settings:
            base:
              IPHONEOS_DEPLOYMENT_TARGET: "15.0"
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1"
              ENABLE_BITCODE: NO

          targets:
            MKRemasteredTrilogy:
              type: application
              platform: iOS

              sources:
                - path: MKRemasteredTrilogy

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.mkremastered.trilogy
                  PRODUCT_NAME: MKRemasteredTrilogy
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: "MK Remastered Trilogy"
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIRequiresFullScreen: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""

          schemes:
            MKRemasteredTrilogy:
              build:
                targets:
                  MKRemasteredTrilogy: all
          YAML

      # ==========================================================
      # APP ENTRY
      # ==========================================================

      - name: Create AppDelegate.swift
        run: |
          cat > MKRemasteredTrilogy/AppDelegate.swift <<'SWIFT'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions:
                      [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {

                  window = UIWindow(frame: UIScreen.main.bounds)

                  let menu = MainMenuViewController()
                  let navigation = UINavigationController(rootViewController: menu)

                  navigation.setNavigationBarHidden(true, animated: false)

                  window?.rootViewController = navigation
                  window?.makeKeyAndVisible()

                  return true
              }
          }
          SWIFT

      # ==========================================================
      # MAIN MENU
      # ==========================================================

      - name: Create MainMenuViewController.swift
        run: |
          cat > MKRemasteredTrilogy/MainMenuViewController.swift <<'SWIFT'
          import UIKit

          final class MainMenuViewController: UIViewController {

              private let stack = UIStackView()

              override func viewDidLoad() {
                  super.viewDidLoad()

                  view.backgroundColor = UIColor(
                      red: 0.035,
                      green: 0.035,
                      blue: 0.045,
                      alpha: 1
                  )

                  buildTitle()
                  buildMenu()
              }

              private func buildTitle() {

                  let title = UILabel()
                  title.translatesAutoresizingMaskIntoConstraints = false
                  title.text = "MORTAL KOMBAT"
                  title.textAlignment = .center
                  title.textColor = .white
                  title.font = .systemFont(
                      ofSize: 40,
                      weight: .black
                  )

                  let subtitle = UILabel()
                  subtitle.translatesAutoresizingMaskIntoConstraints = false
                  subtitle.text = "REMASTERED TRILOGY"
                  subtitle.textAlignment = .center
                  subtitle.textColor = .systemRed
                  subtitle.font = .systemFont(
                      ofSize: 21,
                      weight: .bold
                  )

                  let choose = UILabel()
                  choose.translatesAutoresizingMaskIntoConstraints = false
                  choose.text = "CHOOSE YOUR MK"
                  choose.textAlignment = .center
                  choose.textColor = .lightGray
                  choose.font = .systemFont(
                      ofSize: 17,
                      weight: .semibold
                  )

                  view.addSubview(title)
                  view.addSubview(subtitle)
                  view.addSubview(choose)

                  NSLayoutConstraint.activate([

                      title.topAnchor.constraint(
                          equalTo: view.safeAreaLayoutGuide.topAnchor,
                          constant: 12
                      ),

                      title.centerXAnchor.constraint(
                          equalTo: view.centerXAnchor
                      ),

                      subtitle.topAnchor.constraint(
                          equalTo: title.bottomAnchor,
                          constant: 0
                      ),

                      subtitle.centerXAnchor.constraint(
                          equalTo: view.centerXAnchor
                      ),

                      choose.topAnchor.constraint(
                          equalTo: subtitle.bottomAnchor,
                          constant: 8
                      ),

                      choose.centerXAnchor.constraint(
                          equalTo: view.centerXAnchor
                      )
                  ])
              }

              private func buildMenu() {

                  stack.translatesAutoresizingMaskIntoConstraints = false
                  stack.axis = .vertical
                  stack.spacing = 9
                  stack.alignment = .fill
                  stack.distribution = .fillEqually

                  view.addSubview(stack)

                  addGameButton(
                      title: "MORTAL KOMBAT",
                      game: "MK1"
                  )

                  addGameButton(
                      title: "MORTAL KOMBAT II",
                      game: "MK2"
                  )

                  addGameButton(
                      title: "MORTAL KOMBAT 3",
                      game: "MK3"
                  )

                  addUtilityButton(
                      title: "ONLINE",
                      page: "ONLINE"
                  )

                  addUtilityButton(
                      title: "MODS",
                      page: "MODS"
                  )

                  addUtilityButton(
                      title: "SETTINGS",
                      page: "SETTINGS"
                  )

                  addUtilityButton(
                      title: "CREDITS",
                      page: "CREDITS"
                  )

                  NSLayoutConstraint.activate([

                      stack.centerXAnchor.constraint(
                          equalTo: view.centerXAnchor
                      ),

                      stack.centerYAnchor.constraint(
                          equalTo: view.centerYAnchor,
                          constant: 45
                      ),

                      stack.widthAnchor.constraint(
                          equalToConstant: 340
                      ),

                      stack.heightAnchor.constraint(
                          equalToConstant: 330
                      )
                  ])
              }

              private func makeButton(
                  _ title: String,
                  color: UIColor
              ) -> UIButton {

                  let button = UIButton(type: .system)

                  button.setTitle(title, for: .normal)

                  button.setTitleColor(
                      .white,
                      for: .normal
                  )

                  button.titleLabel?.font = .systemFont(
                      ofSize: 19,
                      weight: .bold
                  )

                  button.backgroundColor = color

                  button.layer.cornerRadius = 10
                  button.layer.borderWidth = 1
                  button.layer.borderColor =
                      UIColor.white.withAlphaComponent(0.18).cgColor

                  return button
              }

              private func addGameButton(
                  title: String,
                  game: String
              ) {

                  let button = makeButton(
                      title,
                      color: UIColor(
                          red: 0.32,
                          green: 0.035,
                          blue: 0.035,
                          alpha: 1
                      )
                  )

                  button.accessibilityIdentifier = game

                  button.addAction(
                      UIAction { [weak self] _ in

                          let screen =
                              GameMenuViewController(game: game)

                          self?.navigationController?
                              .pushViewController(
                                  screen,
                                  animated: true
                              )
                      },
                      for: .touchUpInside
                  )

                  stack.addArrangedSubview(button)
              }

              private func addUtilityButton(
                  title: String,
                  page: String
              ) {

                  let button = makeButton(
                      title,
                      color: UIColor(
                          white: 0.11,
                          alpha: 1
                      )
                  )

                  button.addAction(
                      UIAction { [weak self] _ in

                          let screen =
                              UtilityViewController(titleText: page)

                          self?.navigationController?
                              .pushViewController(
                                  screen,
                                  animated: true
                              )
                      },
                      for: .touchUpInside
                  )

                  stack.addArrangedSubview(button)
              }

              override var prefersHomeIndicatorAutoHidden: Bool {
                  true
              }

              override var prefersStatusBarHidden: Bool {
                  true
              }
          }
          SWIFT

      # ==========================================================
      # GAME MENU
      # ==========================================================

      - name: Create GameMenuViewController.swift
        run: |
          cat > MKRemasteredTrilogy/GameMenuViewController.swift <<'SWIFT'
          import UIKit

          final class GameMenuViewController: UIViewController {

              private let game: String

              private var firstPerson = false

              private let cameraButton =
                  UIButton(type: .system)

              init(game: String) {
                  self.game = game
                  super.init(
                      nibName: nil,
                      bundle: nil
                  )
              }

              required init?(coder: NSCoder) {
                  fatalError("init(coder:) has not been implemented")
              }

              override func viewDidLoad() {
                  super.viewDidLoad()

                  view.backgroundColor = UIColor(
                      red: 0.025,
                      green: 0.025,
                      blue: 0.03,
                      alpha: 1
                  )

                  buildUI()
              }

              private func buildUI() {

                  let title = UILabel()
                  title.translatesAutoresizingMaskIntoConstraints = false
                  title.text = gameTitle()
                  title.textAlignment = .center
                  title.textColor = .white
                  title.font = .systemFont(
                      ofSize: 34,
                      weight: .black
                  )

                  let status = UILabel()
                  status.translatesAutoresizingMaskIntoConstraints = false
                  status.text = "REMASTERED"
                  status.textAlignment = .center
                  status.textColor = .systemRed
                  status.font = .systemFont(
                      ofSize: 18,
                      weight: .bold
                  )

                  let stack = UIStackView()
                  stack.translatesAutoresizingMaskIntoConstraints = false
                  stack.axis = .vertical
                  stack.spacing = 10
                  stack.distribution = .fillEqually

                  let play = makeButton("PLAY")

                  play.addAction(
                      UIAction { [weak self] _ in

                          guard let self else { return }

                          let fight =
                              FightPrototypeViewController(
                                  game: self.game,
                                  firstPerson:
                                      self.firstPerson
                              )

                          self.navigationController?
                              .pushViewController(
                                  fight,
                                  animated: true
                              )
                      },
                      for: .touchUpInside
                  )

                  cameraButton.setTitle(
                      "CAMERA: CLASSIC",
                      for: .normal
                  )

                  styleButton(cameraButton)

                  cameraButton.addAction(
                      UIAction { [weak self] _ in

                          guard let self else { return }

                          self.firstPerson.toggle()

                          let text =
                              self.firstPerson
                              ? "CAMERA: FIRST PERSON"
                              : "CAMERA: CLASSIC"

                          self.cameraButton.setTitle(
                              text,
                              for: .normal
                          )
                      },
                      for: .touchUpInside
                  )

                  let moves = makeButton("MOVE LIST")

                  moves.addAction(
                      UIAction { [weak self] _ in

                          self?.showMoveList()
                      },
                      for: .touchUpInside
                  )

                  let back = makeButton("BACK")

                  back.addAction(
                      UIAction { [weak self] _ in
                          self?.navigationController?
                              .popViewController(
                                  animated: true
                              )
                      },
                      for: .touchUpInside
                  )

                  stack.addArrangedSubview(play)
                  stack.addArrangedSubview(cameraButton)
                  stack.addArrangedSubview(moves)
                  stack.addArrangedSubview(back)

                  view.addSubview(title)
                  view.addSubview(status)
                  view.addSubview(stack)

                  NSLayoutConstraint.activate([

                      title.topAnchor.constraint(
                          equalTo: view.safeAreaLayoutGuide.topAnchor,
                          constant: 25
                      ),

                      title.centerXAnchor.constraint(
                          equalTo: view.centerXAnchor
                      ),

                      status.topAnchor.constraint(
                          equalTo: title.bottomAnchor,
                          constant: 4
                      ),

                      status.centerXAnchor.constraint(
                          equalTo: view.centerXAnchor
                      ),

                      stack.centerXAnchor.constraint(
                          equalTo: view.centerXAnchor
                      ),

                      stack.centerYAnchor.constraint(
                          equalTo: view.centerYAnchor,
                          constant: 35
                      ),

                      stack.widthAnchor.constraint(
                          equalToConstant: 340
                      ),

                      stack.heightAnchor.constraint(
                          equalToConstant: 230
                      )
                  ])
              }

              private func gameTitle() -> String {

                  switch game {

                  case "MK1":
                      return "MORTAL KOMBAT"

                  case "MK2":
                      return "MORTAL KOMBAT II"

                  default:
                      return "MORTAL KOMBAT 3"
                  }
              }

              private func makeButton(
                  _ title: String
              ) -> UIButton {

                  let button = UIButton(type: .system)

                  button.setTitle(
                      title,
                      for: .normal
                  )

                  styleButton(button)

                  return button
              }

              private func styleButton(
                  _ button: UIButton
              ) {

                  button.setTitleColor(
                      .white,
                      for: .normal
                  )

                  button.titleLabel?.font =
                      .systemFont(
                          ofSize: 18,
                          weight: .bold
                      )

                  button.backgroundColor =
                      UIColor(
                          red: 0.28,
                          green: 0.03,
                          blue: 0.03,
                          alpha: 1
                      )

                  button.layer.cornerRadius = 10
              }

              private func showMoveList() {

                  let alert = UIAlertController(
                      title: "MOVE LIST",
                      message:
                      """
                      BASIC ATTACKS

                      PUNCH
                      KICK
                      BLOCK
                      THROW

                      SPECIAL MOVES

                      Coming in the next build.
                      """,
                      preferredStyle: .alert
                  )

                  alert.addAction(
                      UIAlertAction(
                          title: "BACK",
                          style: .default
                      )
                  )

                  present(
                      alert,
                      animated: true
                  )
              }

              override var prefersStatusBarHidden: Bool {
                  true
              }
          }
          SWIFT

      # ==========================================================
      # FIGHT PROTOTYPE WITH TOUCH BUTTONS
      # ==========================================================

      - name: Create FightPrototypeViewController.swift
        run: |
          cat > MKRemasteredTrilogy/FightPrototypeViewController.swift <<'SWIFT'
          import UIKit

          final class FightPrototypeViewController: UIViewController {

              private let game: String
              private var firstPerson: Bool

              private let infoLabel = UILabel()
              private let player = UIView()
              private let enemy = UIView()

              init(
                  game: String,
                  firstPerson: Bool
              ) {

                  self.game = game
                  self.firstPerson = firstPerson

                  super.init(
                      nibName: nil,
                      bundle: nil
                  )
              }

              required init?(coder: NSCoder) {
                  fatalError("init(coder:) has not been implemented")
              }

              override func viewDidLoad() {
                  super.viewDidLoad()

                  view.backgroundColor =
                      UIColor(
                          red: 0.06,
                          green: 0.06,
                          blue: 0.07,
                          alpha: 1
                      )

                  buildArena()
                  buildControls()
                  updateCamera()
              }

              private func buildArena() {

                  let top = UILabel()
                  top.translatesAutoresizingMaskIntoConstraints = false
                  top.text = "\(game)  •  FIGHT PROTOTYPE"
                  top.textColor = .white
                  top.font = .systemFont(
                      ofSize: 19,
                      weight: .bold
                  )

                  infoLabel.translatesAutoresizingMaskIntoConstraints = false
                  infoLabel.textAlignment = .center
                  infoLabel.textColor = .systemYellow
                  infoLabel.font = .systemFont(
                      ofSize: 15,
                      weight: .semibold
                  )

                  player.translatesAutoresizingMaskIntoConstraints = false
                  player.backgroundColor = .systemBlue
                  player.layer.cornerRadius = 14

                  enemy.translatesAutoresizingMaskIntoConstraints = false
                  enemy.backgroundColor = .systemRed
                  enemy.layer.cornerRadius = 14

                  view.addSubview(top)
                  view.addSubview(infoLabel)
                  view.addSubview(player)
                  view.addSubview(enemy)

                  NSLayoutConstraint.activate([

                      top.topAnchor.constraint(
                          equalTo: view.safeAreaLayoutGuide.topAnchor,
                          constant: 5
                      ),

                      top.centerXAnchor.constraint(
                          equalTo: view.centerXAnchor
                      ),

                      infoLabel.topAnchor.constraint(
                          equalTo: top.bottomAnchor,
                          constant: 5
                      ),

                      infoLabel.centerXAnchor.constraint(
                          equalTo: view.centerXAnchor
                      ),

                      player.leadingAnchor.constraint(
                          equalTo: view.leadingAnchor,
                          constant: 190
                      ),

                      player.centerYAnchor.constraint(
                          equalTo: view.centerYAnchor,
                          constant: -20
                      ),

                      player.widthAnchor.constraint(
                          equalToConstant: 55
                      ),

                      player.heightAnchor.constraint(
                          equalToConstant: 135
                      ),

                      enemy.trailingAnchor.constraint(
                          equalTo: view.trailingAnchor,
                          constant: -190
                      ),

                      enemy.centerYAnchor.constraint(
                          equalTo: view.centerYAnchor,
                          constant: -20
                      ),

                      enemy.widthAnchor.constraint(
                          equalToConstant: 55
                      ),

                      enemy.heightAnchor.constraint(
                          equalToConstant: 135
                      )
                  ])
              }

              private func buildControls() {

                  let left = controlButton("◀")
                  let right = controlButton("▶")

                  let punch = controlButton("P")
                  let kick = controlButton("K")
                  let block = controlButton("B")
                  let special = controlButton("S")

                  let pause = controlButton("Ⅱ")
                  let camera = controlButton("CAM")

                  left.frame =
                      CGRect(
                          x: 25,
                          y: view.bounds.height - 110,
                          width: 65,
                          height: 65
                      )

                  right.frame =
                      CGRect(
                          x: 100,
                          y: view.bounds.height - 110,
                          width: 65,
                          height: 65
                      )

                  punch.frame =
                      CGRect(
                          x: view.bounds.width - 175,
                          y: view.bounds.height - 145,
                          width: 60,
                          height: 60
                      )

                  kick.frame =
                      CGRect(
                          x: view.bounds.width - 100,
                          y: view.bounds.height - 145,
                          width: 60,
                          height: 60
                      )

                  block.frame =
                      CGRect(
                          x: view.bounds.width - 175,
                          y: view.bounds.height - 75,
                          width: 60,
                          height: 60
                      )

                  special.frame =
                      CGRect(
                          x: view.bounds.width - 100,
                          y: view.bounds.height - 75,
                          width: 60,
                          height: 60
                      )

                  pause.frame =
                      CGRect(
                          x: 20,
                          y: 20,
                          width: 55,
                          height: 40
                      )

                  camera.frame =
                      CGRect(
                          x: view.bounds.width - 90,
                          y: 20,
                          width: 70,
                          height: 40
                      )

                  left.autoresizingMask =
                      [.flexibleTopMargin, .flexibleRightMargin]

                  right.autoresizingMask =
                      [.flexibleTopMargin, .flexibleRightMargin]

                  punch.autoresizingMask =
                      [.flexibleTopMargin, .flexibleLeftMargin]

                  kick.autoresizingMask =
                      [.flexibleTopMargin, .flexibleLeftMargin]

                  block.autoresizingMask =
                      [.flexibleTopMargin, .flexibleLeftMargin]

                  special.autoresizingMask =
                      [.flexibleTopMargin, .flexibleLeftMargin]

                  camera.autoresizingMask =
                      [.flexibleLeftMargin, .flexibleBottomMargin]

                  addTap(
                      left,
                      action: { [weak self] in
                          self?.movePlayer(-15)
                      }
                  )

                  addTap(
                      right,
                      action: { [weak self] in
                          self?.movePlayer(15)
                      }
                  )

                  addTap(
                      punch,
                      action: { [weak self] in
                          self?.attack("PUNCH")
                      }
                  )

                  addTap(
                      kick,
                      action: { [weak self] in
                          self?.attack("KICK")
                      }
                  )

                  addTap(
                      block,
                      action: { [weak self] in
                          self?.attack("BLOCK")
                      }
                  )

                  addTap(
                      special,
                      action: { [weak self] in
                          self?.attack("SPECIAL")
                      }
                  )

                  addTap(
                      camera,
                      action: { [weak self] in

                          guard let self else {
                              return
                          }

                          self.firstPerson.toggle()
                          self.updateCamera()
                      }
                  )

                  addTap(
                      pause,
                      action: { [weak self] in
                          self?.showPause()
                      }
                  )

                  [
                      left,
                      right,
                      punch,
                      kick,
                      block,
                      special,
                      pause,
                      camera
                  ].forEach {
                      view.addSubview($0)
                  }
              }

              private func controlButton(
                  _ text: String
              ) -> UIButton {

                  let button = UIButton(type: .system)

                  button.setTitle(
                      text,
                      for: .normal
                  )

                  button.setTitleColor(
                      .white,
                      for: .normal
                  )

                  button.titleLabel?.font =
                      .systemFont(
                          ofSize: 18,
                          weight: .black
                      )

                  button.backgroundColor =
                      UIColor.black.withAlphaComponent(0.55)

                  button.layer.cornerRadius = 16
                  button.layer.borderWidth = 1.5
                  button.layer.borderColor =
                      UIColor.white.withAlphaComponent(0.45).cgColor

                  return button
              }

              private func addTap(
                  _ button: UIButton,
                  action: @escaping () -> Void
              ) {

                  button.addAction(
                      UIAction { _ in
                          action()
                      },
                      for: .touchUpInside
                  )
              }

              private func movePlayer(
                  _ delta: CGFloat
              ) {

                  player.transform =
                      player.transform.translatedBy(
                          x: delta,
                          y: 0
                      )

                  infoLabel.text = "MOVE"
              }

              private func attack(
                  _ attack: String
              ) {

                  infoLabel.text = attack

                  UIView.animate(
                      withDuration: 0.08,
                      animations: {

                          self.enemy.transform =
                              CGAffineTransform(
                                  translationX: 8,
                                  y: 0
                              )

                      },
                      completion: { _ in

                          UIView.animate(
                              withDuration: 0.08
                          ) {
                              self.enemy.transform = .identity
                          }
                      }
                  )
              }

              private func updateCamera() {

                  if firstPerson {

                      player.isHidden = true

                      enemy.transform =
                          CGAffineTransform(
                              scaleX: 1.65,
                              y: 1.65
                          )

                      infoLabel.text =
                          "FIRST PERSON CAMERA"

                  } else {

                      player.isHidden = false
                      enemy.transform = .identity

                      infoLabel.text =
                          "CLASSIC CAMERA"
                  }
              }

              private func showPause() {

                  let pause = UIAlertController(
                      title: "PAUSED",
                      message:
                      """
                      RESUME

                      MOVE LIST

                      CAMERA MODE

                      RETURN TO MENU
                      """,
                      preferredStyle: .alert
                  )

                  pause.addAction(
                      UIAlertAction(
                          title: "RESUME",
                          style: .default
                      )
                  )

                  pause.addAction(
                      UIAlertAction(
                          title: "MOVE LIST",
                          style: .default,
                          handler: { [weak self] _ in

                              self?.showMoveList()
                          }
                      )
                  )

                  pause.addAction(
                      UIAlertAction(
                          title: "RETURN TO MENU",
                          style: .destructive,
                          handler: { [weak self] _ in

                              self?.navigationController?
                                  .popViewController(
                                      animated: true
                                  )
                          }
                      )
                  )

                  present(
                      pause,
                      animated: true
                  )
              }

              private func showMoveList() {

                  let moves = UIAlertController(
                      title: "MOVE LIST",
                      message:
                      """
                      ◀ / ▶  Move

                      P  Punch
                      K  Kick
                      B  Block
                      S  Special

                      CAM  Switch Camera
                      """,
                      preferredStyle: .alert
                  )

                  moves.addAction(
                      UIAlertAction(
                          title: "BACK",
                          style: .default
                      )
                  )

                  present(
                      moves,
                      animated: true
                  )
              }

              override var prefersStatusBarHidden: Bool {
                  true
              }
          }
          SWIFT

      # ==========================================================
      # UTILITY PAGES
      # ==========================================================

      - name: Create UtilityViewController.swift
        run: |
          cat > MKRemasteredTrilogy/UtilityViewController.swift <<'SWIFT'
          import UIKit

          final class UtilityViewController: UIViewController {

              private let titleText: String

              init(titleText: String) {
                  self.titleText = titleText

                  super.init(
                      nibName: nil,
                      bundle: nil
                  )
              }

              required init?(coder: NSCoder) {
                  fatalError("init(coder:) has not been implemented")
              }

              override func viewDidLoad() {
                  super.viewDidLoad()

                  view.backgroundColor =
                      UIColor(
                          red: 0.035,
                          green: 0.035,
                          blue: 0.045,
                          alpha: 1
                      )

                  let title = UILabel()
                  title.translatesAutoresizingMaskIntoConstraints = false
                  title.text = titleText
                  title.textColor = .white
                  title.textAlignment = .center
                  title.font = .systemFont(
                      ofSize: 38,
                      weight: .black
                  )

                  let text = UILabel()
                  text.translatesAutoresizingMaskIntoConstraints = false
                  text.textAlignment = .center
                  text.numberOfLines = 0
                  text.textColor = .lightGray
                  text.font = .systemFont(
                      ofSize: 18,
                      weight: .medium
                  )

                  switch titleText {

                  case "ONLINE":
                      text.text =
                      """
                      QUICK MATCH

                      PRIVATE MATCH

                      FRIEND MATCH
                      """

                  case "MODS":
                      text.text =
                      """
                      INSTALLED MODS

                      IMPORT MOD

                      ENABLE / DISABLE
                      """

                  case "SETTINGS":
                      text.text =
                      """
                      GRAPHICS

                      SOUND

                      CONTROLS

                      CAMERA
                      """

                  default:
                      text.text =
                      """
                      MK REMASTERED TRILOGY

                      iOS Prototype
                      """
                  }

                  let back = UIButton(type: .system)
                  back.translatesAutoresizingMaskIntoConstraints = false
                  back.setTitle("BACK", for: .normal)
                  back.setTitleColor(.white, for: .normal)
                  back.titleLabel?.font =
                      .systemFont(
                          ofSize: 18,
                          weight: .bold
                      )

                  back.backgroundColor =
                      UIColor(
                          red: 0.3,
                          green: 0.03,
                          blue: 0.03,
                          alpha: 1
                      )

                  back.layer.cornerRadius = 10

                  back.addAction(
                      UIAction { [weak self] _ in

                          self?.navigationController?
                              .popViewController(
                                  animated: true
                              )
                      },
                      for: .touchUpInside
                  )

                  view.addSubview(title)
                  view.addSubview(text)
                  view.addSubview(back)

                  NSLayoutConstraint.activate([

                      title.topAnchor.constraint(
                          equalTo: view.safeAreaLayoutGuide.topAnchor,
                          constant: 40
                      ),

                      title.centerXAnchor.constraint(
                          equalTo: view.centerXAnchor
                      ),

                      text.centerXAnchor.constraint(
                          equalTo: view.centerXAnchor
                      ),

                      text.centerYAnchor.constraint(
                          equalTo: view.centerYAnchor
                      ),

                      back.bottomAnchor.constraint(
                          equalTo: view.safeAreaLayoutGuide.bottomAnchor,
                          constant: -20
                      ),

                      back.centerXAnchor.constraint(
                          equalTo: view.centerXAnchor
                      ),

                      back.widthAnchor.constraint(
                          equalToConstant: 220
                      ),

                      back.heightAnchor.constraint(
                          equalToConstant: 48
                      )
                  ])
              }

              override var prefersStatusBarHidden: Bool {
                  true
              }
          }
          SWIFT

      # ==========================================================
      # GENERATE XCODE PROJECT
      # ==========================================================

      - name: Generate Xcode project
        run: |
          xcodegen generate

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build iPhone app
        run: |
          set -o pipefail

          xcodebuild \
            -project MKRemasteredTrilogy.xcodeproj \
            -scheme MKRemasteredTrilogy \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # ==========================================================
      # CREATE IPA
      # ==========================================================

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/MKRemasteredTrilogy.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: APP NOT FOUND"
            find build -name "*.app" -print
            exit 1
          fi

          mkdir -p Payload

          cp -R \
            "$APP" \
            Payload/

          zip -r \
            MK-Remastered-Trilogy-Prototype.ipa \
            Payload

          ls -lh \
            MK-Remastered-Trilogy-Prototype.ipa

      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MK-Remastered-Trilogy-iOS
          path: MK-Remastered-Trilogy-Prototype.ipa
          compression-level: 0
