          - (void)mkApplyCRT
          {
              if (!_rootContainer)
                  return;


              UIView *old =
                  [_rootContainer
                   viewWithTag:8999];


              [old
               removeFromSuperview];


              BOOL enabled =
                  [[NSUserDefaults
                    standardUserDefaults]
                   boolForKey:
                   @"MKEnhanced"];


              if (!enabled)
              {
                  self.screenView.layer
                      .magnificationFilter =
                      kCAFilterNearest;

                  self.screenView.layer
                      .shouldRasterize =
                      YES;

                  return;
              }


              self.screenView.layer
                  .magnificationFilter =
                  kCAFilterLinear;


              self.screenView.layer
                  .shouldRasterize =
                  NO;


              CGRect screenRect =
                  [self.screenView
                   convertRect:
                   self.screenView.bounds
                   toView:_rootContainer];


              UIView *overlay =
                  [[UIView alloc]
                   initWithFrame:
                   screenRect];


              overlay.tag =
                  8999;


              overlay.userInteractionEnabled =
                  NO;


              overlay.clipsToBounds =
                  YES;


              CGFloat width =
                  CGRectGetWidth(
                      overlay.bounds
                  );


              CGFloat height =
                  CGRectGetHeight(
                      overlay.bounds
                  );


              for (
                  CGFloat y = 1;
                  y < height;
                  y += 4
              )
              {
                  UIView *line =
                      [[UIView alloc]
                       initWithFrame:
                       CGRectMake(
                           0,
                           y,
                           width,
                           1
                       )];


                  line.backgroundColor =
                      [UIColor
                       colorWithWhite:0
                       alpha:0.13];


                  line.userInteractionEnabled =
                      NO;


                  [overlay
                   addSubview:line];
              }


              [_rootContainer
               addSubview:overlay];


              for (
                  UIView *view
                  in _rootContainer.subviews
              )
              {
                  if (
                      [view.accessibilityIdentifier
                       isEqualToString:
                       @"MK_TOUCH"]
                  )
                  {
                      [_rootContainer
                       bringSubviewToFront:view];
                  }
              }
          }

