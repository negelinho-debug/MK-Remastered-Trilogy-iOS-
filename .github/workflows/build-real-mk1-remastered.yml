          import SwiftUI

          @main
          struct MK1RemasteredApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

      - name: Generate Xcode project
        run: |
          set -e

          cd MK1Remastered
          xcodegen generate

      - name: Build app
        run: |
          set +e
          set -o pipefail

          xcodebuild \
            -project MK1Remastered/MK1Remastered.xcodeproj \
            -scheme MK1Remastered \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee output/xcodebuild.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "===== COMPILER ERRORS ====="
          grep -n -E "error:|fatal error:" output/xcodebuild.log | tail -120 || true

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      - name: Locate built app
        run: |
          set -e

          APP=$(
            find build/Build/Products \
              -type d \
              -name "MK1Remastered.app" \
              | head -1
          )

          if [ -z "$APP" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi

          echo "$APP" > output/app-path.txt
          echo "APP=$APP"

      - name: Create build info
        run: |
          set -e

          APP=$(cat output/app-path.txt)

          {
            echo "========================================"
            echo "MK1 REMASTERED PROTOTYPE"
            echo "========================================"
            echo
            echo "REAL ASSET BUILD"
            echo
            echo "FEATURES:"
            echo "- REAL LIU KANG FRAMES"
            echo "- REAL RAIDEN FRAMES"
            echo "- REAL MK1 GRA EXPORT"
            echo "- CLASSIC MODE"
            echo "- REMASTERED MODE"
            echo "- HUD"
            echo "- TIMER"
            echo "- HP BARS"
            echo "- TOUCH CONTROLS"
            echo "- LP / HP / HK / LK / BLOCK"
            echo "- SIMPLE AI"
            echo
            echo "APP:"
            echo "$APP"
            echo
            echo "EXPORTED COUNTS:"
            echo "LIU_IDLE=$(find exported-assets/Characters/LiuKang/Idle -type f -name '*.png' | wc -l | tr -d ' ')"
            echo "LIU_ATTACK=$(find exported-assets/Characters/LiuKang/Attack -type f -name '*.png' | wc -l | tr -d ' ')"
            echo "RAIDEN_IDLE=$(find exported-assets/Characters/Raiden/Idle -type f -name '*.png' | wc -l | tr -d ' ')"
            echo "RAIDEN_ATTACK=$(find exported-assets/Characters/Raiden/Attack -type f -name '*.png' | wc -l | tr -d ' ')"
          } > output/BUILD-INFO.txt

          cat output/BUILD-INFO.txt

      - name: Create IPA
        run: |
          set -e

          APP=$(cat output/app-path.txt)

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            output/MK1-Remastered-REAL.ipa

          ls -lh output/MK1-Remastered-REAL.ipa

      - name: Upload successful artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MK1-Remastered-REAL
          path: |
            output/MK1-Remastered-REAL.ipa
            output/BUILD-INFO.txt
            exported-assets/manifest.json
            exported-assets/Characters
            exported-assets/Backgrounds
          compression-level: 0

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MK1-Remastered-FAIL
          path: |
            output/xcodebuild.log
            output/BUILD-INFO.txt
            output/app-path.txt
            exported-assets/manifest.json
          if-no-files-found: ignore
