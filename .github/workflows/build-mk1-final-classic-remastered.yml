name: Build MK Trilogy Classic v0.4 MK2 Reset + MK3 Restart

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e
          brew install innoextract p7zip
          python3 -m pip install --break-system-packages pillow || python3 -m pip install --user pillow
          xcodebuild -version

      - name: Prepare folders
        run: |
          set -e
          rm -rf raw-installers installers release-files extracted game dospad icon-tools build Payload output
          mkdir -p raw-installers installers release-files extracted game output

      - name: Collect installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          INDEX=0

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            INDEX=$((INDEX + 1))
            cp "$FILE" "raw-installers/repo_${INDEX}.exe"
          done < <(
            find . \
              -type f \
              -iname "*.exe" \
              -not -path "./.git/*" \
              -not -path "./raw-installers/*" \
              -not -path "./installers/*" \
              -not -path "./release-files/*" \
              -not -path "./extracted/*" \
              -not -path "./game/*" \
              -not -path "./dospad/*" \
              -not -path "./icon-tools/*" \
              -not -path "./build/*" \
              -not -path "./Payload/*" \
              -not -path "./output/*" \
              | sort
          )

          set +e
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --dir release-files --pattern "*.exe"
          fi
          set -e

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            INDEX=$((INDEX + 1))
            cp "$FILE" "raw-installers/release_${INDEX}.exe"
          done < <(
            find release-files -type f -iname "*.exe" | sort
          )

          ls -lh raw-installers || true

      - name: Deduplicate installers
        run: |
          set -e
          FOUND=0

          for FILE in raw-installers/*.exe; do
            [ -f "$FILE" ] || continue
            FOUND=1
            HASH=$(shasum -a 256 "$FILE" | awk '{print $1}')
            [ -f "installers/${HASH}.exe" ] || cp "$FILE" "installers/${HASH}.exe"
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: NO INSTALLERS FOUND"
            exit 1
          fi

      - name: Extract installers
        run: |
          set -e
          INDEX=0

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            INDEX=$((INDEX + 1))
            DEST="extracted/pkg${INDEX}"
            mkdir -p "$DEST"

            set +e
            innoextract --extract --output-dir "$DEST" "$FILE"
            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              7z x "$FILE" "-o$DEST" -y
            fi
            set -e
          done < <(
            find installers -type f -iname "*.exe" | sort
          )

          find extracted -type f -iname "MK1.EXE" -print || true

      - name: Normalize complete MK Trilogy
        run: |
          set -e

          normalize_game() {
            GAME="$1"
            EXE_NAME="$2"

            EXE_PATH=$(
              find extracted \
                -type f \
                -iname "$EXE_NAME" \
                -not -path "*/__support/*" \
                | head -1
            )

            if [ -z "$EXE_PATH" ]; then
              echo "ERROR: $EXE_NAME NOT FOUND"
              exit 1
            fi

            SRC_DIR="$(dirname "$EXE_PATH")"

            rm -rf "game/$GAME"
            mkdir -p "game/$GAME"
            cp -R "$SRC_DIR"/. "game/$GAME/"

            test -f "game/$GAME/$EXE_NAME"

            echo "$GAME FILES=$(find "game/$GAME" -type f | wc -l | tr -d ' ')"
          }

          normalize_game MK1 MK1.EXE
          normalize_game MK2 MK2.EXE
          normalize_game MK3 MK3.EXE

          echo "===== RESET MK2 SAVED CONTROLS ====="
          find game/MK2 -type f \( -iname "CMOS" -o -iname "CMOS.*" \) -print -delete || true

          echo "===== TRILOGY READY ====="
          ls -lh game/MK1/MK1.EXE
          ls -lh game/MK2/MK2.EXE
          ls -lh game/MK3/MK3.EXE

      - name: Prepare MK3 CD image
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path("game/MK3")
          out = root / "CDIMAGE"

          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          cues = [
              p for p in root.rglob("*")
              if p.is_file()
              and p.suffix.lower() == ".cue"
              and out not in p.parents
          ]

          isos = [
              p for p in root.rglob("*")
              if p.is_file()
              and p.suffix.lower() == ".iso"
              and out not in p.parents
          ]

          def case_insensitive_child(folder: Path, name: str):
              direct = folder / name
              if direct.exists():
                  return direct

              wanted = Path(name).name.lower()

              for p in folder.iterdir():
                  if p.name.lower() == wanted:
                      return p

              return None

          if cues:
              cue = cues[0]
              raw = cue.read_text(
                  encoding="latin-1",
                  errors="ignore"
              )

              referenced = re.findall(
                  r'(?im)^\s*FILE\s+"([^"]+)"\s+\S+',
                  raw
              )

              replacements = {}

              for ref in referenced:
                  source = case_insensitive_child(
                      cue.parent,
                      ref
                  )

                  if source is None:
                      # Last-resort search by basename.
                      matches = [
                          p for p in root.rglob("*")
                          if p.is_file()
                          and p.name.lower()
                              == Path(ref).name.lower()
                          and out not in p.parents
                      ]

                      if matches:
                          source = matches[0]

                  if source is None:
                      raise SystemExit(
                          f"ERROR: CUE references missing file: {ref}"
                      )

                  dest_name = source.name
                  shutil.copy2(
                      source,
                      out / dest_name
                  )

                  replacements[ref] = dest_name

              rewritten = raw

              for old, new in replacements.items():
                  rewritten = rewritten.replace(
                      f'"{old}"',
                      f'"{new}"'
                  )

              cue_name = cue.name

              (out / cue_name).write_text(
                  rewritten,
                  encoding="latin-1"
              )

              mount = (
                  f'IMGMOUNT D C:\\CDIMAGE\\{cue_name} '
                  f'-t iso'
              )

              (root / "MK3-CD-MOUNT.TXT").write_text(
                  mount + "\n",
                  encoding="ascii"
              )

              print("MK3 CUE:", cue)
              print("MK3 CD MOUNT:", mount)
              print(
                  "CD FILES:",
                  [p.name for p in out.iterdir()]
              )

          elif isos:
              iso = isos[0]
              dest = out / "MK3.ISO"
              shutil.copy2(iso, dest)

              mount = (
                  r'IMGMOUNT D C:\CDIMAGE\MK3.ISO -t iso'
              )

              (root / "MK3-CD-MOUNT.TXT").write_text(
                  mount + "\n",
                  encoding="ascii"
              )

              print("MK3 ISO:", iso)
              print("MK3 CD MOUNT:", mount)

          else:
              gog = [
                  p for p in root.rglob("*")
                  if p.is_file()
                  and p.suffix.lower() == ".gog"
              ]

              if gog:
                  print(
                      "ERROR: MK3 .GOG image exists but no .CUE was found."
                  )
                  print(
                      "A proper CUE is needed to mount the MK3 CD safely."
                  )
              else:
                  print(
                      "ERROR: NO MK3 CUE/ISO CD IMAGE FOUND."
                  )

              raise SystemExit(1)
          PY

          test -s game/MK3/MK3-CD-MOUNT.TXT

          echo "===== MK3 CD MOUNT ====="
          cat game/MK3/MK3-CD-MOUNT.TXT
          echo "===== MK3 CDIMAGE ====="
          find game/MK3/CDIMAGE -maxdepth 1 -type f -print

      - name: Clone iDOS
        run: |
          set -e
          git clone --depth 1 https://github.com/litchie/dospad.git dospad
          xcodebuild -project dospad/dospad.xcodeproj -list


      - name: Create Classic configs
        run: |
          set -e

          BASE="dospad/Resources/configs/dospad.cfg"
          test -f "$BASE"

          for GAME in MK1 MK2 MK3; do
            cp "$BASE" "game/$GAME/CLASSIC.CFG"
          done

          python3 <<'PY'
          from pathlib import Path
          import re

          def set_option(text, section, key, value):
              pattern = rf"(?m)^{re.escape(key)}\s*=.*$"

              if re.search(pattern, text):
                  return re.sub(pattern, f"{key}={value}", text)

              marker = f"[{section}]"

              if marker in text:
                  return text.replace(
                      marker,
                      marker + f"\n{key}={value}",
                      1
                  )

              return text + f"\n[{section}]\n{key}={value}\n"

          # Keep stock iDOS CPU/timing from the known-good MK1 build.
          # Force keyboard input so MK2/MK3 do not switch to joystick mode.
          for game in ("MK1", "MK2", "MK3"):
              p = Path(f"game/{game}/CLASSIC.CFG")
              cfg = p.read_text(errors="ignore")
              cfg = set_option(cfg, "render", "scaler", "none")
              cfg = set_option(cfg, "joystick", "joysticktype", "none")
              p.write_text(cfg)

          print("CLASSIC CONFIGS READY")
          PY

          for GAME in MK1 MK2 MK3; do
            mkdir -p "game/$GAME/config"
            cp "game/$GAME/CLASSIC.CFG" "game/$GAME/config/dospad.cfg"

            echo "===== $GAME CONFIG ====="
            grep -E "^(core|cycles|scaler|joysticktype)=" "game/$GAME/CLASSIC.CFG" || true
          done

      - name: Create Trilogy autoboot
        run: |
          set -e

          cat > game/MK3/RUNMK3.BAT <<'EOF'
          @ECHO OFF
          :MK3LOOP
          MK3.EXE
          GOTO MK3LOOP
          EOF

          cat > game/MK1/MKAUTO.TXT <<'EOF'
          C:
          CD \
          MK1.EXE
          EOF

          cat > game/MK2/MKAUTO.TXT <<'EOF'
          C:
          CD \
          MK2.EXE
          EOF

          {
            cat game/MK3/MK3-CD-MOUNT.TXT
            cat <<'EOF'
          C:
          CD \
          RUNMK3.BAT
          EOF
          } > game/MK3/MKAUTO.TXT

          echo "===== MK1 AUTOBOOT ====="
          cat game/MK1/MKAUTO.TXT

          echo "===== MK2 AUTOBOOT ====="
          cat game/MK2/MKAUTO.TXT

          echo "===== MK3 AUTOBOOT ====="
          cat game/MK3/MKAUTO.TXT

      - name: Patch final MK1 app
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------------------
          # 1) AUTOBOOT
          # ------------------------------------------------------

          emu = Path("dospad/dospad/Main/DOSPadEmulator.m")
          text = emu.read_text(encoding="utf-8")

          if "MKFINAL_AUTOBOOT" not in text:
              marker = '[self.commandList addObject:@"REM END AUTOMOUNT"];'
              if marker not in text:
                  raise SystemExit("ERROR: AUTOBOOT MARKER NOT FOUND")

              patch = marker + r'''

              // MKFINAL_AUTOBOOT
              NSString *mkBootPath =
                  [self.workingDirectory.path
                   stringByAppendingPathComponent:@"MKAUTO.TXT"];

              if ([[NSFileManager defaultManager] fileExistsAtPath:mkBootPath])
              {
                  NSString *mkText =
                      [NSString stringWithContentsOfFile:mkBootPath
                                                encoding:NSUTF8StringEncoding
                                                   error:nil];

                  for (NSString *raw in
                       [mkText componentsSeparatedByCharactersInSet:
                        [NSCharacterSet newlineCharacterSet]])
                  {
                      NSString *line =
                          [raw stringByTrimmingCharactersInSet:
                           [NSCharacterSet whitespaceAndNewlineCharacterSet]];

                      if (line.length > 0)
                          [self.commandList addObject:line];
                  }
              }
              // END MKFINAL_AUTOBOOT
              '''

              text = text.replace(marker, patch, 1)
              emu.write_text(text, encoding="utf-8")

          # ------------------------------------------------------
          # 2) TRILOGY MAIN MENU
          # ------------------------------------------------------

          delegate = Path("dospad/dospad/Main/DPAppDelegate.m")
          text = delegate.read_text(encoding="utf-8")

          if "MKTRILOGY_MENU" not in text:
              import_marker = '#import <AVFoundation/AVFoundation.h>'

              if import_marker not in text:
                  raise SystemExit(
                      "ERROR: APP DELEGATE IMPORT MARKER NOT FOUND"
                  )

              menu = r'''

          // ======================================================
          // MKTRILOGY_MENU
          // ======================================================

          @interface DPAppDelegate (MKTrilogy)
          - (void)mkTrilogyShowMenu;
          - (void)mkTrilogyLaunchGame:(NSString *)game;
          @end

          @interface MKTrilogyMenuController : UIViewController
          @property(nonatomic, weak) DPAppDelegate *owner;
          @property(nonatomic, strong) UIButton *mk1Button;
          @property(nonatomic, strong) UIButton *mk2Button;
          @property(nonatomic, strong) UIButton *mk3Button;
          @property(nonatomic, strong) UILabel *statusLabel;
          @end

          @implementation MKTrilogyMenuController

          - (UIButton *)mkGameButton:(NSString *)title
          {
              UIButton *b = [UIButton buttonWithType:UIButtonTypeSystem];

              [b setTitle:title forState:UIControlStateNormal];
              [b setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];

              b.titleLabel.font =
                  [UIFont systemFontOfSize:21 weight:UIFontWeightBlack];

              b.backgroundColor =
                  [UIColor colorWithRed:0.31 green:0.015 blue:0.02 alpha:1.0];

              b.layer.cornerRadius = 14;
              b.layer.borderWidth = 1;
              b.layer.borderColor =
                  [UIColor colorWithRed:0.95 green:0.15 blue:0.10 alpha:0.55].CGColor;

              return b;
          }

          - (void)viewDidLoad
          {
              [super viewDidLoad];

              self.view.backgroundColor =
                  [UIColor colorWithRed:0.012 green:0.006 blue:0.008 alpha:1.0];

              UIView *glow = [[UIView alloc] init];
              glow.tag = 7000;
              glow.backgroundColor =
                  [UIColor colorWithRed:0.20 green:0.005 blue:0.008 alpha:0.55];
              glow.userInteractionEnabled = NO;
              [self.view addSubview:glow];

              UILabel *title = [[UILabel alloc] init];
              title.tag = 7001;
              title.text = @"MORTAL KOMBAT";
              title.textAlignment = NSTextAlignmentCenter;
              title.textColor = UIColor.whiteColor;
              title.font = [UIFont systemFontOfSize:40 weight:UIFontWeightBlack];
              [self.view addSubview:title];

              UILabel *sub = [[UILabel alloc] init];
              sub.tag = 7002;
              sub.text = @"CLASSIC TRILOGY";
              sub.textAlignment = NSTextAlignmentCenter;
              sub.textColor = [UIColor colorWithRed:1 green:0.24 blue:0.16 alpha:1];
              sub.font = [UIFont systemFontOfSize:17 weight:UIFontWeightBlack];
              [self.view addSubview:sub];

              UILabel *choose = [[UILabel alloc] init];
              choose.tag = 7003;
              choose.text = @"CHOOSE YOUR GAME";
              choose.textAlignment = NSTextAlignmentCenter;
              choose.textColor = [UIColor colorWithWhite:0.72 alpha:1];
              choose.font = [UIFont systemFontOfSize:13 weight:UIFontWeightBold];
              [self.view addSubview:choose];

              self.mk1Button = [self mkGameButton:@"MORTAL KOMBAT"];
              self.mk1Button.tag = 1;
              [self.mk1Button addTarget:self
                                 action:@selector(gamePressed:)
                       forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:self.mk1Button];

              self.mk2Button = [self mkGameButton:@"MORTAL KOMBAT II"];
              self.mk2Button.tag = 2;
              [self.mk2Button addTarget:self
                                 action:@selector(gamePressed:)
                       forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:self.mk2Button];

              self.mk3Button = [self mkGameButton:@"MORTAL KOMBAT 3"];
              self.mk3Button.tag = 3;
              [self.mk3Button addTarget:self
                                 action:@selector(gamePressed:)
                       forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:self.mk3Button];

              self.statusLabel = [[UILabel alloc] init];
              self.statusLabel.text = @"ORIGINAL DOS GAMES • CLASSIC MODE";
              self.statusLabel.textAlignment = NSTextAlignmentCenter;
              self.statusLabel.textColor = [UIColor colorWithWhite:0.48 alpha:1];
              self.statusLabel.font = [UIFont systemFontOfSize:11 weight:UIFontWeightBold];
              [self.view addSubview:self.statusLabel];
          }

          - (void)gamePressed:(UIButton *)sender
          {
              self.mk1Button.enabled = NO;
              self.mk2Button.enabled = NO;
              self.mk3Button.enabled = NO;

              NSString *game = @"MK1";

              if (sender.tag == 2)
                  game = @"MK2";
              else if (sender.tag == 3)
                  game = @"MK3";

              self.statusLabel.text =
                  [NSString stringWithFormat:@"LOADING %@...", game];

              [self.owner mkTrilogyLaunchGame:game];
          }

          - (void)viewDidLayoutSubviews
          {
              [super viewDidLayoutSubviews];

              CGFloat w = CGRectGetWidth(self.view.bounds);
              CGFloat h = CGRectGetHeight(self.view.bounds);

              [self.view viewWithTag:7000].frame =
                  CGRectMake(0, 0, w, h * 0.38);

              [self.view viewWithTag:7001].frame =
                  CGRectMake(0, h * 0.09, w, 52);

              [self.view viewWithTag:7002].frame =
                  CGRectMake(0, h * 0.09 + 50, w, 28);

              [self.view viewWithTag:7003].frame =
                  CGRectMake(0, h * 0.09 + 86, w, 22);

              CGFloat bw = MIN(390, w - 90);
              CGFloat x = (w - bw) / 2.0;
              CGFloat y = h * 0.40;

              self.mk1Button.frame = CGRectMake(x, y, bw, 54);
              self.mk2Button.frame = CGRectMake(x, y + 64, bw, 54);
              self.mk3Button.frame = CGRectMake(x, y + 128, bw, 54);

              self.statusLabel.frame = CGRectMake(0, h - 32, w, 18);
          }

          - (BOOL)prefersStatusBarHidden
          {
              return YES;
          }

          - (UIInterfaceOrientationMask)supportedInterfaceOrientations
          {
              return UIInterfaceOrientationMaskLandscape;
          }

          @end

          // END MKTRILOGY_MENU

          '''

              text = text.replace(
                  import_marker,
                  import_marker + "\n" + menu,
                  1
              )

              old_start = (
                  '[self performSelector:@selector(startDOS) '
                  'withObject:nil afterDelay:1];'
              )

              new_start = (
                  '[self performSelector:@selector(mkTrilogyShowMenu) '
                  'withObject:nil afterDelay:0.20];'
              )

              if old_start not in text:
                  raise SystemExit("ERROR: STARTDOS MARKER NOT FOUND")

              text = text.replace(old_start, new_start, 1)

              method_marker = '-(void)setWindowTitle:(char *)title'

              if method_marker not in text:
                  raise SystemExit(
                      "ERROR: APP DELEGATE METHOD MARKER NOT FOUND"
                  )

              methods = r'''

          // ======================================================
          // MK TRILOGY CLASSIC LAUNCH
          // ======================================================

          - (void)mkTrilogyShowMenu
          {
              if ([DOSPadEmulator sharedInstance].started)
                  return;

              MKTrilogyMenuController *menu =
                  [[MKTrilogyMenuController alloc] init];

              menu.owner = self;
              menu.modalPresentationStyle =
                  UIModalPresentationFullScreen;

              [self.emulatorController
               presentViewController:menu
               animated:NO
               completion:nil];
          }

          - (void)mkTrilogyLaunchGame:(NSString *)game
          {
              NSFileManager *fm = [NSFileManager defaultManager];

              NSString *bundleGames =
                  [[NSBundle.mainBundle bundlePath]
                   stringByAppendingPathComponent:@"MKGames"];

              NSString *bundleGame =
                  [bundleGames stringByAppendingPathComponent:game];

              NSString *documents =
                  [NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                   ) lastObject];

              NSString *trilogyRoot =
                  [documents stringByAppendingPathComponent:@"MKTrilogyClassic"];

              NSString *destination =
                  [trilogyRoot stringByAppendingPathComponent:game];

              [fm createDirectoryAtPath:trilogyRoot
            withIntermediateDirectories:YES
                             attributes:@{}
                                  error:nil];

              [fm removeItemAtPath:destination error:nil];

              NSError *copyError = nil;

              if (![fm copyItemAtPath:bundleGame
                               toPath:destination
                                error:&copyError])
              {
                  NSLog(@"MK TRILOGY COPY ERROR: %@", copyError);
                  return;
              }

              NSString *sourceConfig =
                  [destination stringByAppendingPathComponent:@"CLASSIC.CFG"];

              NSString *configDirectory =
                  [destination stringByAppendingPathComponent:@"config"];

              [fm createDirectoryAtPath:configDirectory
            withIntermediateDirectories:YES
                             attributes:@{}
                                  error:nil];

              NSString *activeConfig =
                  [configDirectory stringByAppendingPathComponent:@"dospad.cfg"];

              [fm removeItemAtPath:activeConfig error:nil];

              NSError *configError = nil;

              [fm copyItemAtPath:sourceConfig
                          toPath:activeConfig
                           error:&configError];

              if (configError)
                  NSLog(@"MK TRILOGY CONFIG ERROR: %@", configError);

              [NSUserDefaults.standardUserDefaults
               setBool:NO
               forKey:@"MKFullscreenReady"];

              [NSUserDefaults.standardUserDefaults
               setObject:@"CLASSIC"
               forKey:@"MKRenderMode"];

              [NSUserDefaults.standardUserDefaults
               setObject:game
               forKey:@"MKSelectedGame"];

              [NSUserDefaults.standardUserDefaults synchronize];

              [DOSPadEmulator sharedInstance].workingDirectory =
                  [NSURL fileURLWithPath:destination isDirectory:YES];

              UIViewController *menu =
                  self.emulatorController.presentedViewController;

              [menu dismissViewControllerAnimated:NO
                                       completion:^{
                  [self startDOS];
              }];
          }

          // END MK TRILOGY CLASSIC LAUNCH

          '''

              text = text.replace(
                  method_marker,
                  methods + method_marker,
                  1
              )

              delegate.write_text(text, encoding="utf-8")

          # 3) STABLE NATIVE FULLSCREEN + TOUCH
          # ------------------------------------------------------

          vc = Path("dospad/dospad/Main/DPEmulatorViewController.m")
          text = vc.read_text(encoding="utf-8")

          if '#import <QuartzCore/QuartzCore.h>' not in text:
              marker = '#import <UIKit/UIKit.h>'
              if marker not in text:
                  raise SystemExit("ERROR: UIKIT IMPORT NOT FOUND")
              text = text.replace(
                  marker,
                  marker + '\n#import <QuartzCore/QuartzCore.h>',
                  1
              )

          # Stable fullscreen patch.
          # v0.9.1 used a whole-method regex and failed before compilation.
          # Here we only insert a small block into the EXISTING native
          # updateScreen method, using two simple source markers.
          if "MKSTABLE_NATIVE_FULLSCREEN" not in text:
              method_start = text.find("-(void)updateScreen")

              if method_start < 0:
                  raise SystemExit("ERROR: updateScreen SIGNATURE NOT FOUND")

              toggle_start = text.find(
                  "- (void)toggleScreenSize",
                  method_start
              )

              view_marker = "CGRect viewRect = _rootContainer.bounds;"
              view_pos = text.find(
                  view_marker,
                  method_start
              )

              if (
                  toggle_start < 0
                  or view_pos < 0
                  or view_pos > toggle_start
              ):
                  raise SystemExit(
                      "ERROR: updateScreen BODY MARKER NOT FOUND"
                  )

              insert_pos = view_pos + len(view_marker)

              stable_insert = r'''

          // MKSTABLE_NATIVE_FULLSCREEN
          NSString *mkMode =
              [NSUserDefaults.standardUserDefaults
               stringForKey:@"MKRenderMode"];

          BOOL mkFullscreenReady =
              [NSUserDefaults.standardUserDefaults
               boolForKey:@"MKFullscreenReady"];

          if (
              mkMode.length > 0
              && mkFullscreenReady
              && !_currentScene.isPortrait
          )
          {
              // Only force fullscreen after the DOS/DOS4GW startup
              // has had time to switch into MK1's graphics mode.
              [self fillScreen:viewRect];
              return;
          }
          '''

              text = (
                  text[:insert_pos]
                  + stable_insert
                  + text[insert_pos:]
              )

          # IMPORTANT:
          # Do not patch scaleScreenViewToSize in this stable revision.
          # That removes another fragile regex and keeps native iDOS
          # screen geometry untouched. CLASSIC vs REMASTERED stays in
          # DOSBox configs: scaler=none vs scaler=hq2x.

          if "MKSTABLE_GAME_UI" not in text:
              marker = '// MARK: DPGamepadDelegate'
              if marker not in text:
                  raise SystemExit("ERROR: GAMEPAD MARKER NOT FOUND")

              methods = r'''

          // ======================================================
          // MKSTABLE_GAME_UI
          // ======================================================

          - (BOOL)mkStableIsOverlay:(UIView *)view
          {
              if ([view.accessibilityIdentifier isEqualToString:@"MK_STABLE_CONTROL"])
                  return YES;
              if (view.tag == 9912)
                  return YES;
              return NO;
          }

          - (void)mkStableHideIDOSChrome
          {
              if (!_rootContainer || !self.screenView)
                  return;

              self.view.backgroundColor = UIColor.blackColor;
              _rootContainer.backgroundColor = UIColor.blackColor;

              for (UIView *view in _rootContainer.subviews)
              {
                  if (view == self.screenView || [self mkStableIsOverlay:view])
                  {
                      view.hidden = NO;
                      continue;
                  }

                  view.hidden = YES;
                  view.userInteractionEnabled = NO;
              }

              UIView *modeLabel = [_rootContainer viewWithTag:9912];
              if (modeLabel)
                  [_rootContainer bringSubviewToFront:modeLabel];

              for (UIView *view in _rootContainer.subviews)
              {
                  if ([view.accessibilityIdentifier isEqualToString:@"MK_STABLE_CONTROL"])
                      [_rootContainer bringSubviewToFront:view];
              }
          }

          - (UIButton *)mkStableButton:(NSString *)title
                                 frame:(CGRect)frame
                                   key:(NSInteger)key
          {
              UIButton *b = [UIButton buttonWithType:UIButtonTypeSystem];
              b.frame = frame;
              b.tag = key;
              b.accessibilityIdentifier = @"MK_STABLE_CONTROL";

              [b setTitle:title forState:UIControlStateNormal];
              [b setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];

              b.titleLabel.font =
                  [UIFont systemFontOfSize:13 weight:UIFontWeightBlack];

              b.backgroundColor =
                  [UIColor colorWithWhite:0.0 alpha:0.30];

              b.layer.cornerRadius = 13;
              b.layer.borderWidth = 1;
              b.layer.borderColor =
                  [UIColor colorWithWhite:1 alpha:0.23].CGColor;

              [b addTarget:self
                    action:@selector(mkStableKeyDown:)
          forControlEvents:UIControlEventTouchDown];

              [b addTarget:self
                    action:@selector(mkStableKeyUp:)
          forControlEvents:UIControlEventTouchUpInside];

              [b addTarget:self
                    action:@selector(mkStableKeyUp:)
          forControlEvents:UIControlEventTouchUpOutside];

              [b addTarget:self
                    action:@selector(mkStableKeyUp:)
          forControlEvents:UIControlEventTouchCancel];

              return b;
          }

          - (void)mkStableKeyDown:(UIButton *)button
          {
              [[DOSPadEmulator sharedInstance]
               sendKey:(int)button.tag
               pressed:YES];
          }

          - (void)mkStableKeyUp:(UIButton *)button
          {
              [[DOSPadEmulator sharedInstance]
               sendKey:(int)button.tag
               pressed:NO];
          }

          - (void)mkStableRemoveControls
          {
              for (UIView *view in [_rootContainer.subviews copy])
              {
                  if ([view.accessibilityIdentifier isEqualToString:@"MK_STABLE_CONTROL"]
                      || view.tag == 9912)
                  {
                      [view removeFromSuperview];
                  }
              }
          }

          - (void)mkStableEnableFullscreen
          {
              [NSUserDefaults.standardUserDefaults
               setBool:YES
               forKey:@"MKFullscreenReady"];

              [NSUserDefaults.standardUserDefaults synchronize];

              // Re-run native iDOS layout after MK1 has entered graphics.
              [self updateScreen];
              [self mkStableHideIDOSChrome];
          }

          - (void)mkStableInstallControls
          {
              if (!_rootContainer)
                  return;

              [self mkStableRemoveControls];

              CGFloat w = CGRectGetWidth(_rootContainer.bounds);
              CGFloat h = CGRectGetHeight(_rootContainer.bounds);
              CGFloat d = 48;

              NSString *selectedGame =
                  [NSUserDefaults.standardUserDefaults
                   stringForKey:@"MKSelectedGame"]
                  ?: @"MK1";

              BOOL isMK2 =
                  [selectedGame isEqualToString:@"MK2"];

              BOOL isMK3 =
                  [selectedGame isEqualToString:@"MK3"];

              NSInteger keyUp    = isMK3 ? 82 : 22;
              NSInteger keyLeft  = isMK3 ? 80 : 29;
              NSInteger keyDown  = isMK3 ? 81 : 27;
              NSInteger keyRight = isMK3 ? 79 : 6;

              NSInteger keyHP  = isMK3 ? 92 : 24;
              NSInteger keyLP  = isMK3 ? 89 : 17;
              NSInteger keyBLK = isMK3 ? 90 : 13;
              NSInteger keyHK  = isMK3 ? 94 : 12;
              NSInteger keyLK  = isMK3 ? 91 : 16;

              // MK1 DOS: F1 = Player 1 Start
              // MK2 DOS: F1 = Player 1 Start
              // MK3 menus / fighter select: regular Enter
              NSInteger keyStart =
                  isMK3 ? 40 : 58;

              [_rootContainer addSubview:
               [self mkStableButton:@"▲" frame:CGRectMake(62, h - 150, d, d) key:keyUp]];

              [_rootContainer addSubview:
               [self mkStableButton:@"◀" frame:CGRectMake(12, h - 99, d, d) key:keyLeft]];

              [_rootContainer addSubview:
               [self mkStableButton:@"▼" frame:CGRectMake(62, h - 99, d, d) key:keyDown]];

              [_rootContainer addSubview:
               [self mkStableButton:@"▶" frame:CGRectMake(112, h - 99, d, d) key:keyRight]];

              CGFloat a = 46;
              CGFloat ax = w - 164;

              [_rootContainer addSubview:
               [self mkStableButton:@"HP" frame:CGRectMake(ax, h - 150, a, a) key:keyHP]];

              [_rootContainer addSubview:
               [self mkStableButton:@"HK" frame:CGRectMake(ax + 50, h - 150, a, a) key:keyHK]];

              [_rootContainer addSubview:
               [self mkStableButton:@"LP" frame:CGRectMake(ax, h - 99, a, a) key:keyLP]];

              [_rootContainer addSubview:
               [self mkStableButton:@"LK" frame:CGRectMake(ax + 50, h - 99, a, a) key:keyLK]];

              [_rootContainer addSubview:
               [self mkStableButton:@"BLK" frame:CGRectMake(ax + 100, h - 125, a, a) key:keyBLK]];

              if (isMK3)
              {
                  [_rootContainer addSubview:
                   [self mkStableButton:@"RUN" frame:CGRectMake(ax + 100, h - 177, a, a) key:93]];
              }

              [_rootContainer addSubview:
               [self mkStableButton:@"START" frame:CGRectMake(w / 2.0 - 36, h - 40, 72, 32) key:keyStart]];

              [_rootContainer addSubview:
               [self mkStableButton:(isMK3 ? @"MENU" : @"ESC")
                              frame:CGRectMake(8, 8, 58, 30)
                                key:41]];

              if (isMK2)
              {
                  [_rootContainer addSubview:
                   [self mkStableButton:@"SETUP"
                                  frame:CGRectMake(72, 8, 64, 30)
                                    key:67]];
              }

              UILabel *mode = [[UILabel alloc] init];
              mode.tag = 9912;
              mode.text =
                  [NSUserDefaults.standardUserDefaults stringForKey:@"MKRenderMode"]
                  ?: @"CLASSIC";
              mode.textAlignment = NSTextAlignmentCenter;
              mode.textColor = UIColor.whiteColor;
              mode.font = [UIFont systemFontOfSize:10 weight:UIFontWeightBlack];
              mode.backgroundColor = [UIColor colorWithWhite:0 alpha:0.30];
              mode.layer.cornerRadius = 9;
              mode.clipsToBounds = YES;
              mode.userInteractionEnabled = NO;
              mode.frame = CGRectMake(w / 2.0 - 64, 8, 128, 28);
              [_rootContainer addSubview:mode];

              // Keep native DOS layout during the text/DOS4GW startup.
              // Then enable MK fullscreen once, after the game has had time
              // to enter its VGA graphics mode.
              [self mkStableHideIDOSChrome];

              [NSObject
               cancelPreviousPerformRequestsWithTarget:self
               selector:@selector(mkStableEnableFullscreen)
               object:nil];

              [self
               performSelector:@selector(mkStableEnableFullscreen)
               withObject:nil
               afterDelay:10.0];
          }

          // END MKSTABLE_GAME_UI
              '''

              text = text.replace(marker, methods + marker, 1)

              layout_pattern = re.compile(
                  r'(_rootContainer\s*=\s*'
                  r'\[self createSceneView:_currentScene '
                  r'frame:viewRect\];\s*'
                  r'\[self\.view addSubview:_rootContainer\];\s*'
                  r'\[self updateScreen\];)'
              )

              replacement = (
                  r'\1'
                  '\n\t[self mkStableInstallControls];'
              )

              text, count = layout_pattern.subn(
                  replacement,
                  text,
                  count=1
              )

              if count != 1:
                  raise SystemExit("ERROR: VIEW LAYOUT PATCH FAILED")

          vc.write_text(text, encoding="utf-8")

          print("ALL STABLE PATCHES APPLIED")
          PY

      - name: Apply branding and landscape
        run: |
          set -e

          PLIST="dospad/Resources/iDOS-Info.plist"
          if [ ! -f "$PLIST" ]; then
            PLIST=$(find dospad -type f -name "*Info.plist" | head -1)
          fi

          test -n "$PLIST"

          plutil -replace CFBundleDisplayName -string "MK Trilogy" "$PLIST" || true
          plutil -replace CFBundleName -string "MK Trilogy" "$PLIST" || true

          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~iphone" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~iphone array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~iphone:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~iphone:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" || true

      - name: Generate dark Scorpion app icon
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/rwfpl/rewolf-mortal-kombat-viewer.git \
            icon-tools

          python3 <<'PY'
          from pathlib import Path
          import glob
          import json
          import os
          import sys
          from PIL import Image, ImageDraw

          sys.path.insert(0, str(Path("icon-tools").resolve()))

          import mkexec
          import grafile

          mk = mkexec.MkExec("game/MK1/MK1.EXE")
          gra = grafile.GraFile(mk, "game/MK1/GRAPHICS/NINJA.GRA")
          sprites = list(gra.sprites.values())

          candidates = [
              s for s in sprites
              if s.width >= 20 and s.height >= 40 and s.height > s.width * 0.9
          ]

          if not candidates:
              candidates = sprites

          if not candidates:
              raise SystemExit("ERROR: NO NINJA SPRITE FOR ICON")

          sprite = max(candidates, key=lambda s: s.width * s.height)

          mask = Image.new("L", (sprite.width, sprite.height), 0)
          px = mask.load()

          for y in range(sprite.height):
              for x in range(sprite.width):
                  if sprite.data[y * sprite.width + x] != 0:
                      px[x, y] = 255

          bbox = mask.getbbox()
          if bbox:
              mask = mask.crop(bbox)

          icon_sets = glob.glob("dospad/**/*.appiconset", recursive=True)
          if not icon_sets:
              raise SystemExit("ERROR: APPICON SET NOT FOUND")

          icon_dir = icon_sets[0]

          for old in glob.glob(os.path.join(icon_dir, "*.png")):
              os.remove(old)

          entries = [
              ("iphone", "20x20", "2x", 40, "Scorpion40.png"),
              ("iphone", "20x20", "3x", 60, "Scorpion60.png"),
              ("iphone", "29x29", "2x", 58, "Scorpion58.png"),
              ("iphone", "29x29", "3x", 87, "Scorpion87.png"),
              ("iphone", "40x40", "2x", 80, "Scorpion80.png"),
              ("iphone", "40x40", "3x", 120, "Scorpion120a.png"),
              ("iphone", "60x60", "2x", 120, "Scorpion120b.png"),
              ("iphone", "60x60", "3x", 180, "Scorpion180.png"),
              ("ios-marketing", "1024x1024", "1x", 1024, "Scorpion1024.png"),
          ]

          def make_icon(size, output):
              img = Image.new("RGB", (size, size), (4, 4, 6))
              draw = ImageDraw.Draw(img)

              for y in range(size):
                  t = y / max(size - 1, 1)
                  draw.line(
                      (0, y, size, y),
                      fill=(
                          int(18 * (1 - t) + 3 * t),
                          int(13 * (1 - t) + 3 * t),
                          int(16 * (1 - t) + 5 * t)
                      )
                  )

              m = int(size * 0.10)
              draw.ellipse(
                  (m, m, size - m, size - m),
                  fill=(16, 11, 4),
                  outline=(105, 70, 8),
                  width=max(1, int(size * 0.01))
              )

              scale = min(
                  (size * 0.54) / max(mask.width, 1),
                  (size * 0.72) / max(mask.height, 1)
              )

              new_size = (
                  max(1, int(mask.width * scale)),
                  max(1, int(mask.height * scale))
              )

              fig_mask = mask.resize(new_size, Image.Resampling.NEAREST)
              fig = Image.new("RGBA", new_size, (238, 176, 27, 255))
              rgba = img.convert("RGBA")
              rgba.paste(
                  fig,
                  ((size - new_size[0]) // 2, int(size * 0.15)),
                  fig_mask
              )

              fade = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              fd = ImageDraw.Draw(fade)
              fd.rectangle(
                  (0, int(size * 0.72), size, size),
                  fill=(0, 0, 0, 95)
              )
              rgba.alpha_composite(fade)

              rgba.convert("RGB").save(output, "PNG")

          images = []

          for idiom, psize, scale, pixels, filename in entries:
              out = os.path.join(icon_dir, filename)
              make_icon(pixels, out)
              images.append({
                  "idiom": idiom,
                  "size": psize,
                  "scale": scale,
                  "filename": filename
              })

          with open(
              os.path.join(icon_dir, "Contents.json"),
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {
                      "images": images,
                      "info": {"author": "xcode", "version": 1}
                  },
                  f,
                  indent=2
              )

          print("SCORPION DARK ICON READY")
          PY

      - name: Verify Trilogy Classic patches
        run: |
          set -e

          echo "===== VERIFY ORIGINAL GAMES ====="
          test -f game/MK1/MK1.EXE
          test -f game/MK2/MK2.EXE
          test -f game/MK3/MK3.EXE

          echo "===== VERIFY AUTOBOOT ====="
          grep -n "MKFINAL_AUTOBOOT" dospad/dospad/Main/DOSPadEmulator.m

          echo "===== VERIFY TRILOGY MENU ====="
          grep -n "MKTRILOGY_MENU" dospad/dospad/Main/DPAppDelegate.m
          grep -n "mkTrilogyLaunchGame" dospad/dospad/Main/DPAppDelegate.m
          grep -n "MKSelectedGame" dospad/dospad/Main/DPAppDelegate.m

          echo "===== VERIFY CLASSIC CONFIGS ====="
          grep -n "^scaler=none$" game/MK1/CLASSIC.CFG
          grep -n "^scaler=none$" game/MK2/CLASSIC.CFG
          grep -n "^scaler=none$" game/MK3/CLASSIC.CFG

          echo "===== VERIFY KEYBOARD-ONLY INPUT ====="
          grep -n "^joysticktype=none$" game/MK1/CLASSIC.CFG
          grep -n "^joysticktype=none$" game/MK2/CLASSIC.CFG
          grep -n "^joysticktype=none$" game/MK3/CLASSIC.CFG

          echo "===== VERIFY MK2/MK3 KEYMAP ====="
          grep -n "BOOL isMK2" dospad/dospad/Main/DPEmulatorViewController.m
          grep -n "BOOL isMK3" dospad/dospad/Main/DPEmulatorViewController.m
          grep -n "isMK3 ? 40 : 58" dospad/dospad/Main/DPEmulatorViewController.m
          grep -n 'mkStableButton:@"RUN"' dospad/dospad/Main/DPEmulatorViewController.m
          grep -n 'mkStableButton:@"SETUP"' dospad/dospad/Main/DPEmulatorViewController.m

          echo "===== VERIFY MK2 CMOS RESET ====="
          if find game/MK2 -type f \( -iname "CMOS" -o -iname "CMOS.*" \) | grep .; then
            echo "ERROR: MK2 CMOS STILL PRESENT"
            exit 1
          fi
          echo "MK2 CMOS RESET OK"

          echo "===== VERIFY MK3 RESTART LOOP ====="
          test -f game/MK3/RUNMK3.BAT
          grep -n ":MK3LOOP" game/MK3/RUNMK3.BAT
          grep -n "GOTO MK3LOOP" game/MK3/RUNMK3.BAT
          grep -n "RUNMK3.BAT" game/MK3/MKAUTO.TXT

          echo "===== VERIFY MK3 CD ====="
          test -s game/MK3/MK3-CD-MOUNT.TXT
          grep -n "^IMGMOUNT D " game/MK3/MK3-CD-MOUNT.TXT
          grep -n "^IMGMOUNT D " game/MK3/MKAUTO.TXT
          find game/MK3/CDIMAGE -maxdepth 1 -type f | grep .

          echo "===== VERIFY STABLE SCREEN / TOUCH ====="
          grep -n "MKSTABLE_NATIVE_FULLSCREEN" dospad/dospad/Main/DPEmulatorViewController.m
          grep -n "MKSTABLE_GAME_UI" dospad/dospad/Main/DPEmulatorViewController.m
          grep -n "mkStableEnableFullscreen" dospad/dospad/Main/DPEmulatorViewController.m

          echo "TRILOGY CLASSIC PATCHES OK"

      - name: Build MK Trilogy Classic engine
        run: |
          set +e
          set -o pipefail

          xattr -cr dospad || true

          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -scheme iDOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.mktrilogy.classic.v01" \
            build \
            2>&1 | tee output/xcodebuild.log

          STATUS=${PIPESTATUS[0]}

          echo "===== COMPILER ERRORS ====="
          grep -n -E "error:|fatal error:" output/xcodebuild.log | tail -160 || true

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      - name: Locate built app
        run: |
          set -e

          APP=$(
            find build/Build/Products \
              -type d \
              -name "iDOS.app" \
              | head -1
          )

          if [ -z "$APP" ]; then
            APP=$(
              find build/Build/Products \
                -type d \
                -name "*.app" \
                | head -1
            )
          fi

          if [ -z "$APP" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi

          echo "$APP" > output/app-path.txt
          echo "APP=$APP"

      - name: Put complete MK Trilogy inside app
        run: |
          set -e

          APP=$(cat output/app-path.txt)

          rm -rf "$APP/MKGame"
          rm -rf "$APP/MKGames"

          mkdir -p "$APP/MKGames/MK1"
          mkdir -p "$APP/MKGames/MK2"
          mkdir -p "$APP/MKGames/MK3"

          cp -R game/MK1/. "$APP/MKGames/MK1/"
          cp -R game/MK2/. "$APP/MKGames/MK2/"
          cp -R game/MK3/. "$APP/MKGames/MK3/"

          rm -rf "$APP/PlugIns"

          test -f "$APP/MKGames/MK1/MK1.EXE"
          test -f "$APP/MKGames/MK2/MK2.EXE"
          test -f "$APP/MKGames/MK3/MK3.EXE"

          test -f "$APP/MKGames/MK1/MKAUTO.TXT"
          test -f "$APP/MKGames/MK2/MKAUTO.TXT"
          test -f "$APP/MKGames/MK3/MKAUTO.TXT"

          echo "MK1 FILES=$(find "$APP/MKGames/MK1" -type f | wc -l | tr -d ' ')"
          echo "MK2 FILES=$(find "$APP/MKGames/MK2" -type f | wc -l | tr -d ' ')"
          echo "MK3 FILES=$(find "$APP/MKGames/MK3" -type f | wc -l | tr -d ' ')"

          du -sh "$APP"

      - name: Create build info
        run: |
          set -e

          APP=$(cat output/app-path.txt)

          {
            echo "============================================"
            echo "MORTAL KOMBAT CLASSIC TRILOGY v0.4"
            echo "============================================"
            echo
            echo "MK1: ORIGINAL MK1.EXE"
            echo "MK2: ORIGINAL MK2.EXE"
            echo "MK3: ORIGINAL MK3.EXE"
            echo
            echo "MODE: CLASSIC ONLY"
            echo "SCALER: none"
            echo "CPU/TIMING: STOCK IDOS SETTINGS"
            echo "CLEAN IDOS GAME VIEW: YES"
            echo "TOUCH OVERLAY: YES"
            echo "LANDSCAPE: YES"
            echo "SCORPION DARK ICON: YES"
            echo
            echo "NOTE: first Trilogy build reuses the working"
            echo "MK1 touch scancodes for all three games."
            echo "MK2/MK3 controls need on-device verification."
            echo
            echo "MK1 FILES=$(find "$APP/MKGames/MK1" -type f | wc -l | tr -d ' ')"
            echo "MK2 FILES=$(find "$APP/MKGames/MK2" -type f | wc -l | tr -d ' ')"
            echo "MK3 FILES=$(find "$APP/MKGames/MK3" -type f | wc -l | tr -d ' ')"
          } > output/BUILD-INFO.txt

          cat output/BUILD-INFO.txt

      - name: Create KSign IPA
        run: |
          set -e

          APP=$(cat output/app-path.txt)

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            output/MK-Trilogy-Classic-v0.4-KSign.ipa

          ls -lh output/MK-Trilogy-Classic-v0.4-KSign.ipa

      - name: Upload MK Trilogy Classic v0.4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MK-Trilogy-Classic-v0.4-KSign
          path: |
            output/MK-Trilogy-Classic-v0.4-KSign.ipa
            output/BUILD-INFO.txt
          compression-level: 0

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MK-Trilogy-Classic-v0.4-FAIL
          path: |
            output/xcodebuild.log
            output/app-path.txt
            output/BUILD-INFO.txt
          if-no-files-found: ignore
