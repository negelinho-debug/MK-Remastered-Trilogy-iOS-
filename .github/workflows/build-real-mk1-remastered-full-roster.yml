      - name: Generate Xcode project
        run: |
          set -e
          cd MK1Remastered
          xcodegen generate

      - name: Build app
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project MK1Remastered/MK1Remastered.xcodeproj \
            -scheme MK1Remastered \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee output/xcodebuild.log
          STATUS=${PIPESTATUS[0]}
          echo "===== COMPILER ERRORS ====="
          grep -n -E "error:|fatal error:" output/xcodebuild.log | tail -150 || true
          echo "BUILD STATUS=$STATUS"
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      - name: Locate app
        run: |
          set -e
          APP=$(find build/Build/Products -type d -name "MK1Remastered.app" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi
          echo "$APP" > output/app-path.txt
          echo "APP=$APP"

      - name: Create build report
        run: |
          set -e
          {
            echo "MK1 REMASTERED FULL ROSTER"
            echo "=========================="
            echo "Johnny Cage: REAL GRA"
            echo "Kano: REAL GRA"
            echo "Liu Kang: REAL GRA"
            echo "Raiden: REAL GRA"
            echo "Scorpion: REAL GRA"
            echo "Sub-Zero: REAL GRA"
            echo "Sonya Blade: REAL GRA"
            echo "Reptile: REAL GRA / ninja fallback"
            echo
            echo "NO CUBE FIGHTERS"
            echo "NO DOSBOX"
            echo "NATIVE SPRITEKIT REMASTER PROTOTYPE"
            echo
            cat output/ASSET-MANIFEST.json
          } > output/BUILD-INFO.txt
          cat output/BUILD-INFO.txt

      - name: Create IPA for KSign
        run: |
          set -e
          APP=$(cat output/app-path.txt)
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload output/MK1-Remastered-FULL-ROSTER.ipa
          ls -lh output/MK1-Remastered-FULL-ROSTER.ipa

      - name: Upload successful build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MK1-Remastered-FULL-ROSTER
          path: |
            output/MK1-Remastered-FULL-ROSTER.ipa
            output/BUILD-INFO.txt
            output/ASSET-MANIFEST.json
          compression-level: 0

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MK1-Remastered-FULL-ROSTER-FAIL
          path: |
            output/xcodebuild.log
            output/ASSET-MANIFEST.json
            output/app-path.txt
          if-no-files-found: ignore
