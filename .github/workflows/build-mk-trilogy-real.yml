                   systemFontOfSize:15
                   weight:UIFontWeightBlack];

              button.backgroundColor =
                  [UIColor
                   colorWithWhite:0
                   alpha:0.48];

              button.layer.cornerRadius = 15;

              button.layer.borderWidth = 1.4;

              button.layer.borderColor =
                  [UIColor
                   colorWithWhite:1
                   alpha:0.32].CGColor;


              [button
               addTarget:self
               action:@selector(mkKeyDown:)
               forControlEvents:
               UIControlEventTouchDown];


              [button
               addTarget:self
               action:@selector(mkKeyUp:)
               forControlEvents:
               UIControlEventTouchUpInside];


              [button
               addTarget:self
               action:@selector(mkKeyUp:)
               forControlEvents:
               UIControlEventTouchUpOutside];


              [button
               addTarget:self
               action:@selector(mkKeyUp:)
               forControlEvents:
               UIControlEventTouchCancel];


              return button;
          }


          - (void)mkKeyDown:
              (UIButton *)button
          {
              [[DOSPadEmulator
                sharedInstance]
               sendKey:
               (int)button.tag
               pressed:YES];
          }


          - (void)mkKeyUp:
