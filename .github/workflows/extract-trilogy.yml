name: Extract MK1 + MK2 + MK3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y innoextract p7zip-full zip
          mkdir -p pool extracted artifacts release-assets

      # ==========================================================
      # FIND EVERY EXE IN REPOSITORY
      # ==========================================================

      - name: Find EXE files in repository
        run: |
          echo "===== EXE FILES IN REPOSITORY ====="

          find . \
            -type f \
            -iname "*.exe" \
            -not -path "./.git/*" \
            -print

          find . \
            -type f \
            -iname "*.exe" \
            -not -path "./.git/*" \
            -exec cp {} pool/ \;

      # ==========================================================
      # DOWNLOAD BIG EXE FROM RELEASE
      # ==========================================================

      - name: Download EXE from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "===== RELEASES ====="

          gh release list || true

          TAG=$(gh release list \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName' || true)

          if [ -n "$TAG" ]; then

            echo "Using release: $TAG"

            gh release download "$TAG" \
              --dir release-assets \
              --pattern "*.exe" || true

          fi

          echo "===== RELEASE EXE ====="

          find release-assets \
            -type f \
            -iname "*.exe" \
            -print || true

          find release-assets \
            -type f \
            -iname "*.exe" \
            -exec cp {} pool/ \; || true

      # ==========================================================
      # SHOW EVERYTHING FOUND
      # ==========================================================

      - name: Show installer pool
        run: |
          echo "===== INSTALLER POOL ====="

          find pool \
            -maxdepth 1 \
            -type f \
            -iname "*.exe" \
            -print \
            | sort

          COUNT=$(find pool \
            -maxdepth 1 \
            -type f \
            -iname "*.exe" \
            | wc -l)

          echo "EXE count: $COUNT"

          if [ "$COUNT" -lt 3 ]; then
            echo "ERROR: Need 3 installers but found $COUNT"
            exit 1
          fi

      # ==========================================================
      # ASSIGN MK1 / MK2 / MK3
      #
      # GOG names normally sort like:
      # setup_mortal_kombat_2.0.0.2.exe
      # setup_mortal_kombat_2_2.0.0.2.exe
      # setup_mortal_kombat_3_2.0.0.2.exe
      # ==========================================================

      - name: Assign installers
        run: |
          mapfile -t FILES < <(
            find pool \
              -maxdepth 1 \
              -type f \
              -iname "*.exe" \
              | sort
          )

          MK1="${FILES[0]}"
          MK2="${FILES[1]}"
          MK3="${FILES[2]}"

          echo "============================"
          echo "MK1 = $MK1"
          echo "MK2 = $MK2"
          echo "MK3 = $MK3"
          echo "============================"

          cp "$MK1" mk1.exe
          cp "$MK2" mk2.exe
          cp "$MK3" mk3.exe

          ls -lh mk1.exe mk2.exe mk3.exe

      # ==========================================================
      # EXTRACT MK1
      # ==========================================================

      - name: Extract Mortal Kombat 1
        run: |
          mkdir -p extracted/mk1

          innoextract \
            --extract \
            --output-dir extracted/mk1 \
            mk1.exe \
          || \
          7z x \
            mk1.exe \
            -oextracted/mk1 \
            -y

      # ==========================================================
      # EXTRACT MK2
      # ==========================================================

      - name: Extract Mortal Kombat 2
        run: |
          mkdir -p extracted/mk2

          innoextract \
            --extract \
            --output-dir extracted/mk2 \
            mk2.exe \
          || \
          7z x \
            mk2.exe \
            -oextracted/mk2 \
            -y

      # ==========================================================
      # EXTRACT MK3
      # ==========================================================

      - name: Extract Mortal Kombat 3
        run: |
          mkdir -p extracted/mk3

          innoextract \
            --extract \
            --output-dir extracted/mk3 \
            mk3.exe \
          || \
          7z x \
            mk3.exe \
            -oextracted/mk3 \
            -y

      # ==========================================================
      # FILE LIST
      # ==========================================================

      - name: Create file list
        run: |
          echo "===== MK1 =====" > artifacts/file-list.txt
          find extracted/mk1 -type f >> artifacts/file-list.txt

          echo "" >> artifacts/file-list.txt
          echo "===== MK2 =====" >> artifacts/file-list.txt
          find extracted/mk2 -type f >> artifacts/file-list.txt

          echo "" >> artifacts/file-list.txt
          echo "===== MK3 =====" >> artifacts/file-list.txt
          find extracted/mk3 -type f >> artifacts/file-list.txt

          echo "===== TOTAL ====="
          find extracted -type f | wc -l

      # ==========================================================
      # ZIP
      # ==========================================================

      - name: Create extracted ZIPs
        run: |
          cd extracted

          zip -r \
            ../artifacts/MK1_EXTRACTED.zip \
            mk1

          zip -r \
            ../artifacts/MK2_EXTRACTED.zip \
            mk2

          zip -r \
            ../artifacts/MK3_EXTRACTED.zip \
            mk3

          cd ..

          echo "===== RESULT ====="
          ls -lh artifacts

      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: Upload trilogy
        uses: actions/upload-artifact@v4
        with:
          name: MK-Remastered-Trilogy-Extracted
          path: artifacts/
          compression-level: 0
