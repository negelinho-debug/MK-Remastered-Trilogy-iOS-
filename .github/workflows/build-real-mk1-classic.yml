name: Build MK1 ORIGINAL Remastered CLEAN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e
          brew install innoextract p7zip
          python3 -m pip install --break-system-packages pillow || python3 -m pip install --user pillow
          xcodebuild -version

      - name: Prepare folders
        run: |
          set -e
          rm -rf raw-installers installers release-files extracted game dospad build Payload output
          mkdir -p raw-installers installers release-files extracted game output

      - name: Collect installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          INDEX=0
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            INDEX=$((INDEX + 1))
            cp "$FILE" "raw-installers/repo_${INDEX}.exe"
          done < <(
            find . -type f -iname "*.exe" \
              -not -path "./.git/*" \
              -not -path "./raw-installers/*" \
              -not -path "./installers/*" \
              -not -path "./release-files/*" \
              -not -path "./extracted/*" \
              -not -path "./game/*" \
              -not -path "./dospad/*" \
              -not -path "./build/*" \
              | sort
          )

          set +e
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --dir release-files --pattern "*.exe"
          fi
          set -e

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            INDEX=$((INDEX + 1))
            cp "$FILE" "raw-installers/release_${INDEX}.exe"
          done < <(find release-files -type f -iname "*.exe" | sort)

          echo "===== RAW INSTALLERS ====="
          ls -lh raw-installers || true

      - name: Deduplicate installers
        run: |
          set -e
          FOUND=0

          for FILE in raw-installers/*.exe; do
            [ -f "$FILE" ] || continue
            FOUND=1
            HASH=$(shasum -a 256 "$FILE" | awk '{print $1}')
            [ -f "installers/${HASH}.exe" ] || cp "$FILE" "installers/${HASH}.exe"
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: NO INSTALLERS FOUND"
            exit 1
          fi

      - name: Extract installers
        run: |
          set -e
          INDEX=0

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            INDEX=$((INDEX + 1))
            DEST="extracted/pkg${INDEX}"
            mkdir -p "$DEST"

            set +e
            innoextract --extract --output-dir "$DEST" "$FILE"
            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              7z x "$FILE" "-o$DEST" -y
            fi
            set -e
          done < <(find installers -type f -iname "*.exe" | sort)

          echo "===== MK1.EXE ====="
          find extracted -type f -iname "MK1.EXE" -print || true

      - name: Normalize real MK1
        run: |
          set -e

          MK1_EXE=$(find extracted -type f -iname "MK1.EXE" -not -path "*/__support/*" | head -1)

          if [ -z "$MK1_EXE" ]; then
            echo "ERROR: REAL MK1.EXE NOT FOUND"
            exit 1
          fi

          MK1_DIR="$(dirname "$MK1_EXE")"
          mkdir -p game/MK1
          cp -R "$MK1_DIR"/. game/MK1/

          test -f game/MK1/MK1.EXE
          echo "MK1 FILES=$(find game/MK1 -type f | wc -l | tr -d ' ')"

      - name: Clone iDOS
        run: |
          set -e
          git clone --depth 1 https://github.com/litchie/dospad.git dospad
          xcodebuild -project dospad/dospad.xcodeproj -list

      - name: Create Classic and Remastered configs
        run: |
          set -e

          BASE="dospad/Resources/configs/dospad.cfg"
          test -f "$BASE"

          cp "$BASE" game/MK1/CLASSIC.CFG
          cp "$BASE" game/MK1/REMASTER.CFG

          python3 <<'PY'
          from pathlib import Path
          import re

          def set_option(text, section, key, value):
              pattern = rf"(?m)^{re.escape(key)}\s*=.*$"

              if re.search(pattern, text):
                  return re.sub(
                      pattern,
                      f"{key}={value}",
                      text
                  )

              marker = f"[{section}]"

              if marker in text:
                  return text.replace(
                      marker,
                      marker + f"\n{key}={value}",
                      1
                  )

              return text + f"\n[{section}]\n{key}={value}\n"

          configs = {
              "game/MK1/CLASSIC.CFG": {
                  ("render", "frameskip"): "0",
                  ("render", "aspect"): "true",
                  ("render", "scaler"): "normal2x",
                  ("cpu", "core"): "dynamic",
                  ("cpu", "cycles"): "max 95%",
              },

              "game/MK1/REMASTER.CFG": {
                  ("render", "frameskip"): "0",
                  ("render", "aspect"): "true",
                  ("render", "scaler"): "hq2x",
                  ("cpu", "core"): "dynamic",
                  ("cpu", "cycles"): "max 95%",
              },
          }

          for filename, options in configs.items():
              path = Path(filename)
              text = path.read_text(errors="ignore")

              for (section, key), value in options.items():
                  text = set_option(
                      text,
                      section,
                      key,
                      value
                  )

              path.write_text(text)

          print("CONFIGS READY")
          PY

          cp game/MK1/CLASSIC.CFG game/MK1/dospad.cfg

      - name: Create MK1 autoboot
        run: |
          set -e

          cat > game/MK1/MKAUTO.TXT <<'EOF'
          C:
          CD \
          MK1.EXE
          EOF

          echo "===== AUTOBOOT ====="
          cat game/MK1/MKAUTO.TXT

      - name: Patch iDOS for MK1
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          # ======================================================
          # DOSPadEmulator.m — AUTOBOOT
          # ======================================================

          emulator = Path(
              "dospad/dospad/Main/DOSPadEmulator.m"
          )

          text = emulator.read_text(
              encoding="utf-8"
          )

          marker = (
              '[self.commandList '
              'addObject:@"REM END AUTOMOUNT"];'
          )

          if marker not in text:
              raise SystemExit(
                  "ERROR: AUTOBOOT MARKER NOT FOUND"
              )

          patch = marker + r'''

              // ==================================================
              // MK1_REAL_AUTOBOOT
              // ==================================================

              NSString *mkBootPath =
                  [self.workingDirectory.path
                   stringByAppendingPathComponent:
                   @"MKAUTO.TXT"];

              if ([[NSFileManager defaultManager]
                   fileExistsAtPath:mkBootPath])
              {
                  NSError *mkError = nil;

                  NSString *mkText =
                      [NSString
                       stringWithContentsOfFile:
                       mkBootPath
                       encoding:
                       NSUTF8StringEncoding
                       error:
                       &mkError];

                  if (mkText.length > 0)
                  {
                      NSArray *mkLines =
                          [mkText
                           componentsSeparatedByCharactersInSet:
                           [NSCharacterSet
                            newlineCharacterSet]];

                      for (NSString *mkRaw in mkLines)
                      {
                          NSString *mkLine =
                              [mkRaw
                               stringByTrimmingCharactersInSet:
                               [NSCharacterSet
                                whitespaceAndNewlineCharacterSet]];

                          if (mkLine.length > 0)
                          {
                              [self.commandList
                               addObject:mkLine];
                          }
                      }
                  }
              }

              // ===== END MK1_REAL_AUTOBOOT =====
          '''

          if "MK1_REAL_AUTOBOOT" not in text:
              text = text.replace(
                  marker,
                  patch,
                  1
              )

              emulator.write_text(
                  text,
                  encoding="utf-8"
              )

          # ======================================================
          # DPAppDelegate.m
          # CLASSIC / REMASTERED
          # ======================================================

          delegate = Path(
              "dospad/dospad/Main/DPAppDelegate.m"
          )

          text = delegate.read_text(
              encoding="utf-8"
          )

          if "MK1_ORIGINAL_LAUNCHER" not in text:

              old_start = (
                  '[self performSelector:'
                  '@selector(startDOS) '
                  'withObject:nil '
                  'afterDelay:1];'
              )

              new_start = (
                  '[self performSelector:'
                  '@selector(mkShowOriginalLauncher) '
                  'withObject:nil '
                  'afterDelay:0.25];'
              )

              if old_start not in text:
                  raise SystemExit(
                      "ERROR: STARTDOS MARKER NOT FOUND"
                  )

              text = text.replace(
                  old_start,
                  new_start,
                  1
              )

              method_marker = (
                  '-(void)setWindowTitle:(char *)title'
              )

              if method_marker not in text:
                  raise SystemExit(
                      "ERROR: APP DELEGATE METHOD MARKER NOT FOUND"
                  )

              methods = r'''

          // ======================================================
          // MK1_ORIGINAL_LAUNCHER
          // ======================================================

          - (void)mkShowOriginalLauncher
          {
              UIAlertController *alert =
                  [UIAlertController
                   alertControllerWithTitle:
                   @"MORTAL KOMBAT"
                   message:
                   @"Choose display mode"
                   preferredStyle:
                   UIAlertControllerStyleAlert];


              [alert
               addAction:
               [UIAlertAction
                actionWithTitle:
                @"CLASSIC"
                style:
                UIAlertActionStyleDefault
                handler:
                ^(UIAlertAction *action)
                {
                    [self
                     mkLaunchOriginalMode:
                     @"CLASSIC"];
                }]];


              [alert
               addAction:
               [UIAlertAction
                actionWithTitle:
                @"REMASTERED"
                style:
                UIAlertActionStyleDefault
                handler:
                ^(UIAlertAction *action)
                {
                    [self
                     mkLaunchOriginalMode:
                     @"REMASTERED"];
                }]];


              [self.emulatorController
               presentViewController:
               alert
               animated:
               YES
               completion:
               nil];
          }


          - (void)mkLaunchOriginalMode:
              (NSString *)mode
          {
              NSFileManager *fm =
                  [NSFileManager
                   defaultManager];


              NSString *bundleGame =
                  [[NSBundle.mainBundle
                    bundlePath]
                   stringByAppendingPathComponent:
                   @"MKGame"];


              NSString *documents =
                  [NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                   ) lastObject];


              NSString *destination =
                  [documents
                   stringByAppendingPathComponent:
                   @"MK1Original"];


              NSString *exe =
                  [destination
                   stringByAppendingPathComponent:
                   @"MK1.EXE"];


              if (![fm
                    fileExistsAtPath:
                    exe])
              {
                  [fm
                   removeItemAtPath:
                   destination
                   error:
                   nil];


                  NSError *copyError =
                      nil;


                  BOOL copied =
                      [fm
                       copyItemAtPath:
                       bundleGame
                       toPath:
                       destination
                       error:
                       &copyError];


                  if (!copied)
                  {
                      NSLog(
                          @"MK COPY ERROR: %@",
                          copyError
                      );

                      return;
                  }
              }


              NSString *configName =
                  [mode
                   isEqualToString:
                   @"REMASTERED"]
                  ? @"REMASTER.CFG"
                  : @"CLASSIC.CFG";


              NSString *sourceConfig =
                  [destination
                   stringByAppendingPathComponent:
                   configName];


              NSString *activeConfig =
                  [destination
                   stringByAppendingPathComponent:
                   @"dospad.cfg"];


              [fm
               removeItemAtPath:
               activeConfig
               error:
               nil];


              NSError *configError =
                  nil;


              [fm
               copyItemAtPath:
               sourceConfig
               toPath:
               activeConfig
               error:
               &configError];


              if (configError)
              {
                  NSLog(
                      @"MK CONFIG ERROR: %@",
                      configError
                  );
              }


              [NSUserDefaults.standardUserDefaults
               setObject:
               mode
               forKey:
               @"MKRenderMode"];


              [NSUserDefaults.standardUserDefaults
               synchronize];


              [DOSPadEmulator
               sharedInstance]
                  .workingDirectory =
                  [NSURL
                   fileURLWithPath:
                   destination
                   isDirectory:
                   YES];


              [self startDOS];
          }

          // ===== END MK1_ORIGINAL_LAUNCHER =====

          '''

              text = text.replace(
                  method_marker,
                  methods +
                  method_marker,
                  1
              )

              delegate.write_text(
                  text,
                  encoding="utf-8"
              )

          # ======================================================
          # DPEmulatorViewController.m
          #
          # УБИРАЕМ:
          # - огромную клавиатуру iDOS
          # - бежевый компьютер
          # - L / R
          # - стандартный gamepad
          # - tool panel
          #
          # ОСТАВЛЯЕМ:
          # - DOS screen
          # - наши MK controls
          # ======================================================

          vc = Path(
              "dospad/dospad/Main/"
              "DPEmulatorViewController.m"
          )

          text = vc.read_text(
              encoding="utf-8"
          )


          if (
              '#import <QuartzCore/QuartzCore.h>'
              not in text
          ):
              import_marker = (
                  '#import <UIKit/UIKit.h>'
              )

              if import_marker not in text:
                  raise SystemExit(
                      "ERROR: UIKIT IMPORT NOT FOUND"
                  )

              text = text.replace(
                  import_marker,
                  import_marker +
                  '\n#import <QuartzCore/QuartzCore.h>',
                  1
              )


          marker = (
              '// MARK: DPGamepadDelegate'
          )

          if marker not in text:
              raise SystemExit(
                  "ERROR: DPGamepadDelegate MARKER NOT FOUND"
              )


          methods = r'''

          // ======================================================
          // MK1_CLEAN_FULLSCREEN
          // ======================================================

          - (BOOL)mkViewContainsScreen:
              (UIView *)view
          {
              UIView *cursor =
                  self.screenView;

              while (cursor)
              {
                  if (cursor == view)
                  {
                      return YES;
                  }

                  cursor =
                      cursor.superview;
              }

              return NO;
          }


          - (BOOL)mkIsOurOverlay:
              (UIView *)view
          {
              if (
                  [view.accessibilityIdentifier
                   isEqualToString:
                   @"MK1_REAL_CONTROL"]
              )
              {
                  return YES;
              }


              if (view.tag == 8844)
              {
                  return YES;
              }


              return NO;
          }


          - (void)mkStripIDOSChromeFromView:
              (UIView *)root
          {
              NSArray *children =
                  [root.subviews copy];


              for (UIView *child in children)
              {
                  if (
                      [self
                       mkIsOurOverlay:
                       child]
                  )
                  {
                      child.hidden =
                          NO;

                      child.userInteractionEnabled =
                          YES;

                      continue;
                  }


                  if (
                      child ==
                      self.screenView
                  )
                  {
                      child.hidden =
                          NO;

                      continue;
                  }


                  if (
                      [self
                       mkViewContainsScreen:
                       child]
                  )
                  {
                      child.hidden =
                          NO;

                      child.userInteractionEnabled =
                          YES;

                      child.frame =
                          root.bounds;

                      child.autoresizingMask =
                          UIViewAutoresizingFlexibleWidth |
                          UIViewAutoresizingFlexibleHeight;


                      [self
                       mkStripIDOSChromeFromView:
                       child];

                      continue;
                  }


                  child.hidden =
                      YES;

                  child.userInteractionEnabled =
                      NO;
              }
          }


          - (void)mkForceGameOnlyLayout
          {
              [self.view
               endEditing:
               YES];


              if (
                  !_rootContainer ||
                  !self.screenView
              )
              {
                  return;
              }


              self.view.backgroundColor =
                  UIColor.blackColor;


              _rootContainer.backgroundColor =
                  UIColor.blackColor;


              _rootContainer.hidden =
                  NO;


              _rootContainer.frame =
                  self.view.bounds;


              _rootContainer.autoresizingMask =
                  UIViewAutoresizingFlexibleWidth |
                  UIViewAutoresizingFlexibleHeight;


              [self
               mkStripIDOSChromeFromView:
               self.view];


              UIView *screenParent =
                  self.screenView.superview;


              if (screenParent)
              {
                  screenParent.frame =
                      _rootContainer.bounds;


                  screenParent.autoresizingMask =
                      UIViewAutoresizingFlexibleWidth |
                      UIViewAutoresizingFlexibleHeight;
              }


              self.screenView.hidden =
                  NO;


              self.screenView.frame =
                  screenParent
                  ? screenParent.bounds
                  : _rootContainer.bounds;


              self.screenView.autoresizingMask =
                  UIViewAutoresizingFlexibleWidth |
                  UIViewAutoresizingFlexibleHeight;


              NSString *mode =
                  [NSUserDefaults.standardUserDefaults
                   stringForKey:
                   @"MKRenderMode"];


              BOOL remastered =
                  [mode
                   isEqualToString:
                   @"REMASTERED"];


              self.screenView.layer.magnificationFilter =
                  remastered
                  ? kCAFilterLinear
                  : kCAFilterNearest;


              self.screenView.layer.minificationFilter =
                  remastered
                  ? kCAFilterLinear
                  : kCAFilterNearest;


              self.screenView.layer.contentsScale =
                  UIScreen.mainScreen.scale;


              for (
                  UIView *view
                  in _rootContainer.subviews
              )
              {
                  if (
                      [self
                       mkIsOurOverlay:
                       view]
                  )
                  {
                      [_rootContainer
                       bringSubviewToFront:
                       view];
                  }
              }
          }


          - (UIButton *)mkRealButton:
              (NSString *)title
              frame:(CGRect)frame
              key:(NSInteger)key
          {
              UIButton *button =
                  [UIButton
                   buttonWithType:
                   UIButtonTypeSystem];


              button.frame =
                  frame;


              button.tag =
                  key;


              button.accessibilityIdentifier =
                  @"MK1_REAL_CONTROL";


              [button
               setTitle:
               title
               forState:
               UIControlStateNormal];


              [button
               setTitleColor:
               UIColor.whiteColor
               forState:
               UIControlStateNormal];


              button.titleLabel.font =
                  [UIFont
                   systemFontOfSize:
                   14
                   weight:
                   UIFontWeightBlack];


              button.backgroundColor =
                  [UIColor
                   colorWithWhite:
                   0.0
                   alpha:
                   0.36];


              button.layer.cornerRadius =
                  14;


              button.layer.borderWidth =
                  1;


              button.layer.borderColor =
                  [UIColor
                   colorWithWhite:
                   1.0
                   alpha:
                   0.25].CGColor;


              [button
               addTarget:
               self
               action:
               @selector(mkRealDown:)
               forControlEvents:
               UIControlEventTouchDown];


              [button
               addTarget:
               self
               action:
               @selector(mkRealUp:)
               forControlEvents:
               UIControlEventTouchUpInside];


              [button
               addTarget:
               self
               action:
               @selector(mkRealUp:)
               forControlEvents:
               UIControlEventTouchUpOutside];


              [button
               addTarget:
               self
               action:
               @selector(mkRealUp:)
               forControlEvents:
               UIControlEventTouchCancel];


              return button;
          }


          - (void)mkRealDown:
              (UIButton *)button
          {
              [[DOSPadEmulator
                sharedInstance]
               sendKey:
               (int)button.tag
               pressed:
               YES];
          }


          - (void)mkRealUp:
              (UIButton *)button
          {
              [[DOSPadEmulator
                sharedInstance]
               sendKey:
               (int)button.tag
               pressed:
               NO];
          }


          - (void)mkRemoveRealControls
          {
              for (
                  UIView *view
                  in [_rootContainer.subviews
                      copy]
              )
              {
                  if (
                      [view.accessibilityIdentifier
                       isEqualToString:
                       @"MK1_REAL_CONTROL"]
                      ||
                      view.tag == 8844
                  )
                  {
                      [view
                       removeFromSuperview];
                  }
              }
          }


          - (void)mkInstallRealControls
          {
              if (!_rootContainer)
              {
                  return;
              }


              [self
               mkRemoveRealControls];


              CGFloat width =
                  CGRectGetWidth(
                      _rootContainer.bounds
                  );


              CGFloat height =
                  CGRectGetHeight(
                      _rootContainer.bounds
                  );


              // MK1 DOS:
              //
              // S = UP
              // X = DOWN
              // Z = LEFT
              // C = RIGHT
              //
              // U = HP
              // N = LP
              // I = HK
              // M = LK
              // J = BLOCK
              // F1 = START


              CGFloat d =
                  54;


              [_rootContainer
               addSubview:
               [self
                mkRealButton:
                @"▲"
                frame:
                CGRectMake(
                    72,
                    height - 170,
                    d,
                    d
                )
                key:
                22]];


              [_rootContainer
               addSubview:
               [self
                mkRealButton:
                @"◀"
                frame:
                CGRectMake(
                    16,
                    height - 112,
                    d,
                    d
                )
                key:
                29]];


              [_rootContainer
               addSubview:
               [self
                mkRealButton:
                @"▼"
                frame:
                CGRectMake(
                    72,
                    height - 112,
                    d,
                    d
                )
                key:
                27]];


              [_rootContainer
               addSubview:
               [self
                mkRealButton:
                @"▶"
                frame:
                CGRectMake(
                    128,
                    height - 112,
                    d,
                    d
                )
                key:
                6]];


              CGFloat attack =
                  51;


              CGFloat ax =
                  width - 184;


              [_rootContainer
               addSubview:
               [self
                mkRealButton:
                @"HP"
                frame:
                CGRectMake(
                    ax,
                    height - 170,
                    attack,
                    attack
                )
                key:
                24]];


              [_rootContainer
               addSubview:
               [self
                mkRealButton:
                @"HK"
                frame:
                CGRectMake(
                    ax + 56,
                    height - 170,
                    attack,
                    attack
                )
                key:
                12]];


              [_rootContainer
               addSubview:
               [self
                mkRealButton:
                @"LP"
                frame:
                CGRectMake(
                    ax,
                    height - 112,
                    attack,
                    attack
                )
                key:
                17]];


              [_rootContainer
               addSubview:
               [self
                mkRealButton:
                @"LK"
                frame:
                CGRectMake(
                    ax + 56,
                    height - 112,
                    attack,
                    attack
                )
                key:
                16]];


              [_rootContainer
               addSubview:
               [self
                mkRealButton:
                @"BLK"
                frame:
                CGRectMake(
                    ax + 112,
                    height - 141,
                    attack,
                    attack
                )
                key:
                13]];


              [_rootContainer
               addSubview:
               [self
                mkRealButton:
                @"START"
                frame:
                CGRectMake(
                    width / 2 - 38,
                    height - 44,
                    76,
                    34
                )
                key:
                58]];


              [_rootContainer
               addSubview:
               [self
                mkRealButton:
                @"ESC"
                frame:
                CGRectMake(
                    10,
                    8,
                    52,
                    34
                )
                key:
                41]];


              UILabel *modeLabel =
                  [[UILabel alloc]
                   initWithFrame:
                   CGRectMake(
                       width / 2 - 65,
                       8,
                       130,
                       28
                   )];


              modeLabel.tag =
                  8844;


              modeLabel.text =
                  [NSUserDefaults.standardUserDefaults
                   stringForKey:
                   @"MKRenderMode"]
                  ?: @"CLASSIC";


              modeLabel.textAlignment =
                  NSTextAlignmentCenter;


              modeLabel.textColor =
                  UIColor.whiteColor;


              modeLabel.font =
                  [UIFont
                   systemFontOfSize:
                   11
                   weight:
                   UIFontWeightBlack];


              modeLabel.backgroundColor =
                  [UIColor
                   colorWithWhite:
                   0
                   alpha:
                   0.34];


              modeLabel.layer.cornerRadius =
                  10;


              modeLabel.clipsToBounds =
                  YES;


              modeLabel.userInteractionEnabled =
                  NO;


              [_rootContainer
               addSubview:
               modeLabel];


              [self
               mkForceGameOnlyLayout];


              [self
               performSelector:
               @selector(mkForceGameOnlyLayout)
               withObject:
               nil
               afterDelay:
               0.10];


              [self
               performSelector:
               @selector(mkForceGameOnlyLayout)
               withObject:
               nil
               afterDelay:
               0.50];
          }

          // ===== END MK1_CLEAN_FULLSCREEN =====

          '''


          if "MK1_CLEAN_FULLSCREEN" not in text:

              text = text.replace(
                  marker,
                  methods +
                  marker,
                  1
              )


              layout_pattern = re.compile(
                  r'(_rootContainer\s*=\s*'
                  r'\[self createSceneView:_currentScene '
                  r'frame:viewRect\];\s*'
                  r'\[self\.view addSubview:_rootContainer\];\s*'
                  r'\[self updateScreen\];)'
              )


              replacement = (
                  r'\1'
                  '\n\t[self mkInstallRealControls];'
                  '\n\t[self mkForceGameOnlyLayout];'
              )


              text, count = layout_pattern.subn(
                  replacement,
                  text,
                  count=1
              )


              if count != 1:
                  raise SystemExit(
                      "ERROR: VIEW LAYOUT PATCH FAILED"
                  )


              start_marker = (
                  '[[self findGamepad] '
                  'applyConfiguration:_gamepadConfig];'
              )


              if start_marker not in text:
                  raise SystemExit(
                      "ERROR: EMULATOR START MARKER NOT FOUND"
                  )


              start_replacement = (
                  start_marker +
                  '\n\t[self mkInstallRealControls];' +
                  '\n\t[self mkForceGameOnlyLayout];'
              )


              text = text.replace(
                  start_marker,
                  start_replacement,
                  1
              )


              vc.write_text(
                  text,
                  encoding="utf-8"
              )


          print(
              "ALL MK1 PATCHES APPLIED"
          )
          PY

      - name: Apply branding
        run: |
          set -e

          PLIST="dospad/Resources/iDOS-Info.plist"

          if [ ! -f "$PLIST" ]; then
            PLIST=$(find dospad -type f -name "*Info.plist" | head -1)
          fi

          test -n "$PLIST"

          plutil \
            -replace CFBundleDisplayName \
            -string "MK1 Remastered" \
            "$PLIST" || true

          plutil \
            -replace CFBundleName \
            -string "MK1 Remastered" \
            "$PLIST" || true

      - name: Verify patches
        run: |
          set -e

          grep -n \
            "MK1_REAL_AUTOBOOT" \
            dospad/dospad/Main/DOSPadEmulator.m

          grep -n \
            "MK1_ORIGINAL_LAUNCHER" \
            dospad/dospad/Main/DPAppDelegate.m

          grep -n \
            "MK1_CLEAN_FULLSCREEN" \
            dospad/dospad/Main/DPEmulatorViewController.m

          echo "PATCHES OK"

      - name: Build original MK1 engine
        run: |
          set +e
          set -o pipefail

          xattr -cr dospad || true

          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -scheme iDOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.mk1original.remastered.clean" \
            build \
            2>&1 | tee output/xcodebuild.log

          STATUS=${PIPESTATUS[0]}

          echo "===== COMPILER ERRORS ====="

          grep -n \
            -E "error:|fatal error:" \
            output/xcodebuild.log \
            | tail -150 || true

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      - name: Locate built app
        run: |
          set -e

          APP=$(
            find build/Build/Products \
              -type d \
              -name "iDOS.app" \
              | head -1
          )

          if [ -z "$APP" ]; then
            APP=$(
              find build/Build/Products \
                -type d \
                -name "*.app" \
                | head -1
            )
          fi

          if [ -z "$APP" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi

          echo "$APP" \
            > output/app-path.txt

          echo "APP=$APP"

      - name: Put original MK1 in app and remove iDOS extension
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )

          rm -rf \
            "$APP/MKGame"

          mkdir -p \
            "$APP/MKGame"

          cp -R \
            game/MK1/. \
            "$APP/MKGame/"


          # iDOSThumbnail нам не нужен.
          # Раньше он ещё мешал установке через KSign.

          rm -rf \
            "$APP/PlugIns"


          test -f \
            "$APP/MKGame/MK1.EXE"

          test -f \
            "$APP/MKGame/MKAUTO.TXT"

          test -f \
            "$APP/MKGame/CLASSIC.CFG"

          test -f \
            "$APP/MKGame/REMASTER.CFG"


          echo "MK1 FILES=$(
            find "$APP/MKGame" \
              -type f \
              | wc -l \
              | tr -d ' '
          )"


          du -sh "$APP"

      - name: Create build info
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )

          {
            echo "MK1 ORIGINAL REMASTERED CLEAN"
            echo
            echo "REAL MK1.EXE: YES"
            echo "AUTOBOOT C DRIVE: YES"
            echo "iDOS KEYBOARD: HIDDEN"
            echo "iDOS BEIGE COMPUTER SKIN: HIDDEN"
            echo "iDOS TOOL PANEL: HIDDEN"
            echo "CUSTOM MK TOUCH CONTROLS: YES"
            echo "CLASSIC: ORIGINAL DISPLAY"
            echo "REMASTERED: HQ2X + LINEAR FINAL SCALE"
            echo "GAME FILES=$(
              find "$APP/MKGame" \
                -type f \
                | wc -l \
                | tr -d ' '
            )"
          } > output/BUILD-INFO.txt

          cat output/BUILD-INFO.txt

      - name: Create KSign IPA
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )

          rm -rf Payload
          mkdir -p Payload

          cp -R \
            "$APP" \
            Payload/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            output/MK1-Original-Remastered-CLEAN-KSign.ipa

          ls -lh \
            output/MK1-Original-Remastered-CLEAN-KSign.ipa

      - name: Upload MK1 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MK1-Original-Remastered-CLEAN-KSign
          path: |
            output/MK1-Original-Remastered-CLEAN-KSign.ipa
            output/BUILD-INFO.txt
          compression-level: 0

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MK1-Original-Remastered-CLEAN-FAIL
          path: |
            output/xcodebuild.log
            output/app-path.txt
            output/BUILD-INFO.txt
          if-no-files-found: ignore
