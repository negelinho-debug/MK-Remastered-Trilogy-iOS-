                      font=small
                  )


              width =
                  box[2] -
                  box[0]


              draw.text(
                  (
                      (
                          pixels -
                          width
                      ) / 2,
                      pixels *
                      0.68
                  ),
                  sub,
                  font=small,
                  fill=(
                      245,
                      78,
                      72
                  )
              )


              image.save(
                  filename,
                  "PNG"
              )


          images = []


          for (
              idiom,
              size,
              scale,
              pixels,
              filename
          ) in entries:

              full_path =
                  os.path.join(
                      appicon,
                      filename
                  )


              create_icon(
                  pixels,
                  full_path
              )


              images.append({

                  "idiom":
                      idiom,

                  "size":
                      size,

                  "scale":
                      scale,

                  "filename":
                      filename

              })


          contents = {

              "images":
                  images,

              "info": {

                  "author":
                      "xcode",

                  "version":
                      1

              }

          }


          with open(
              os.path.join(
                  appicon,
                  "Contents.json"
              ),
              "w"
          ) as file:

              json.dump(
                  contents,
                  file,
                  indent=2
              )


          print(
              "MK ICON READY"
          )

          PY

      # ==========================================================
      # VERIFY PATCHES
      # ==========================================================

      - name: Verify MK patches
        run: |
          set -e

          echo
          echo "===== AUTOBOOT ====="

          grep -n \
            "MKTRILOGY_AUTOBOOT" \
            dospad/dospad/Main/DOSPadEmulator.m

          echo
          echo "===== MAIN MENU ====="

          grep -n \
            "MKTRILOGY_MAIN_MENU" \
            dospad/dospad/Main/DPAppDelegate.m

          echo
          echo "===== SAFE TOUCH ====="

          grep -n \
            "MKTRILOGY_SAFE_TOUCH" \
            dospad/dospad/Main/DPEmulatorViewController.m

          echo
          echo "PATCHES OK"

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build MK Trilogy engine
        run: |
          set +e
          set -o pipefail

          xattr -cr dospad || true

          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -scheme iDOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.mkremastered.trilogy" \
            build \
            2>&1 \
            | tee output/xcodebuild.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "===== COMPILER ERRORS ====="

          grep -n \
            " error:" \
            output/xcodebuild.log \
            | tail -100 || true

          echo
          echo "===== BUILD STATUS ====="
          echo "$STATUS"

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      # ==========================================================
      # LOCATE APP
      # ==========================================================

      - name: Locate built app
        run: |
          set -e

          echo
          echo "===== BUILT APPS ====="

          find build \
            -type d \
            -name "*.app" \
            -print


          APP=$(
            find build/Build/Products \
              -type d \
              -name "iDOS.app" \
              | head -1
          )


          if [ -z "$APP" ]; then

            APP=$(
              find build/Build/Products \
                -type d \
                -name "*.app" \
                | head -1
            )

          fi


          if [ -z "$APP" ]; then

            echo "ERROR: APP NOT FOUND"

            exit 1

          fi


          echo "$APP" \
            > output/app-path.txt


          echo "APP=$APP"

      # ==========================================================
      # BUNDLE REAL GAMES
      # ==========================================================

      - name: Put real MK1 MK2 MK3 inside app
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )


          rm -rf \
            "$APP/MKGames"


          mkdir -p \
            "$APP/MKGames/mk1"

          mkdir -p \
            "$APP/MKGames/mk2"

          mkdir -p \
            "$APP/MKGames/mk3"


          cp -R \
            games/mk1/. \
            "$APP/MKGames/mk1/"


          cp -R \
            games/mk2/. \
            "$APP/MKGames/mk2/"


          cp -R \
            games/mk3/. \
            "$APP/MKGames/mk3/"


          echo
          echo "===== REAL EXES INSIDE APP ====="

          find "$APP/MKGames" \
            -type f \
            \( \
              -iname "MK1.EXE" \
              -o \
              -iname "MK2.EXE" \
              -o \
              -iname "MK3.EXE" \
            \) \
            -print


          test -n "$(
            find "$APP/MKGames/mk1" \
              -maxdepth 1 \
              -type f \
              -iname "MK1.EXE" \
              | head -1
          )"


          test -n "$(
            find "$APP/MKGames/mk2" \
              -maxdepth 1 \
              -type f \
              -iname "MK2.EXE" \
              | head -1
          )"


          test -n "$(
            find "$APP/MKGames/mk3" \
              -maxdepth 1 \
              -type f \
              -iname "MK3.EXE" \
              | head -1
          )"


          echo
          echo "MK1: $(find "$APP/MKGames/mk1" -type f | wc -l)"
          echo "MK2: $(find "$APP/MKGames/mk2" -type f | wc -l)"
          echo "MK3: $(find "$APP/MKGames/mk3" -type f | wc -l)"

      # ==========================================================
      # FINAL INFO PLIST
      # ==========================================================

      - name: Finalize Info plist
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )

          PLIST="$APP/Info.plist"


          plutil \
            -replace CFBundleDisplayName \
            -string "MK Remastered Trilogy" \
            "$PLIST"


          plutil \
            -replace CFBundleIdentifier \
            -string "com.mkremastered.trilogy" \
            "$PLIST"


          echo
          echo "===== FINAL INFO ====="

          plutil -p "$PLIST" \
            | head -60

      # ==========================================================
      # BUILD INFO
      # ==========================================================

      - name: Create build info
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )


          {
            echo "======================================"
            echo "MORTAL KOMBAT REMASTERED TRILOGY"
            echo "======================================"
            echo
            echo "REAL CLASSIC BUILD"
            echo
            echo "REAL MK1.EXE"
            echo "REAL MK2.EXE"
            echo "REAL MK3.EXE"
            echo "TRILOGY MAIN MENU"
            echo "CUSTOM APP ICON"
            echo "CUSTOM TOUCH CONTROLS"
            echo "MK1 CONTROL MAPPING"
            echo "MK2 CONTROL MAPPING"
            echo "MK3 CONTROL MAPPING"
            echo "MK3 RUN BUTTON"
            echo "CLASSIC PIXEL FILTER"
            echo "CRT+ SCANLINE FILTER"
            echo "FX BUTTON"
            echo
            echo "MK1 FILES=$(
              find "$APP/MKGames/mk1" \
                -type f \
                | wc -l
            )"
            echo
            echo "MK2 FILES=$(
              find "$APP/MKGames/mk2" \
                -type f \
                | wc -l
            )"
            echo
            echo "MK3 FILES=$(
              find "$APP/MKGames/mk3" \
                -type f \
                | wc -l
            )"

          } > output/BUILD-INFO.txt


          cat \
            output/BUILD-INFO.txt

      # ==========================================================
      # CREATE IPA
      # ==========================================================

      - name: Create IPA
        run: |
          set -e

          APP=$(
            cat output/app-path.txt
          )


          rm -rf Payload

          mkdir Payload


          cp -R \
            "$APP" \
            Payload/


          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            output/MK-Remastered-Trilogy-REAL.ipa


          echo
          echo "===== FINAL IPA ====="

          ls -lh \
            output/MK-Remastered-Trilogy-REAL.ipa

      # ==========================================================
      # SUCCESS
      # ==========================================================

      - name: Upload REAL MK Trilogy IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MK-Remastered-Trilogy-REAL
          path: |
            output/MK-Remastered-Trilogy-REAL.ipa
            output/BUILD-INFO.txt
          compression-level: 0

      # ==========================================================
      # FAILURE
      # ==========================================================

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MK-Trilogy-FAIL
          path: |
            output/xcodebuild.log
            output/BUILD-INFO.txt
          if-no-files-found: ignore
