      # ==========================================================
      # ICON
      # ==========================================================

      - name: Generate MK1 app icon
        run: |
          set -e

          python3 <<'PY'
          from PIL import Image
          from PIL import ImageDraw
          from PIL import ImageFont
          import glob
          import json
          import os

          sets = glob.glob(
              "dospad/**/*.appiconset",
              recursive=True
          )

          if not sets:
              raise SystemExit(
                  "ERROR: APPICON SET NOT FOUND"
              )

          icon_dir = sets[0]

          print(
              "ICON DIR:",
              icon_dir
          )

          for old in glob.glob(
              os.path.join(
                  icon_dir,
                  "*.png"
              )
          ):
              os.remove(old)


          entries = [
              ("iphone", "20x20", "2x", 40, "mk40.png"),
              ("iphone", "20x20", "3x", 60, "mk60a.png"),
              ("iphone", "29x29", "2x", 58, "mk58.png"),
              ("iphone", "29x29", "3x", 87, "mk87.png"),
              ("iphone", "40x40", "2x", 80, "mk80.png"),
              ("iphone", "40x40", "3x", 120, "mk120a.png"),
              ("iphone", "60x60", "2x", 120, "mk120b.png"),
              ("iphone", "60x60", "3x", 180, "mk180.png"),
              ("ios-marketing", "1024x1024", "1x", 1024, "mk1024.png")
          ]


          def font(size):
              candidates = [
                  "/System/Library/Fonts/Supplemental/Arial Bold.ttf",
                  "/System/Library/Fonts/Supplemental/Arial.ttf"
              ]

              for candidate in candidates:

                  if os.path.exists(candidate):

                      return ImageFont.truetype(
                          candidate,
                          size
                      )

              return ImageFont.load_default()


          def generate(px, output):

              image = Image.new(
                  "RGB",
                  (px, px),
                  (9, 5, 7)
              )

              draw = ImageDraw.Draw(
                  image
              )


              for y in range(px):

                  factor = y / max(
                      px - 1,
                      1
                  )

                  red = int(
                      100 * (1 - factor) +
                      12 * factor
                  )

                  draw.line(
                      (0, y, px, y),
                      fill=(
                          red,
                          5,
                          7
                      )
                  )


              margin = int(
                  px * 0.10
              )


              draw.ellipse(
                  (
                      margin,
                      margin,
                      px - margin,
                      px - margin
                  ),
                  outline=(
                      240,
                      48,
                      40
                  ),
                  width=max(
                      2,
                      int(px * 0.025)
                  )
              )


              title_font = font(
                  max(
                      12,
                      int(px * 0.28)
                  )
              )


              title = "MK1"


              box = draw.textbbox(
                  (0, 0),
                  title,
                  font=title_font
              )


              width = box[2] - box[0]
              height = box[3] - box[1]


              draw.text(
                  (
                      (px - width) / 2,
                      px * 0.43 - height / 2
                  ),
                  title,
                  font=title_font,
                  fill=(
                      250,
                      250,
                      250
                  )
              )


              small_font = font(
                  max(
                      8,
                      int(px * 0.055)
                  )
              )


              subtitle = "REMASTERED"


              box = draw.textbbox(
                  (0, 0),
                  subtitle,
                  font=small_font
              )


              width = box[2] - box[0]


              draw.text(
                  (
                      (px - width) / 2,
                      px * 0.68
                  ),
                  subtitle,
                  font=small_font,
                  fill=(
                      245,
                      75,
                      66
                  )
              )


              image.save(
                  output,
                  "PNG"
              )


          images = []


          for idiom, size, scale, pixels, filename in entries:

              generate(
                  pixels,
                  os.path.join(
                      icon_dir,
                      filename
                  )
              )

              images.append(
                  {
                      "idiom": idiom,
                      "size": size,
                      "scale": scale,
                      "filename": filename
                  }
              )


          contents = {
              "images": images,
              "info": {
                  "author": "xcode",
                  "version": 1
              }
          }


          with open(
              os.path.join(
                  icon_dir,
                  "Contents.json"
              ),
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  contents,
                  file,
                  indent=2
              )


          print(
              "ICON SUCCESS"
          )
          PY

