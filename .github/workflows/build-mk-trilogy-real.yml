          '''

          emulator_new = '''
              DPGamepad *mkOriginalGamepad =
                  [self findGamepad];

              if (mkOriginalGamepad)
              {
                  [mkOriginalGamepad
                   applyConfiguration:
                   _gamepadConfig];

                  mkOriginalGamepad.hidden = YES;
              }

              [self mkInstallControls];
              [self mkApplyCRT];
          '''


          if emulator_old not in text:

              raise SystemExit(
                  "ERROR: EMULATOR START PATCH MARKER NOT FOUND"
              )


          text = text.replace(
              emulator_old,
              emulator_new,
              1
          )


          open(
              path,
              "w",
              encoding="utf-8"
          ).write(text)


          print(
              "MK touch controls + CRT FX installed"
          )

