name: Build REAL MK Remastered Trilogy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        run: |
          set -e

          brew install innoextract p7zip

          python3 -m pip install \
            --break-system-packages pillow || \
          python3 -m pip install \
            --user pillow

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== INNOEXTRACT ====="
          innoextract --version

      # ==========================================================
      # CLEAN
      # ==========================================================

      - name: Prepare folders
        run: |
          set -e

          rm -rf raw-installers
          rm -rf installers
          rm -rf release-files
          rm -rf extracted
          rm -rf games
          rm -rf dospad
          rm -rf build
          rm -rf Payload
          rm -rf output

          mkdir -p raw-installers
          mkdir -p installers
          mkdir -p release-files
          mkdir -p extracted
          mkdir -p games/mk1
          mkdir -p games/mk2
          mkdir -p games/mk3
          mkdir -p output

      # ==========================================================
      # COLLECT EXE FROM REPOSITORY
      # ==========================================================

      - name: Collect installers from repository
        run: |
          set -e

          COUNT=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            COUNT=$((COUNT + 1))

            echo "FOUND:"
            echo "$FILE"

            cp "$FILE" \
              "raw-installers/repo_${COUNT}.exe"

          done < <(
            find . \
              -type f \
              -iname "*.exe" \
              -not -path "./.git/*" \
              -not -path "./raw-installers/*" \
              -not -path "./installers/*" \
              -not -path "./release-files/*" \
              -not -path "./extracted/*" \
              -not -path "./games/*" \
              -not -path "./dospad/*" \
              | sort
          )

          echo
          echo "===== REPOSITORY INSTALLERS ====="

          ls -lh raw-installers || true

      # ==========================================================
      # RELEASE INSTALLER
      # ==========================================================

      - name: Download installers from latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          echo "===== RELEASE LIST ====="

          gh release list

          TAG=$(
            gh release list \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName'
          )

          echo "Latest tag:"
          echo "$TAG"

          if [ -n "$TAG" ]; then

            gh release download "$TAG" \
              --dir release-files \
              --pattern "*.exe"

          fi

          N=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            N=$((N + 1))

            cp "$FILE" \
              "raw-installers/release_${N}.exe"

          done < <(
            find release-files \
              -type f \
              -iname "*.exe" \
              | sort
          )

          echo
          echo "===== ALL INSTALLERS ====="

          ls -lh raw-installers

          exit 0

      # ==========================================================
      # REMOVE DUPLICATES
      # ==========================================================

      - name: Deduplicate installers
        run: |
          set -e

          for FILE in raw-installers/*.exe; do

            [ -f "$FILE" ] || continue

            HASH=$(
              shasum -a 256 "$FILE" \
              | awk '{print $1}'
            )

            DEST="installers/${HASH}.exe"

            if [ ! -f "$DEST" ]; then

              cp "$FILE" "$DEST"

            fi

          done

          echo
          echo "===== UNIQUE INSTALLERS ====="

          ls -lh installers

          COUNT=$(
            find installers \
              -type f \
              -iname "*.exe" \
              | wc -l \
              | tr -d ' '
          )

          echo "COUNT=$COUNT"

          if [ "$COUNT" -lt 3 ]; then

            echo "ERROR:"
            echo "Need all three installers."

            exit 1

          fi

      # ==========================================================
      # EXTRACT
      # ==========================================================

      - name: Extract installers
        run: |
          set -e

          N=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            N=$((N + 1))

            DEST="extracted/pkg${N}"

            mkdir -p "$DEST"

            echo
            echo "===================================="
            echo "EXTRACTING"
            echo "$FILE"
            echo "===================================="

            set +e

            innoextract \
              --extract \
              --output-dir "$DEST" \
              "$FILE"

            RESULT=$?

            if [ "$RESULT" -ne 0 ]; then

              echo "innoextract failed"
              echo "trying 7z"

              7z x \
                "$FILE" \
                "-o$DEST" \
                -y

            fi

            set -e

          done < <(
            find installers \
              -type f \
              -iname "*.exe" \
              | sort
          )

          echo
          echo "===== GAME EXE SEARCH ====="

          find extracted \
            -type f \
            \( \
              -iname "MK1.EXE" \
              -o \
              -iname "MK2.EXE" \
              -o \
              -iname "MK3.EXE" \
            \) \
            -print

      # ==========================================================
      # FIXED NORMALIZATION
      # ==========================================================

      - name: Normalize game folders
        run: |
          set -e

          echo
          echo "===== FIND REAL GAME EXECUTABLES ====="

          MK1_EXE=$(
            find extracted \
              -type f \
              -iname "MK1.EXE" \
              -not -path "*/__support/*" \
              | head -1
          )

          MK2_EXE=$(
            find extracted \
              -type f \
              -iname "MK2.EXE" \
              -not -path "*/__support/*" \
              | head -1
          )

          MK3_EXE=$(
            find extracted \
              -type f \
              -iname "MK3.EXE" \
              -not -path "*/__support/*" \
              | head -1
          )

          echo "MK1_EXE=$MK1_EXE"
          echo "MK2_EXE=$MK2_EXE"
          echo "MK3_EXE=$MK3_EXE"

          if [ -z "$MK1_EXE" ]; then
            echo "ERROR: REAL MK1.EXE NOT FOUND"
            exit 1
          fi

          if [ -z "$MK2_EXE" ]; then
            echo "ERROR: REAL MK2.EXE NOT FOUND"
            exit 1
          fi

          if [ -z "$MK3_EXE" ]; then
            echo "ERROR: REAL MK3.EXE NOT FOUND"
            exit 1
          fi

          MK1_SRC="$(dirname "$MK1_EXE")"
          MK2_SRC="$(dirname "$MK2_EXE")"
          MK3_SRC="$(dirname "$MK3_EXE")"

          echo
          echo "===== REAL DIRECTORIES ====="

          echo "MK1_SRC=$MK1_SRC"
          echo "MK2_SRC=$MK2_SRC"
          echo "MK3_SRC=$MK3_SRC"

          rm -rf games/mk1
          rm -rf games/mk2
          rm -rf games/mk3

          mkdir -p games/mk1
          mkdir -p games/mk2
          mkdir -p games/mk3

          cp -R \
            "$MK1_SRC"/. \
            games/mk1/

          cp -R \
            "$MK2_SRC"/. \
            games/mk2/

          cp -R \
            "$MK3_SRC"/. \
            games/mk3/

          echo
          echo "===== VALIDATE ====="

          MK1_FINAL=$(
            find games/mk1 \
              -maxdepth 1 \
              -type f \
              -iname "MK1.EXE" \
              | head -1
          )

          MK2_FINAL=$(
            find games/mk2 \
              -maxdepth 1 \
              -type f \
              -iname "MK2.EXE" \
              | head -1
          )

          MK3_FINAL=$(
            find games/mk3 \
              -maxdepth 1 \
              -type f \
              -iname "MK3.EXE" \
              | head -1
          )

          echo "MK1_FINAL=$MK1_FINAL"
          echo "MK2_FINAL=$MK2_FINAL"
          echo "MK3_FINAL=$MK3_FINAL"

          test -n "$MK1_FINAL"
          test -n "$MK2_FINAL"
          test -n "$MK3_FINAL"

          echo
          echo "===== COUNTS ====="

          echo "MK1: $(find games/mk1 -type f | wc -l)"
          echo "MK2: $(find games/mk2 -type f | wc -l)"
          echo "MK3: $(find games/mk3 -type f | wc -l)"

          echo
          echo "NORMALIZATION SUCCESS"

      # ==========================================================
      # CLONE IDOS
      # ==========================================================

      - name: Clone iDOS
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/litchie/dospad.git \
            dospad

          echo
          echo "===== IDOS PROJECT ====="

          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -list

      # ==========================================================
      # GAME CONFIG
      # ==========================================================

      - name: Create DOS configs
        run: |
          set -e

          for GAME in mk1 mk2 mk3; do

            mkdir -p "games/$GAME/config"

            cp \
              dospad/Resources/configs/dospad.cfg \
              "games/$GAME/config/dospad.cfg"

          done

          python3 <<'PY'
          from pathlib import Path
          import re

          for game in ["mk1", "mk2", "mk3"]:

              p = Path(
                  f"games/{game}/config/dospad.cfg"
              )

              text = p.read_text(
                  errors="ignore"
              )

              text = re.sub(
                  r"(?m)^frameskip\s*=.*$",
                  "frameskip=0",
                  text
              )

              text = re.sub(
                  r"(?m)^core\s*=.*$",
                  "core=dynamic",
                  text
              )

              text = re.sub(
                  r"(?m)^cycles\s*=.*$",
                  "cycles=max 95%",
                  text
              )

              p.write_text(text)

          PY

      # ==========================================================
      # AUTO BOOT FILES
      # ==========================================================

      - name: Create game boot commands
        run: |
          set -e

          cat > games/mk1/MKAUTO.TXT <<'EOF'
          MK1.EXE
          EOF

          cat > games/mk2/MKAUTO.TXT <<'EOF'
          MK2.EXE
          EOF

          if [ -f "games/mk3/IMAGE/MK3.cue" ]; then

            cat > games/mk3/MKAUTO.TXT <<'EOF'
          imgmount d "C:\IMAGE\MK3.cue" -t iso
          MK3.EXE
          EOF

          else

            cat > games/mk3/MKAUTO.TXT <<'EOF'
          MK3.EXE
          EOF

          fi

          echo "===== MK1 AUTO ====="
          cat games/mk1/MKAUTO.TXT

          echo "===== MK2 AUTO ====="
          cat games/mk2/MKAUTO.TXT

          echo "===== MK3 AUTO ====="
          cat games/mk3/MKAUTO.TXT

      # ==========================================================
      # PATCH DOSBOX AUTOBOOT
      # ==========================================================

      - name: Patch DOSBox auto boot
        run: |
          set -e

          FILE="dospad/dospad/Main/DOSPadEmulator.m"

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          text = open(
              path,
              "r",
              encoding="utf-8"
          ).read()

          marker = (
              '[self.commandList '
              'addObject:@"REM END AUTOMOUNT"];'
          )

          if marker not in text:

              raise SystemExit(
                  "ERROR: AUTOBOOT MARKER NOT FOUND"
              )

          if "MKTRILOGY_BOOT_PATCH" in text:

              print(
                  "Already patched"
              )

              raise SystemExit(0)

          patch = marker + r'''

              // ================================================
              // MKTRILOGY_BOOT_PATCH
              // ================================================

              NSString *mkBootPath =
                  [self.workingDirectory.path
                   stringByAppendingPathComponent:
                   @"MKAUTO.TXT"];

              if ([[NSFileManager defaultManager]
                   fileExistsAtPath:mkBootPath])
              {
                  NSError *mkError = nil;

                  NSString *mkBoot =
                      [NSString
                       stringWithContentsOfFile:
                       mkBootPath
                       encoding:
                       NSUTF8StringEncoding
                       error:
                       &mkError];

                  if (mkBoot.length > 0)
                  {
                      NSArray *mkLines =
                          [mkBoot
                           componentsSeparatedByCharactersInSet:
                           [NSCharacterSet
                            newlineCharacterSet]];

                      for (NSString *mkRaw in mkLines)
                      {
                          NSString *mkLine =
                              [mkRaw
                               stringByTrimmingCharactersInSet:
                               [NSCharacterSet
                                whitespaceAndNewlineCharacterSet]];

                          if (mkLine.length > 0)
                          {
                              [self.commandList
                               addObject:mkLine];
                          }
                      }
                  }
              }

              // ===== END MKTRILOGY_BOOT_PATCH =====
          '''

          text = text.replace(
              marker,
              patch,
              1
          )

          open(
              path,
              "w",
              encoding="utf-8"
          ).write(text)

          print(
              "DOSBox MK autoboot installed"
          )

          PY

      # ==========================================================
      # TRILOGY MAIN MENU
      # ==========================================================

      - name: Add Trilogy menu
        run: |
          set -e

          FILE="dospad/dospad/Main/DPAppDelegate.m"

          python3 - "$FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          text = open(
              path,
              "r",
              encoding="utf-8"
          ).read()

          if "MKTRILOGY_MAIN_MENU" in text:

              print(
                  "Menu already installed"
              )

              raise SystemExit(0)

          marker = '#import <AVFoundation/AVFoundation.h>'

          if marker not in text:

              raise SystemExit(
                  "ERROR: DPAppDelegate import marker missing"
              )

          launcher = r'''

          #import <QuartzCore/QuartzCore.h>

          // =====================================================
          // MKTRILOGY_MAIN_MENU
          // =====================================================

          @interface DPAppDelegate (MKTrilogy)

          - (void)mkShowLauncher;
          - (void)mkLaunchGame:(NSString *)game;

          @end


          @interface MKTrilogyLauncherViewController
              : UIViewController

          @property(nonatomic, weak)
          DPAppDelegate *owner;

          @property(nonatomic, strong)
          CAGradientLayer *gradient;

          @property(nonatomic, strong)
          UILabel *mainTitle;

          @property(nonatomic, strong)
          UILabel *subTitle;

          @property(nonatomic, strong)
          UILabel *chooseTitle;

          @property(nonatomic, strong)
          UISegmentedControl *filter;

          @property(nonatomic, strong)
          UIButton *mk1;

          @property(nonatomic, strong)
          UIButton *mk2;

          @property(nonatomic, strong)
          UIButton *mk3;

          @property(nonatomic, strong)
          UILabel *footer;

          @end


          @implementation
          MKTrilogyLauncherViewController


          - (void)viewDidLoad
          {
              [super viewDidLoad];

              self.view.backgroundColor =
                  UIColor.blackColor;


              self.gradient =
                  [CAGradientLayer layer];

              self.gradient.colors = @[
                  (id)[UIColor
                       colorWithRed:0.20
                       green:0.005
                       blue:0.008
                       alpha:1].CGColor,

                  (id)[UIColor
                       colorWithRed:0.035
                       green:0.012
                       blue:0.015
                       alpha:1].CGColor,

                  (id)UIColor.blackColor.CGColor
              ];

              self.gradient.locations =
                  @[
                    @0.0,
                    @0.45,
                    @1.0
                  ];

              [self.view.layer
               insertSublayer:
               self.gradient
               atIndex:0];


              self.mainTitle =
                  [[UILabel alloc] init];

              self.mainTitle.text =
                  @"MORTAL KOMBAT";

              self.mainTitle.textColor =
                  UIColor.whiteColor;

              self.mainTitle.textAlignment =
                  NSTextAlignmentCenter;

              self.mainTitle.font =
                  [UIFont
                   systemFontOfSize:39
                   weight:UIFontWeightBlack];

              [self.view
               addSubview:self.mainTitle];


              self.subTitle =
                  [[UILabel alloc] init];

              self.subTitle.text =
                  @"REMASTERED TRILOGY";

              self.subTitle.textColor =
                  [UIColor
                   colorWithRed:1
                   green:0.10
                   blue:0.09
                   alpha:1];

              self.subTitle.textAlignment =
                  NSTextAlignmentCenter;

              self.subTitle.font =
                  [UIFont
                   systemFontOfSize:19
                   weight:UIFontWeightBlack];

              [self.view
               addSubview:self.subTitle];


              self.chooseTitle =
                  [[UILabel alloc] init];

              self.chooseTitle.text =
                  @"CHOOSE YOUR MK";

              self.chooseTitle.textAlignment =
                  NSTextAlignmentCenter;

              self.chooseTitle.textColor =
                  [UIColor
                   colorWithWhite:0.82
                   alpha:1];

              self.chooseTitle.font =
                  [UIFont
                   systemFontOfSize:14
                   weight:UIFontWeightBold];

              [self.view
               addSubview:self.chooseTitle];


              self.filter =
                  [[UISegmentedControl alloc]
                   initWithItems:
                   @[
                     @"CLASSIC",
                     @"CRT+"
                   ]];

              BOOL enhanced =
                  [[NSUserDefaults
                    standardUserDefaults]
                   boolForKey:@"MKEnhanced"];

              self.filter.selectedSegmentIndex =
                  enhanced ? 1 : 0;

              if (@available(iOS 13.0, *))
              {
                  self.filter.selectedSegmentTintColor =
                      [UIColor
                       colorWithRed:0.60
                       green:0.03
                       blue:0.03
                       alpha:1];
              }

              [self.filter
               addTarget:self
               action:@selector(filterChanged:)
               forControlEvents:
               UIControlEventValueChanged];

              [self.view
               addSubview:self.filter];


              self.mk1 =
                  [self
                   makeButton:@"MORTAL KOMBAT"
                   game:@"mk1"];

              self.mk2 =
                  [self
                   makeButton:@"MORTAL KOMBAT II"
                   game:@"mk2"];

              self.mk3 =
                  [self
                   makeButton:@"MORTAL KOMBAT 3"
                   game:@"mk3"];


              [self.view addSubview:self.mk1];
              [self.view addSubview:self.mk2];
              [self.view addSubview:self.mk3];


              self.footer =
                  [[UILabel alloc] init];

              self.footer.text =
                  @"REAL CLASSIC ENGINE • TOUCH • CRT FX";

              self.footer.textColor =
                  [UIColor
                   colorWithWhite:0.45
                   alpha:1];

              self.footer.textAlignment =
                  NSTextAlignmentCenter;

              self.footer.font =
                  [UIFont
                   systemFontOfSize:10
                   weight:UIFontWeightBold];

              [self.view
               addSubview:self.footer];
          }


          - (UIButton *)makeButton:
              (NSString *)title
              game:(NSString *)game
          {
              UIButton *button =
                  [UIButton
                   buttonWithType:
                   UIButtonTypeSystem];

              [button
               setTitle:title
               forState:UIControlStateNormal];

              [button
               setTitleColor:
               UIColor.whiteColor
               forState:UIControlStateNormal];

              button.titleLabel.font =
                  [UIFont
                   systemFontOfSize:20
                   weight:UIFontWeightBlack];

              button.backgroundColor =
                  [UIColor
                   colorWithRed:0.36
                   green:0.018
                   blue:0.02
                   alpha:0.98];

              button.layer.cornerRadius = 14;

              button.layer.borderWidth = 1;

              button.layer.borderColor =
                  [UIColor
                   colorWithWhite:1
                   alpha:0.15].CGColor;

              button.accessibilityIdentifier =
                  game;

              [button
               addTarget:self
               action:@selector(gamePressed:)
               forControlEvents:
               UIControlEventTouchUpInside];

              return button;
          }


          - (void)filterChanged:
              (UISegmentedControl *)sender
          {
              BOOL enhanced =
                  sender.selectedSegmentIndex == 1;

              [[NSUserDefaults
                standardUserDefaults]
               setBool:enhanced
               forKey:@"MKEnhanced"];

              [[NSUserDefaults
                standardUserDefaults]
               synchronize];
          }


          - (void)gamePressed:
              (UIButton *)sender
          {
              NSString *game =
                  sender.accessibilityIdentifier;

              if (game.length == 0)
                  return;

              self.chooseTitle.text =
                  @"LOADING...";

              self.mk1.enabled = NO;
              self.mk2.enabled = NO;
              self.mk3.enabled = NO;

              [self.owner
               mkLaunchGame:game];
          }


          - (void)viewDidLayoutSubviews
          {
              [super viewDidLayoutSubviews];

              CGRect b =
                  self.view.bounds;

              CGFloat w =
                  CGRectGetWidth(b);

              CGFloat h =
                  CGRectGetHeight(b);

              self.gradient.frame = b;

              self.mainTitle.frame =
                  CGRectMake(
                      0,
                      15,
                      w,
                      48
                  );

              self.subTitle.frame =
                  CGRectMake(
                      0,
                      60,
                      w,
                      27
                  );

              self.chooseTitle.frame =
                  CGRectMake(
                      0,
                      91,
                      w,
                      20
                  );

              self.filter.frame =
                  CGRectMake(
                      (w - 250) / 2,
                      117,
                      250,
                      31
                  );

              CGFloat bw =
                  MIN(
                      430,
                      w - 100
                  );

              CGFloat x =
                  (w - bw) / 2;

              CGFloat bh = 55;

              CGFloat gap = 12;

              CGFloat y = 170;

              self.mk1.frame =
                  CGRectMake(
                      x,
                      y,
                      bw,
                      bh
                  );

              self.mk2.frame =
                  CGRectMake(
                      x,
                      y + bh + gap,
                      bw,
                      bh
                  );

              self.mk3.frame =
                  CGRectMake(
                      x,
                      y + (bh + gap) * 2,
                      bw,
                      bh
                  );

              self.footer.frame =
                  CGRectMake(
                      0,
                      h - 28,
                      w,
                      18
                  );
          }


          - (BOOL)prefersStatusBarHidden
          {
              return YES;
          }


          - (UIInterfaceOrientationMask)
              supportedInterfaceOrientations
          {
              return
                  UIInterfaceOrientationMaskLandscape;
          }


          @end

          // ===== END MKTRILOGY_MAIN_MENU =====

          '''

          text = text.replace(
              marker,
              marker + launcher,
              1
          )


          # Replace automatic DOS start with our menu.
          pattern = (
              r'#ifdef THREADED'
              r'.*?'
              r'\[self performSelector:'
              r'@selector\(startDOS\)'
              r' withObject:nil afterDelay:1\];'
              r'.*?'
              r'#endif'
          )

          replacement = '''
              [self performSelector:
                  @selector(mkShowLauncher)
                  withObject:nil
                  afterDelay:0.25];
          '''

          new_text, count = re.subn(
              pattern,
              replacement,
              text,
              count=1,
              flags=re.S
          )

          if count != 1:

              raise SystemExit(
                  "ERROR: STARTDOS PATCH FAILED"
              )

          text = new_text


          method_marker = (
              '-(void)setWindowTitle:(char *)title'
          )

          if method_marker not in text:

              raise SystemExit(
                  "ERROR: METHOD MARKER NOT FOUND"
              )

          methods = r'''

          // =====================================================
          // MK TRILOGY LAUNCH METHODS
          // =====================================================

          - (void)mkShowLauncher
          {
              if ([DOSPadEmulator
                   sharedInstance].started)
              {
                  return;
              }


              MKTrilogyLauncherViewController
                  *launcher =
                  [[MKTrilogyLauncherViewController
                    alloc] init];

              launcher.owner = self;

              launcher.modalPresentationStyle =
                  UIModalPresentationFullScreen;


              [self.emulatorController
               presentViewController:
               launcher
               animated:NO
               completion:nil];
          }


          - (void)mkLaunchGame:
              (NSString *)game
          {
              NSFileManager *fm =
                  [NSFileManager
                   defaultManager];


              NSString *bundleRoot =
                  [[[NSBundle
                     mainBundle]
                    bundlePath]
                   stringByAppendingPathComponent:
                   @"MKGames"];


              NSString *source =
                  [bundleRoot
                   stringByAppendingPathComponent:
                   game];


              NSString *documents =
                  [NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                   ) lastObject];


              NSString *root =
                  [documents
                   stringByAppendingPathComponent:
                   @"MKTrilogy"];


              NSString *destination =
                  [root
                   stringByAppendingPathComponent:
                   game];


              [fm
               createDirectoryAtPath:
               root
               withIntermediateDirectories:YES
               attributes:nil
               error:nil];


              NSString *exe = nil;

              if ([game
                   isEqualToString:@"mk1"])
              {
                  exe = @"MK1.EXE";
              }

              else if ([game
                        isEqualToString:@"mk2"])
              {
                  exe = @"MK2.EXE";
              }

              else
              {
                  exe = @"MK3.EXE";
              }


              NSString *testExe =
                  [destination
                   stringByAppendingPathComponent:
                   exe];


              if (![fm
