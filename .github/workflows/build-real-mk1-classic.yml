name: Build REAL MK1 Classic iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ==========================================================
      # REPOSITORY
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        run: |
          set -e

          brew install innoextract p7zip

          python3 -m pip install \
            --break-system-packages \
            pillow || \
          python3 -m pip install \
            pillow

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== INNOEXTRACT ====="
          innoextract --version

      # ==========================================================
      # FOLDERS
      # ==========================================================

      - name: Prepare folders
        run: |
          set -e

          mkdir -p installers
          mkdir -p release-files
          mkdir -p extracted
          mkdir -p mk1-game
          mkdir -p output

      # ==========================================================
      # FIND INSTALLERS IN REPOSITORY
      # ==========================================================

      - name: Find EXE installers in repository
        run: |
          set -e

          echo "===== EXE IN REPOSITORY ====="

          find . \
            -type f \
            -iname "*.exe" \
            -not -path "./.git/*" \
            -print \
            | sort

          COUNT=0

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            COUNT=$((COUNT + 1))

            cp "$FILE" \
              "installers/repo_${COUNT}.exe"

          done < <(
            find . \
              -type f \
              -iname "*.exe" \
              -not -path "./.git/*" \
              | sort
          )

      # ==========================================================
      # DOWNLOAD LARGE INSTALLER FROM RELEASE
      # ==========================================================

      - name: Download EXE from latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          echo "===== RELEASES ====="

          gh release list

          TAG=$(
            gh release list \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName'
          )

          echo "Latest release: $TAG"

          if [ -n "$TAG" ]; then

            gh release download "$TAG" \
              --dir release-files \
              --pattern "*.exe"

          fi

          echo "===== RELEASE FILES ====="

          find release-files \
            -type f \
            -maxdepth 1 \
            -print

          NUM=0

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            NUM=$((NUM + 1))

            cp "$FILE" \
              "installers/release_${NUM}.exe"

          done < <(
            find release-files \
              -type f \
              -iname "*.exe" \
              | sort
          )

          exit 0

      # ==========================================================
      # VERIFY
      # ==========================================================

      - name: Show installer pool
        run: |
          set -e

          echo "===== INSTALLERS ====="

          ls -lh installers

          COUNT=$(
            find installers \
              -type f \
              -iname "*.exe" \
              | wc -l \
              | tr -d ' '
          )

          echo "Installer count: $COUNT"

          if [ "$COUNT" -lt 3 ]; then
            echo "WARNING:"
            echo "Expected 3 installers."
            echo "Continuing anyway because MK1 may still be present."
          fi

      # ==========================================================
      # EXTRACT ALL INSTALLERS
      # ==========================================================

      - name: Extract installers
        run: |
          set -e

          N=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            N=$((N + 1))

            DEST="extracted/pkg${N}"

            mkdir -p "$DEST"

            echo
            echo "======================================"
            echo "EXTRACTING:"
            echo "$FILE"
            echo "TO:"
            echo "$DEST"
            echo "======================================"

            if innoextract \
              --extract \
              --output-dir "$DEST" \
              "$FILE"
            then

              echo "innoextract OK"

            else

              echo "Trying 7z..."

              7z x \
                "$FILE" \
                "-o$DEST" \
                -y

            fi

          done < <(
            find installers \
              -type f \
              -iname "*.exe" \
              | sort
          )

      # ==========================================================
      # FIND THE REAL MK1
      # ==========================================================

      - name: Find Mortal Kombat 1
        run: |
          set -e

          echo "===== SEARCHING FOR MK1.EXE ====="

          find extracted \
            -type f \
            -iname "MK1.EXE" \
            -print

          MK1_EXE=$(
            find extracted \
              -type f \
              -iname "MK1.EXE" \
              | head -1
          )

          if [ -z "$MK1_EXE" ]; then

            echo "ERROR:"
            echo "MK1.EXE WAS NOT FOUND."

            exit 1
          fi

          MK1_DIR="$(dirname "$MK1_EXE")"

          echo
          echo "REAL MK1 FOUND:"
          echo "$MK1_DIR"

          echo "$MK1_DIR" > mk1-path.txt

      # ==========================================================
      # COPY REAL GAME
      # ==========================================================

      - name: Prepare MK1 game files
        run: |
          set -e

          MK1_DIR="$(cat mk1-path.txt)"

          rm -rf mk1-game
          mkdir -p mk1-game

          cp -R "$MK1_DIR"/. mk1-game/

          echo "===== REAL MK1 FILES ====="

          find mk1-game \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -150

          echo
          echo "===== CHECK IMPORTANT FILES ====="

          test -f mk1-game/MK1.EXE

          ls -lh mk1-game/MK1.EXE

          if [ -d mk1-game/GRAPHICS ]; then
            echo "GRAPHICS = YES"
          fi

          if [ -d mk1-game/SFX ]; then
            echo "SFX = YES"
          fi

      # ==========================================================
      # CLONE REAL iOS DOSBOX
      # ==========================================================

      - name: Clone iDOS DOSBox
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/litchie/dospad.git \
            dospad

          echo "===== iDOS PROJECT ====="

          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -list

      # ==========================================================
      # BRANDING
      # ==========================================================

      - name: Rename app to MK Remastered Trilogy
        run: |
          set -e

          PLIST="dospad/Resources/iDOS-Info.plist"

          if [ -f "$PLIST" ]; then

            plutil \
              -replace CFBundleDisplayName \
              -string "MK Remastered Trilogy" \
              "$PLIST" || true

            plutil \
              -replace UISupportedInterfaceOrientations \
              -json '[
                "UIInterfaceOrientationLandscapeLeft",
                "UIInterfaceOrientationLandscapeRight"
              ]' \
              "$PLIST" || true

          fi

      # ==========================================================
      # CREATE APP ICON
      # ==========================================================

      - name: Create MK app icon
        run: |
          set -e

          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          size = 1024

          img = Image.new(
              "RGB",
              (size, size),
              (5, 5, 8)
          )

          draw = ImageDraw.Draw(img)

          # dark red background
          for y in range(size):
              t = y / size

              r = int(90 * (1 - t) + 15 * t)
              g = int(5)
              b = int(8)

              draw.line(
                  (0, y, size, y),
                  fill=(r, g, b)
              )

          # circle
          margin = 130

          draw.ellipse(
              (
                  margin,
                  margin,
                  size - margin,
                  size - margin
              ),
              fill=(8, 8, 10),
              outline=(210, 35, 35),
              width=28
          )

          try:

              font = ImageFont.truetype(
                  "/System/Library/Fonts/Supplemental/Arial Bold.ttf",
                  300
              )

              small = ImageFont.truetype(
                  "/System/Library/Fonts/Supplemental/Arial Bold.ttf",
                  80
              )

          except:

              font = ImageFont.load_default()
              small = ImageFont.load_default()

          text = "MK"

          box = draw.textbbox(
              (0, 0),
              text,
              font=font
          )

          w = box[2] - box[0]
          h = box[3] - box[1]

          draw.text(
              (
                  (size - w) / 2,
                  390 - h / 2
              ),
              text,
              font=font,
              fill=(245, 245, 245)
          )

          sub = "TRILOGY"

          box = draw.textbbox(
              (0, 0),
              sub,
              font=small
          )

          w = box[2] - box[0]

          draw.text(
              (
                  (size - w) / 2,
                  690
              ),
              sub,
              font=small,
              fill=(255, 90, 90)
          )

          img.save("mk-icon.png")
          PY

          ICON_SET="dospad/Resources/Assets.xcassets/AppIcon.appiconset"

          echo "===== ICON SET ====="

          find "$ICON_SET" \
            -maxdepth 1 \
            -type f \
            -print || true

          for FILE in "$ICON_SET"/icon-*.png; do

            [ -f "$FILE" ] || continue

            BASE="$(basename "$FILE" .png)"
            PIXELS="${BASE#icon-}"

            if [[ "$PIXELS" =~ ^[0-9]+$ ]]; then

              sips \
                -s format png \
                -z "$PIXELS" "$PIXELS" \
                mk-icon.png \
                --out "$FILE" \
                >/dev/null

            fi

          done

          if [ -f "$ICON_SET/iTunesArtwork@2x.png" ]; then

            sips \
              -s format png \
              -z 1024 1024 \
              mk-icon.png \
              --out "$ICON_SET/iTunesArtwork@2x.png" \
              >/dev/null

          fi

      # ==========================================================
      # PATCH AUTO BOOT
      # ==========================================================

      - name: Patch iDOS to launch real MK1
        run: |
          set -e

          EMU="dospad/dospad/Main/DOSPadEmulator.m"

          if [ ! -f "$EMU" ]; then
            echo "ERROR: DOSPadEmulator.m not found"
            exit 1
          fi

          python3 - "$EMU" <<'PY'
          import sys

          path = sys.argv[1]

          data = open(
              path,
              encoding="utf-8"
          ).read()

          marker = '[self.commandList addObject:@"REM END AUTOMOUNT"];'

          if marker not in data:
              raise SystemExit(
                  "ERROR: iDOS automount marker not found"
              )

          if "MK REMASTERED AUTOBOOT" in data:
              print("Already patched")
              raise SystemExit(0)

          patch = marker + r'''

              // ==================================================
              // MK REMASTERED AUTOBOOT
              // Copy bundled MK1 files into DOS C: on first run
              // and boot the REAL MK1.EXE.
              // ==================================================

              {
                  DPDrive *cDrive =
                      [self.package findDrive:'C'];

                  if (cDrive)
                  {
                      NSFileManager *fm =
                          [NSFileManager defaultManager];

                      NSString *cPath =
                          cDrive.sourceUrl.path;

                      NSString *exePath =
                          [cPath
                           stringByAppendingPathComponent:
                           @"MK1.EXE"];

                      if (![fm fileExistsAtPath:exePath])
                      {
                          NSString *bundleGame =
                              [[[NSBundle mainBundle]
                                bundlePath]
                               stringByAppendingPathComponent:
                               @"MK1"];

                          BOOL isDir = NO;

                          if ([fm
                               fileExistsAtPath:bundleGame
                               isDirectory:&isDir]
                              && isDir)
                          {
                              NSError *listError = nil;

                              NSArray *items =
                                  [fm
                                   contentsOfDirectoryAtPath:
                                   bundleGame
                                   error:&listError];

                              for (NSString *name in items)
                              {
                                  NSString *source =
                                      [bundleGame
                                       stringByAppendingPathComponent:
                                       name];

                                  NSString *destination =
                                      [cPath
                                       stringByAppendingPathComponent:
                                       name];

                                  if (![fm
                                        fileExistsAtPath:
                                        destination])
                                  {
                                      NSError *copyError = nil;

                                      [fm
                                       copyItemAtPath:source
                                       toPath:destination
                                       error:&copyError];
                                  }
                              }
                          }
                      }

                      if ([fm fileExistsAtPath:exePath])
                      {
                          [self.commandList
                           addObject:@"C:"];

                          [self.commandList
                           addObject:@"MK1.EXE"];
                      }
                  }
              }

              // ===== END MK REMASTERED AUTOBOOT =====
          '''

          data = data.replace(
              marker,
              patch,
              1
          )

          open(
              path,
              "w",
              encoding="utf-8"
          ).write(data)

          print(
              "MK1 autoboot patch installed"
          )
          PY

      # ==========================================================
      # OPTIMIZE DOSBOX CONFIG
      # ==========================================================

      - name: Configure DOSBox for MK1
        run: |
          set -e

          CFG="dospad/Resources/configs/dospad.cfg"

          if [ -f "$CFG" ]; then

            python3 - "$CFG" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          data = open(
              path,
              encoding="utf-8",
              errors="ignore"
          ).read()

          # Sound
          if "[mixer]" not in data:

              data = data.replace(
                  "[sblaster]",
                  """[mixer]
          nosound=false
          rate=44100

          [sblaster]""",
                  1
              )

          if "[sblaster]" in data:

              if "sbtype=" not in data:

                  data = data.replace(
                      "[sblaster]",
                      """[sblaster]
          sbtype=sb16
          oplmode=auto""",
                      1
                  )

          # DOSBox machine/memory
          if "[dosbox]" in data:

              section = data.split(
                  "[dosbox]",
                  1
              )[1]

              if "memsize=" not in section.split(
                  "[",
                  1
              )[0]:

                  data = data.replace(
                      "[dosbox]",
                      """[dosbox]
          machine=svga_s3
          memsize=16""",
                      1
                  )

          open(
              path,
              "w",
              encoding="utf-8"
          ).write(data)

          print(
              "DOSBox config prepared"
          )
          PY

          fi

      # ==========================================================
      # UNSIGNED DEVICE BUILD
      # ==========================================================

      - name: Build real iDOS app
        run: |
          set -e
          set -o pipefail

          xattr -cr dospad || true

          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -scheme iDOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | tee xcodebuild.log

      # ==========================================================
      # FIND APP
      # ==========================================================

      - name: Find built iDOS app
        run: |
          set -e

          echo "===== BUILT APPS ====="

          find build \
            -type d \
            -name "*.app" \
            -print

          APP=$(
            find build/Build/Products \
              -type d \
              -name "iDOS.app" \
              | head -1
          )

          if [ -z "$APP" ]; then

            echo "ERROR:"
            echo "iDOS.app not found"

            exit 1
          fi

          echo "$APP" > app-path.txt

          echo "APP:"
          echo "$APP"

      # ==========================================================
      # BUNDLE THE REAL MK1
      # ==========================================================

      - name: Put real MK1 inside app
        run: |
          set -e

          APP="$(cat app-path.txt)"

          echo "Copying REAL game files..."

          rm -rf "$APP/MK1"

          mkdir -p "$APP/MK1"

          cp -R \
            mk1-game/. \
            "$APP/MK1/"

          echo "===== GAME INSIDE APP ====="

          ls -lh "$APP/MK1/MK1.EXE"

          echo
          echo "MK1 files in IPA:"

          find "$APP/MK1" \
            -type f \
            | wc -l

      # ==========================================================
      # PACKAGE IPA
      # ==========================================================

      - name: Create IPA
        run: |
          set -e

          APP="$(cat app-path.txt)"

          rm -rf Payload

          mkdir Payload

          cp -R \
            "$APP" \
            Payload/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            output/MK-Remastered-Trilogy-REAL-MK1.ipa

          echo
          echo "===== IPA ====="

          ls -lh \
            output/MK-Remastered-Trilogy-REAL-MK1.ipa

      # ==========================================================
      # DEBUG INFO
      # ==========================================================

      - name: Create build info
        if: always()
        run: |
          {
            echo "MK REMASTERED TRILOGY"
            echo
            echo "BUILD = REAL MK1 CLASSIC"
            echo
            echo "Expected boot:"
            echo "App -> DOSBox -> MK1.EXE"
            echo
            echo "MK1 data:"
            if [ -f mk1-game/MK1.EXE ]; then
              echo "MK1.EXE = FOUND"
            else
              echo "MK1.EXE = NOT FOUND"
            fi
            echo
            echo "Game files:"
            find mk1-game -type f 2>/dev/null | wc -l || true
          } > output/build-info.txt

      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MK-Remastered-Trilogy-REAL-MK1
          path: |
            output/MK-Remastered-Trilogy-REAL-MK1.ipa
            output/build-info.txt
          compression-level: 0

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MK1-Build-Failure-Log
          path: |
            xcodebuild.log
            mk1-path.txt
          if-no-files-found: ignore
