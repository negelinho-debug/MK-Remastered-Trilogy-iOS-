          - (void)mkToggleFX
          {
              BOOL enabled =
                  [[NSUserDefaults
                    standardUserDefaults]
                   boolForKey:@"MKEnhanced"];

              [[NSUserDefaults
                standardUserDefaults]
               setBool:!enabled
               forKey:@"MKEnhanced"];

              [[NSUserDefaults
                standardUserDefaults]
               synchronize];

              [self mkApplyCRT];
          }


          - (void)mkApplyCRT
          {
              if (!_rootContainer)
                  return;


              UIView *old =
                  [_rootContainer
                   viewWithTag:8999];

              [old removeFromSuperview];


              BOOL enabled =
                  [[NSUserDefaults
                    standardUserDefaults]
                   boolForKey:@"MKEnhanced"];


              if (!enabled)
              {
                  self.screenView.layer
                      .magnificationFilter =
                      kCAFilterNearest;

                  return;
              }


              self.screenView.layer
                  .magnificationFilter =
                  kCAFilterLinear;


              CGRect screenRect =
                  [self.screenView
                   convertRect:
                   self.screenView.bounds
                   toView:_rootContainer];


              UIView *overlay =
                  [[UIView alloc]
                   initWithFrame:
                   screenRect];

              overlay.tag = 8999;

              overlay.userInteractionEnabled =
                  NO;

              overlay.clipsToBounds =
                  YES;


              CGFloat width =
                  CGRectGetWidth(
                      overlay.bounds
                  );

              CGFloat height =
                  CGRectGetHeight(
                      overlay.bounds
                  );


              for (CGFloat y = 1;
                   y < height;
                   y += 4)
              {
                  UIView *line =
                      [[UIView alloc]
                       initWithFrame:
                       CGRectMake(
                           0,
                           y,
                           width,
                           1
                       )];

                  line.backgroundColor =
                      [UIColor
                       colorWithWhite:0
                       alpha:0.14];

                  [overlay
                   addSubview:line];
              }


              CAGradientLayer *vignette =
                  [CAGradientLayer layer];

              vignette.frame =
                  overlay.bounds;

              vignette.colors = @[
                  (id)[UIColor
                       colorWithWhite:0
                       alpha:0.03].CGColor,

                  (id)[UIColor
                       colorWithRed:0.10
                       green:0.01
                       blue:0.01
                       alpha:0.015].CGColor,

                  (id)[UIColor
                       colorWithWhite:0
                       alpha:0.12].CGColor
              ];

              vignette.locations =
                  @[
                    @0,
                    @0.52,
                    @1
                  ];

              [overlay.layer
               insertSublayer:
               vignette
               atIndex:0];


              [_rootContainer
               addSubview:overlay];


              for (UIView *v
                   in _rootContainer.subviews)
              {
                  if ([v.accessibilityIdentifier
                       isEqualToString:
                       @"MKCONTROL"])
                  {
                      [_rootContainer
                       bringSubviewToFront:v];
                  }
              }
          }

          // ===== END MKTRILOGY_TOUCH_CONTROLS =====

          '''

          text = text.replace(
              marker,
              methods + marker,
              1
          )


          layout_old = '''
          	_rootContainer = [self createSceneView:_currentScene frame:viewRect];
          	[self.view addSubview:_rootContainer];
          	[self updateScreen];
          }
          '''

          layout_new = '''
          	_rootContainer = [self createSceneView:_currentScene frame:viewRect];
          	[self.view addSubview:_rootContainer];
          	[self updateScreen];

              [self mkInstallControls];
              [self mkApplyCRT];
          }
          '''

          if layout_old not in text:

              layout_old = (
                  '\t_rootContainer = '
                  '[self createSceneView:_currentScene frame:viewRect];\n'
                  '\t[self.view addSubview:_rootContainer];\n'
                  '\t[self updateScreen];\n'
                  '}'
              )

              layout_new = (
                  '\t_rootContainer = '
                  '[self createSceneView:_currentScene frame:viewRect];\n'
                  '\t[self.view addSubview:_rootContainer];\n'
                  '\t[self updateScreen];\n'
                  '\n'
                  '    [self mkInstallControls];\n'
                  '    [self mkApplyCRT];\n'
                  '}'
              )


          if layout_old not in text:

              raise SystemExit(
                  "ERROR: LAYOUT PATCH MARKER NOT FOUND"
              )


          text = text.replace(
              layout_old,
              layout_new,
              1
          )


          emulator_old = '''
