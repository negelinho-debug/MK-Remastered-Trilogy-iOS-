      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build original MK1 engine
        run: |
          set +e
          set -o pipefail

          xattr -cr dospad || true


          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -scheme iDOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.mk1original.remastered" \
            build \
            2>&1 \
            | tee output/xcodebuild.log


          STATUS=${PIPESTATUS[0]}


          echo
          echo "========================================"
          echo "COMPILER ERRORS"
          echo "========================================"


          grep -n \
            -E "error:|fatal error:" \
            output/xcodebuild.log \
            | tail -150 || true


          echo
          echo "BUILD STATUS=$STATUS"


          if [ "$STATUS" -ne 0 ]; then

            exit "$STATUS"

          fi

      # ==========================================================
