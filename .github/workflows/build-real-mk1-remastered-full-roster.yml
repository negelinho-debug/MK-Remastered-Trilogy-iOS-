          cat > MK1Remastered/Sources/FightScene.swift <<'EOF'
          import SpriteKit
          import UIKit

          final class FightScene: SKScene {
              let player: FighterID
              let cpu: FighterID
              let controller: GameController
              let state: GameState

              private var playerNode = SKSpriteNode()
              private var cpuNode = SKSpriteNode()
              private var playerIdle: [SKTexture] = []
              private var playerAttack: [SKTexture] = []
              private var cpuIdle: [SKTexture] = []
              private var cpuAttack: [SKTexture] = []

              private var lastUpdate: TimeInterval = 0
              private var timerAccum: TimeInterval = 0
              private var aiCooldown: TimeInterval = 1.0
              private var pausedByUser = false
              private var jumping = false

              private var lastJump = 0
              private var lastLP = 0
              private var lastHP = 0
              private var lastHK = 0
              private var lastLK = 0
              private var lastPause = 0

              private var playerScale: CGFloat = 1
              private var cpuScale: CGFloat = 1
              private let groundY: CGFloat = -155

              init(size: CGSize, player: FighterID, cpu: FighterID, controller: GameController, state: GameState) {
                  self.player = player
                  self.cpu = cpu
                  self.controller = controller
                  self.state = state
                  super.init(size: size)
              }

              required init?(coder aDecoder: NSCoder) {
                  fatalError("init(coder:) has not been implemented")
              }

              override func didMove(to view: SKView) {
                  anchorPoint = CGPoint(x: 0.5, y: 0.5)
                  backgroundColor = .black
                  makeBackdrop()
                  loadFighters()
                  makeFighters()
              }

              private func makeBackdrop() {
                  if let texture = AssetStore.stageTexture() {
                      let stage = SKSpriteNode(texture: texture)
                      stage.position = .zero
                      stage.zPosition = -100
                      let tw = max(texture.size().width, 1)
                      let th = max(texture.size().height, 1)
                      let scale = max(size.width / tw, size.height / th)
                      stage.setScale(scale)
                      stage.alpha = 0.68
                      addChild(stage)
                  }

                  let shade = SKSpriteNode(color: SKColor.black.withAlphaComponent(0.28), size: size)
                  shade.position = .zero
                  shade.zPosition = -90
                  addChild(shade)

                  let floor = SKShapeNode(rectOf: CGSize(width: size.width * 1.3, height: 100))
                  floor.fillColor = SKColor(red: 0.11, green: 0.025, blue: 0.025, alpha: 0.88)
                  floor.strokeColor = SKColor(red: 0.55, green: 0.07, blue: 0.05, alpha: 0.7)
                  floor.position = CGPoint(x: 0, y: -250)
                  floor.zPosition = -50
                  addChild(floor)
              }

              private func loadFighters() {
                  playerIdle = AssetStore.textures(prefix: "\(player.rawValue)_idle")
                  playerAttack = AssetStore.textures(prefix: "\(player.rawValue)_attack")
                  cpuIdle = AssetStore.textures(prefix: "\(cpu.rawValue)_idle")
                  cpuAttack = AssetStore.textures(prefix: "\(cpu.rawValue)_attack")

                  guard !playerIdle.isEmpty, !playerAttack.isEmpty, !cpuIdle.isEmpty, !cpuAttack.isEmpty else {
                      fatalError("REAL FIGHTER ASSETS MISSING")
                  }
              }

              private func scaleFor(texture: SKTexture) -> CGFloat {
                  let h = max(texture.size().height, 1)
                  return min(2.0, max(0.45, 280.0 / h))
              }

              private func applyTint(_ fighter: FighterID, node: SKSpriteNode) {
                  if let tint = fighter.tint {
                      node.color = tint
                      node.colorBlendFactor = 0.28
                  } else {
                      node.colorBlendFactor = 0
                  }
              }

              private func makeFighters() {
                  playerNode = SKSpriteNode(texture: playerIdle[0])
                  cpuNode = SKSpriteNode(texture: cpuIdle[0])
                  playerScale = scaleFor(texture: playerIdle[0])
                  cpuScale = scaleFor(texture: cpuIdle[0])
                  playerNode.setScale(playerScale)
                  cpuNode.setScale(cpuScale)
                  playerNode.position = CGPoint(x: -235, y: groundY)
                  cpuNode.position = CGPoint(x: 235, y: groundY)
                  playerNode.zPosition = 10
                  cpuNode.zPosition = 10
                  applyTint(player, node: playerNode)
                  applyTint(cpu, node: cpuNode)
                  addChild(playerNode)
                  addChild(cpuNode)
                  idle(node: playerNode, textures: playerIdle)
                  idle(node: cpuNode, textures: cpuIdle)
              }

              private func idle(node: SKSpriteNode, textures: [SKTexture]) {
                  node.removeAction(forKey: "idle")
                  guard !textures.isEmpty else { return }
                  node.run(
                      SKAction.repeatForever(SKAction.animate(with: textures, timePerFrame: 0.095, resize: false, restore: true)),
                      withKey: "idle"
                  )
              }

              private func attack(node: SKSpriteNode, textures: [SKTexture], idleTextures: [SKTexture], hit: @escaping () -> Void) {
                  if node.action(forKey: "attack") != nil { return }
                  node.removeAction(forKey: "idle")
                  let anim = SKAction.animate(with: textures, timePerFrame: 0.055, resize: false, restore: false)
                  let impact = SKAction.run(hit)
                  let end = SKAction.run { [weak self, weak node] in
                      guard let self, let node else { return }
                      node.removeAction(forKey: "attack")
                      self.idle(node: node, textures: idleTextures)
                  }
                  node.run(SKAction.sequence([anim, impact, end]), withKey: "attack")
              }

              override func update(_ currentTime: TimeInterval) {
                  let dt = lastUpdate == 0 ? 0 : min(currentTime - lastUpdate, 0.05)
                  lastUpdate = currentTime

                  if controller.pauseToken != lastPause {
                      lastPause = controller.pauseToken
                      pausedByUser.toggle()
                      state.message = pausedByUser ? "PAUSED" : "FIGHT!"
                  }

                  if pausedByUser || state.playerHP <= 0 || state.cpuHP <= 0 || state.timer <= 0 { return }

                  handleTimer(dt)
                  handlePlayer(dt)
                  handleAttacks()
                  handleAI(dt)
                  clampPositions()
                  checkEnd()
              }

              private func handleTimer(_ dt: TimeInterval) {
                  timerAccum += dt
                  if timerAccum >= 1.0 {
                      timerAccum -= 1.0
                      state.timer = max(0, state.timer - 1)
                  }
              }

              private func handlePlayer(_ dt: TimeInterval) {
                  let speed: CGFloat = 210
                  if controller.leftHeld { playerNode.position.x -= speed * CGFloat(dt) }
                  if controller.rightHeld { playerNode.position.x += speed * CGFloat(dt) }

                  if controller.crouchHeld && !jumping {
                      playerNode.yScale = playerScale * 0.78
                      playerNode.position.y = groundY - 18
                  } else if !jumping {
                      playerNode.yScale = playerScale
                      playerNode.position.y = groundY
                  }

                  if controller.jumpToken != lastJump {
                      lastJump = controller.jumpToken
                      jump()
                  }
              }

              private func jump() {
                  if jumping { return }
                  jumping = true
                  playerNode.yScale = playerScale
                  let up = SKAction.moveBy(x: 0, y: 175, duration: 0.22)
                  up.timingMode = .easeOut
                  let down = SKAction.moveBy(x: 0, y: -175, duration: 0.28)
                  down.timingMode = .easeIn
                  playerNode.run(SKAction.sequence([up, down, SKAction.run { [weak self] in
                      guard let self else { return }
                      self.jumping = false
                      self.playerNode.position.y = self.groundY
                  }]), withKey: "jump")
              }

              private func handleAttacks() {
                  if controller.lpToken != lastLP {
                      lastLP = controller.lpToken
                      playerAttack(damage: 5)
                  }
                  if controller.hpToken != lastHP {
                      lastHP = controller.hpToken
                      playerAttack(damage: 8)
                  }
                  if controller.hkToken != lastHK {
                      lastHK = controller.hkToken
                      playerAttack(damage: 10)
                  }
                  if controller.lkToken != lastLK {
                      lastLK = controller.lkToken
                      playerAttack(damage: 7)
                  }
              }

              private func playerAttack(damage: Int) {
                  attack(node: playerNode, textures: playerAttack, idleTextures: playerIdle) { [weak self] in
                      guard let self else { return }
                      if abs(self.playerNode.position.x - self.cpuNode.position.x) < 185 {
                          self.state.cpuHP = max(0, self.state.cpuHP - damage)
                      }
                  }
              }

              private func handleAI(_ dt: TimeInterval) {
                  aiCooldown -= dt
                  let distance = playerNode.position.x - cpuNode.position.x
                  if abs(distance) > 145 {
                      cpuNode.position.x += (distance > 0 ? 1 : -1) * 82 * CGFloat(dt)
                  } else if aiCooldown <= 0 {
                      aiCooldown = Double.random(in: 0.85...1.45)
                      attack(node: cpuNode, textures: cpuAttack, idleTextures: cpuIdle) { [weak self] in
                          guard let self else { return }
                          if abs(self.playerNode.position.x - self.cpuNode.position.x) < 185 {
                              let damage = self.controller.blockHeld ? 2 : 7
                              self.state.playerHP = max(0, self.state.playerHP - damage)
                          }
                      }
                  }
              }

              private func clampPositions() {
                  playerNode.position.x = min(max(playerNode.position.x, -475), 475)
                  cpuNode.position.x = min(max(cpuNode.position.x, -475), 475)
              }

              private func checkEnd() {
                  if state.cpuHP <= 0 {
                      state.message = "\(player.displayName) WINS"
                  } else if state.playerHP <= 0 {
                      state.message = "\(cpu.displayName) WINS"
                  } else if state.timer <= 0 {
                      state.message = state.playerHP >= state.cpuHP ? "\(player.displayName) WINS" : "\(cpu.displayName) WINS"
                  }
              }
          }
          EOF

