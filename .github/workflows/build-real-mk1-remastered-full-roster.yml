name: Build REAL MK1 Remastered Full Roster

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e
          brew install innoextract p7zip xcodegen
          python3 -m pip install --break-system-packages pillow pypng apng || \
          python3 -m pip install --user pillow pypng apng
          xcodebuild -version
          xcodegen --version
          innoextract --version

      - name: Prepare folders
        run: |
          set -e
          rm -rf raw-installers installers release-files extracted mk1-source viewer-tools
          rm -rf exported-assets MK1Remastered build Payload output
          mkdir -p raw-installers installers release-files extracted mk1-source viewer-tools
          mkdir -p exported-assets output

      - name: Collect installers from repository
        run: |
          set -e
          COUNT=0
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            COUNT=$((COUNT + 1))
            echo "FOUND REPO INSTALLER: $FILE"
            cp "$FILE" "raw-installers/repo_${COUNT}.exe"
          done < <(
            find . -type f -iname "*.exe" \
              -not -path "./.git/*" \
              -not -path "./raw-installers/*" \
              -not -path "./installers/*" \
              -not -path "./release-files/*" \
              -not -path "./extracted/*" \
              -not -path "./mk1-source/*" \
              -not -path "./viewer-tools/*" \
              -not -path "./exported-assets/*" \
              -not -path "./MK1Remastered/*" \
              -not -path "./build/*" \
              -not -path "./Payload/*" \
              -not -path "./output/*" | sort
          )
          ls -lh raw-installers || true

      - name: Download installers from latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release download --dir release-files --pattern "*.exe"
          N=0
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            N=$((N + 1))
            echo "FOUND RELEASE INSTALLER: $FILE"
            cp "$FILE" "raw-installers/release_${N}.exe"
          done < <(find release-files -type f -iname "*.exe" | sort)
          ls -lh raw-installers || true
          exit 0

      - name: Deduplicate installers
        run: |
          set -e
          FOUND=0
          for FILE in raw-installers/*.exe; do
            [ -f "$FILE" ] || continue
            FOUND=1
            HASH=$(shasum -a 256 "$FILE" | awk '{print $1}')
            DEST="installers/${HASH}.exe"
            [ -f "$DEST" ] || cp "$FILE" "$DEST"
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: NO INSTALLERS FOUND"
            exit 1
          fi
          ls -lh installers

      - name: Extract installers
        run: |
          set -e
          INDEX=0
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            INDEX=$((INDEX + 1))
            DEST="extracted/pkg${INDEX}"
            mkdir -p "$DEST"
            echo "EXTRACTING: $FILE"
            set +e
            innoextract --extract --output-dir "$DEST" "$FILE"
            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              7z x "$FILE" "-o$DEST" -y
            fi
            set -e
          done < <(find installers -type f -iname "*.exe" | sort)
          find extracted -type f -iname "MK1.EXE" -print || true

      - name: Normalize MK1 source
        run: |
          set -e
          MK1_EXE=$(find extracted -type f -iname "MK1.EXE" -not -path "*/__support/*" | head -1)
          echo "MK1_EXE=$MK1_EXE"
          if [ -z "$MK1_EXE" ]; then
            echo "ERROR: REAL MK1.EXE NOT FOUND"
            exit 1
          fi
          MK1_DIR="$(dirname "$MK1_EXE")"
          rm -rf mk1-source
          mkdir -p mk1-source
          cp -R "$MK1_DIR"/. mk1-source/
          echo "$MK1_EXE" > output/mk1-exe.txt
          echo "$MK1_DIR" > output/mk1-dir.txt
          find mk1-source -maxdepth 2 -type f | sort | head -300

      - name: Validate full roster source files
        run: |
          set -e
          REQUIRED=(
            "mk1-source/MK1.EXE"
            "mk1-source/GRAPHICS/VANDAN.GRA"
            "mk1-source/GRAPHICS/JCATT.GRA"
            "mk1-source/GRAPHICS/KANO.GRA"
            "mk1-source/GRAPHICS/KATT.GRA"
            "mk1-source/GRAPHICS/KANG.GRA"
            "mk1-source/GRAPHICS/LKATT.GRA"
            "mk1-source/GRAPHICS/RAIDEN.GRA"
            "mk1-source/GRAPHICS/RDATT.GRA"
            "mk1-source/GRAPHICS/NINJA.GRA"
            "mk1-source/GRAPHICS/SCATT.GRA"
            "mk1-source/GRAPHICS/SZATT.GRA"
            "mk1-source/GRAPHICS/SOATT.GRA"
            "mk1-source/GRAPHICS/LIZ.GRA"
          )
          for FILE in "${REQUIRED[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: REQUIRED FILE MISSING: $FILE"
              exit 1
            fi
          done
          echo "FULL ROSTER SOURCE VALID"

      - name: Clone ReWolf GRA tools
        run: |
          set -e
          git clone --depth 1 https://github.com/rwfpl/rewolf-mortal-kombat-viewer.git viewer-tools/viewer
          git clone --depth 1 https://github.com/rwfpl/rewolf-mortal-kombat.git viewer-tools/cgra
          test -f viewer-tools/viewer/grafile.py
          test -f viewer-tools/cgra/parse.py

      - name: Export all real MK1 fighters including Reptile
        run: |
          set -e
          python3 <<'PY'
          import json
          import shutil
          import subprocess
          import sys
          import tempfile
          from collections import Counter
          from pathlib import Path

          from PIL import Image

          ROOT = Path.cwd()
          SRC = ROOT / "mk1-source"
          OUT = ROOT / "exported-assets"
          APPRES = ROOT / "MK1Remastered" / "AppResources"
          VIEWER = ROOT / "viewer-tools" / "viewer"
          CGRA = ROOT / "viewer-tools" / "cgra"

          OUT.mkdir(parents=True, exist_ok=True)
          APPRES.mkdir(parents=True, exist_ok=True)
          sys.path.insert(0, str(VIEWER))

          import mkexec
          import grafile
          import graph_util

          mk = mkexec.MkExec(str(SRC / "MK1.EXE"))
          if not getattr(mk, "exec_data", None):
              raise SystemExit("ERROR: FAILED TO LOAD MK1.EXE")

          def safe_name(name):
              return "".join(ch for ch in name if ch.isalnum())

          def choose_palette(sprites):
              need = max(max(1, getattr(s, "number_of_colors", 1)) for s in sprites)
              palettes = mk.GetSuitablePalettes(need)
              if not palettes:
                  return None
              keys = sorted(palettes.keys())
              return palettes[keys[0]]

          def rgba_from_ugra(sprite, palette):
              prepared = graph_util.PreparePalette(palette.colors)
              data = bytearray()
              for idx in sprite.data:
                  if idx <= 0 or idx >= len(prepared):
                      data.extend((0, 0, 0, 0))
                  else:
                      c = prepared[idx].tuple()
                      data.extend((c[0], c[1], c[2], 255))
              return Image.frombytes("RGBA", (sprite.width, sprite.height), bytes(data))

          def crop_and_scale(image, scale=3):
              image = image.convert("RGBA")
              bbox = image.getbbox()
              if bbox:
                  image = image.crop(bbox)
              if image.width <= 0 or image.height <= 0:
                  return None
              if scale != 1:
                  image = image.resize(
                      (image.width * scale, image.height * scale),
                      Image.Resampling.NEAREST
                  )
              return image

          def remove_border_background(image):
              image = image.convert("RGBA")
              px = image.load()
              w, h = image.size
              border = []
              for x in range(w):
                  border.append(px[x, 0][:3])
                  border.append(px[x, h - 1][:3])
              for y in range(h):
                  border.append(px[0, y][:3])
                  border.append(px[w - 1, y][:3])
              if not border:
                  return image
              bg = Counter(border).most_common(1)[0][0]
              br, bgc, bb = bg
              for y in range(h):
                  for x in range(w):
                      r, g, b, a = px[x, y]
                      if abs(r - br) + abs(g - bgc) + abs(b - bb) <= 12:
                          px[x, y] = (r, g, b, 0)
              return image

          def export_ugra(gra_path, max_frames=36):
              try:
                  gra = grafile.GraFile(mk, str(gra_path))
                  sprites = sorted(gra.sprites.values(), key=lambda s: s.offset)
              except Exception as exc:
                  print("uGRA exception", gra_path.name, exc)
                  return []
              if not sprites:
                  return []
              palette = choose_palette(sprites)
              if palette is None:
                  return []
              images = []
              for sprite in sprites[:max_frames]:
                  try:
                      img = rgba_from_ugra(sprite, palette)
                      img = crop_and_scale(img, 3)
                      if img is not None and img.width >= 6 and img.height >= 6:
                          images.append(img)
                  except Exception as exc:
                      print("sprite export exception", gra_path.name, exc)
              return images

          def export_cgra(gra_path, max_frames=36):
              with tempfile.TemporaryDirectory() as td:
                  cmd = [
                      sys.executable,
                      str(CGRA / "parse.py"),
                      str(gra_path),
                      "--apng", "false",
                      "--png", "true",
                      "--raw", "false",
                      "--outdir", td,
                  ]
                  result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  print(result.stdout)
                  pngs = sorted(Path(td).glob("*.png"))
                  if not pngs:
                      return []
                  images = []
                  for file in pngs[:max_frames]:
                      try:
                          img = Image.open(file).convert("RGBA")
                          img = remove_border_background(img)
                          img = crop_and_scale(img, 3)
                          if img is not None and img.width >= 6 and img.height >= 6:
                              images.append(img)
                      except Exception as exc:
                          print("cGRA image exception", gra_path.name, exc)
                  return images

          def export_any(filename, max_frames=36):
              gra_path = SRC / "GRAPHICS" / filename
              if not gra_path.exists():
                  return [], None
              print("TRY", filename, "AS uGRA")
              images = export_ugra(gra_path, max_frames)
              if images:
                  print(filename, "=> uGRA", len(images))
                  return images, "uGRA"
              print("TRY", filename, "AS cGRA")
              images = export_cgra(gra_path, max_frames)
              if images:
                  print(filename, "=> cGRA", len(images))
                  return images, "cGRA"
              print(filename, "=> NO FRAMES")
              return [], None

          def write_images(fighter, kind, images):
              prefix = f"{safe_name(fighter)}_{kind}"
              written = []
              for i, img in enumerate(images):
                  name = f"{prefix}_{i:03d}.png"
                  out_file = APPRES / name
                  img.save(out_file)
                  written.append(name)
              return written

          def first_success(candidates, max_frames=36):
              for name in candidates:
                  images, fmt = export_any(name, max_frames)
                  if images:
                      return images, name, fmt
              return [], None, None

          roster = {
              "JohnnyCage": {
                  "display": "JOHNNY CAGE",
                  "idle": ["VANDAN.GRA", "JCATT.GRA"],
                  "attack": ["JCATT.GRA"],
                  "tint": "none",
              },
              "Kano": {
                  "display": "KANO",
                  "idle": ["KANO.GRA", "KATT.GRA"],
                  "attack": ["KATT.GRA"],
                  "tint": "none",
              },
              "LiuKang": {
                  "display": "LIU KANG",
                  "idle": ["KANG.GRA", "LKATT.GRA"],
                  "attack": ["LKATT.GRA"],
                  "tint": "none",
              },
              "Raiden": {
                  "display": "RAIDEN",
                  "idle": ["RAIDEN.GRA", "RDATT.GRA"],
                  "attack": ["RDATT.GRA"],
                  "tint": "none",
              },
              "Scorpion": {
                  "display": "SCORPION",
                  "idle": ["NINJA.GRA", "SCATT.GRA"],
                  "attack": ["SCATT.GRA"],
                  "tint": "yellow",
              },
              "SubZero": {
                  "display": "SUB-ZERO",
                  "idle": ["NINJA.GRA", "SZATT.GRA"],
                  "attack": ["SZATT.GRA"],
                  "tint": "blue",
              },
              "Sonya": {
                  "display": "SONYA BLADE",
                  "idle": ["SOATT.GRA", "STANCE.GRA"],
                  "attack": ["SOATT.GRA"],
                  "tint": "none",
              },
              "Reptile": {
                  "display": "REPTILE",
                  "idle": ["LIZ.GRA", "NINJA.GRA"],
                  "attack": ["SCATT.GRA", "SZATT.GRA"],
                  "tint": "green",
              },
          }

          manifest = {"fighters": {}, "stage": {}}

          for fighter, spec in roster.items():
              print("\n==============================")
              print("EXPORT", fighter)
              print("==============================")

              idle_images, idle_source, idle_format = first_success(spec["idle"], 30)
              attack_images, attack_source, attack_format = first_success(spec["attack"], 24)

              if not idle_images and attack_images:
                  idle_images = [img.copy() for img in attack_images[:min(12, len(attack_images))]]
                  idle_source = attack_source
                  idle_format = attack_format

              if not attack_images and idle_images:
                  attack_images = [img.copy() for img in idle_images[:min(12, len(idle_images))]]
                  attack_source = idle_source
                  attack_format = idle_format

              if not idle_images or not attack_images:
                  raise SystemExit(f"ERROR: NO REAL FRAMES FOR {fighter}")

              idle_files = write_images(fighter, "idle", idle_images)
              attack_files = write_images(fighter, "attack", attack_images)

              manifest["fighters"][fighter] = {
                  "display": spec["display"],
                  "tint": spec["tint"],
                  "idle_source": idle_source,
                  "idle_format": idle_format,
                  "idle_frames": len(idle_files),
                  "attack_source": attack_source,
                  "attack_format": attack_format,
                  "attack_frames": len(attack_files),
              }

          stage_candidates = [
              "T1HDRS.GRA",
              "T2HDRS.GRA",
              "S1HDRS.GRA",
              "S2HDRS.GRA",
              "ORE1HDRS.GRA",
              "NG1HDRS.GRA",
              "NG2HDRS.GRA",
              "MPHDRS.GRA",
              "MKTITLE1.GRA",
              "MISC.GRA",
          ]

          best = None
          best_area = 0
          best_source = None
          best_fmt = None

          for candidate in stage_candidates:
              images, fmt = export_any(candidate, 10)
              for img in images:
                  area = img.width * img.height
                  if area > best_area:
                      best = img.copy()
                      best_area = area
                      best_source = candidate
                      best_fmt = fmt

          if best is None:
              raise SystemExit("ERROR: NO REAL MK1 BACKDROP EXPORTED")

          best.save(APPRES / "stage_real_000.png")
          manifest["stage"] = {
              "source": best_source,
              "format": best_fmt,
              "width": best.width,
              "height": best.height,
          }

          (OUT / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          (APPRES / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")

          print("\n===== FULL ROSTER MANIFEST =====")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Validate exported roster
        run: |
          set -e
          for FIGHTER in JohnnyCage Kano LiuKang Raiden Scorpion SubZero Sonya Reptile; do
            IDLE=$(find MK1Remastered/AppResources -type f -name "${FIGHTER}_idle_*.png" | wc -l | tr -d ' ')
            ATTACK=$(find MK1Remastered/AppResources -type f -name "${FIGHTER}_attack_*.png" | wc -l | tr -d ' ')
            echo "$FIGHTER idle=$IDLE attack=$ATTACK"
            if [ "$IDLE" -lt 1 ] || [ "$ATTACK" -lt 1 ]; then
              echo "ERROR: MISSING REAL FRAMES FOR $FIGHTER"
              exit 1
            fi
          done
          test -f MK1Remastered/AppResources/stage_real_000.png
          cp exported-assets/manifest.json output/ASSET-MANIFEST.json

      - name: Create app folders
        run: |
          set -e
          mkdir -p MK1Remastered/Sources
          mkdir -p MK1Remastered/Assets.xcassets/AppIcon.appiconset

      - name: Generate app icon
        run: |
          set -e
          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json
          import os

          icon_dir = "MK1Remastered/Assets.xcassets/AppIcon.appiconset"
          os.makedirs(icon_dir, exist_ok=True)
          entries = [
              ("iphone", "20x20", "2x", 40, "Icon20-2.png"),
              ("iphone", "20x20", "3x", 60, "Icon20-3.png"),
              ("iphone", "29x29", "2x", 58, "Icon29-2.png"),
              ("iphone", "29x29", "3x", 87, "Icon29-3.png"),
              ("iphone", "40x40", "2x", 80, "Icon40-2.png"),
              ("iphone", "40x40", "3x", 120, "Icon40-3.png"),
              ("iphone", "60x60", "2x", 120, "Icon60-2.png"),
              ("iphone", "60x60", "3x", 180, "Icon60-3.png"),
              ("ios-marketing", "1024x1024", "1x", 1024, "Icon1024.png"),
          ]

          def font(size):
              for p in [
                  "/System/Library/Fonts/Supplemental/Arial Bold.ttf",
                  "/System/Library/Fonts/Supplemental/Arial.ttf",
              ]:
                  if os.path.exists(p):
                      return ImageFont.truetype(p, size)
              return ImageFont.load_default()

          def make(px, output):
              img = Image.new("RGB", (px, px), (7, 7, 10))
              d = ImageDraw.Draw(img)
              for y in range(px):
                  t = y / max(px - 1, 1)
                  r = int(120 * (1 - t) + 10 * t)
                  d.line((0, y, px, y), fill=(r, 5, 8))
              m = int(px * 0.09)
              d.ellipse((m, m, px-m, px-m), fill=(10,10,14), outline=(235,45,38), width=max(2,int(px*0.025)))
              f1 = font(max(12, int(px * 0.22)))
              f2 = font(max(8, int(px * 0.055)))
              for text, yy, ff, fill in [
                  ("MK1", 0.36, f1, (250,250,250)),
                  ("REMASTERED", 0.66, f2, (250,75,65)),
              ]:
                  box = d.textbbox((0,0), text, font=ff)
                  w = box[2]-box[0]
                  h = box[3]-box[1]
                  d.text(((px-w)/2, px*yy-h/2), text, font=ff, fill=fill)
              img.save(output, "PNG")

          images = []
          for idiom, size, scale, pixels, filename in entries:
              make(pixels, os.path.join(icon_dir, filename))
              images.append({"idiom": idiom, "size": size, "scale": scale, "filename": filename})

          with open(os.path.join(icon_dir, "Contents.json"), "w", encoding="utf-8") as f:
              json.dump({"images": images, "info": {"author":"xcode", "version":1}}, f, indent=2)
          PY

      - name: Create XcodeGen project
        run: |
          set -e
          cat > MK1Remastered/project.yml <<'EOF'
          name: MK1Remastered
          options:
            deploymentTarget:
              iOS: "15.0"
            createIntermediateGroups: true
          settings:
            base:
              SWIFT_VERSION: 5.0
              PRODUCT_BUNDLE_IDENTIFIER: com.zhenya.mk1remastered.fullroster
              CURRENT_PROJECT_VERSION: 1
              MARKETING_VERSION: 0.2
              TARGETED_DEVICE_FAMILY: 1
          targets:
            MK1Remastered:
              type: application
              platform: iOS
              sources:
                - path: Sources
              resources:
                - path: AppResources
                - path: Assets.xcassets
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: MK1 Remastered
                  UILaunchScreen: {}
                  UIRequiresFullScreen: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
              settings:
                base:
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  PRODUCT_NAME: MK1Remastered
                  INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
          EOF

      - name: Create Swift sources
        run: |
          set -e

          cat > MK1Remastered/Sources/FighterID.swift <<'EOF'
          import SwiftUI
          import SpriteKit

          enum FighterID: String, CaseIterable, Identifiable {
              case johnnyCage = "JohnnyCage"
              case kano = "Kano"
              case liuKang = "LiuKang"
              case raiden = "Raiden"
              case scorpion = "Scorpion"
              case subZero = "SubZero"
              case sonya = "Sonya"
              case reptile = "Reptile"

              var id: String { rawValue }

              var displayName: String {
                  switch self {
                  case .johnnyCage: return "JOHNNY CAGE"
                  case .kano: return "KANO"
                  case .liuKang: return "LIU KANG"
                  case .raiden: return "RAIDEN"
                  case .scorpion: return "SCORPION"
                  case .subZero: return "SUB-ZERO"
                  case .sonya: return "SONYA BLADE"
                  case .reptile: return "REPTILE"
                  }
              }

              var tint: SKColor? {
                  switch self {
                  case .scorpion: return SKColor(red: 1.0, green: 0.78, blue: 0.08, alpha: 1)
                  case .subZero: return SKColor(red: 0.15, green: 0.45, blue: 1.0, alpha: 1)
                  case .reptile: return SKColor(red: 0.12, green: 0.9, blue: 0.25, alpha: 1)
                  default: return nil
                  }
              }

              var isSecret: Bool { self == .reptile }
          }
          EOF

          cat > MK1Remastered/Sources/AssetStore.swift <<'EOF'
          import Foundation
          import UIKit
          import SpriteKit

          enum AssetStore {
              static func urls(prefix: String) -> [URL] {
                  let urls = Bundle.main.urls(forResourcesWithExtension: "png", subdirectory: nil) ?? []
                  return urls
                      .filter { $0.lastPathComponent.hasPrefix(prefix + "_") }
                      .sorted { $0.lastPathComponent < $1.lastPathComponent }
              }

              static func image(prefix: String) -> UIImage? {
                  guard let url = urls(prefix: prefix).first,
                        let data = try? Data(contentsOf: url) else { return nil }
                  return UIImage(data: data)
              }

              static func textures(prefix: String, linear: Bool = true) -> [SKTexture] {
                  return urls(prefix: prefix).compactMap { url in
                      guard let data = try? Data(contentsOf: url),
                            let image = UIImage(data: data) else { return nil }
                      let texture = SKTexture(image: image)
                      texture.filteringMode = linear ? .linear : .nearest
                      return texture
                  }
              }

              static func stageTexture() -> SKTexture? {
                  guard let url = Bundle.main.url(forResource: "stage_real_000", withExtension: "png"),
                        let data = try? Data(contentsOf: url),
                        let image = UIImage(data: data) else { return nil }
                  let texture = SKTexture(image: image)
                  texture.filteringMode = .linear
                  return texture
              }
          }
          EOF

          cat > MK1Remastered/Sources/GameController.swift <<'EOF'
          import Foundation

          final class GameController: ObservableObject {
              @Published var leftHeld = false
              @Published var rightHeld = false
              @Published var crouchHeld = false
              @Published var blockHeld = false
              @Published var jumpToken = 0
              @Published var lpToken = 0
              @Published var hpToken = 0
              @Published var hkToken = 0
              @Published var lkToken = 0
              @Published var pauseToken = 0

              func jump() { jumpToken += 1 }
              func lp() { lpToken += 1 }
              func hp() { hpToken += 1 }
              func hk() { hkToken += 1 }
              func lk() { lkToken += 1 }
              func pause() { pauseToken += 1 }
          }
          EOF

          cat > MK1Remastered/Sources/GameState.swift <<'EOF'
          import Foundation

          final class GameState: ObservableObject {
              @Published var playerHP = 100
              @Published var cpuHP = 100
              @Published var timer = 99
