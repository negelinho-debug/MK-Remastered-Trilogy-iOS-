      # ==========================================================
      # ICON
      # ==========================================================

      - name: Generate MK Trilogy icon
        run: |
          set -e

          python3 <<'PY'
          from PIL import Image
          from PIL import ImageDraw
          from PIL import ImageFont

          import glob
          import json
          import os


          sets = glob.glob(
              "dospad/Resources/"
              "Assets.xcassets/"
              "*.appiconset"
          )


          if not sets:

              raise SystemExit(
                  "APP ICON SET NOT FOUND"
              )


          appicon = sets[0]

          print(
              "Using icon set:",
              appicon
          )


          for old in glob.glob(
              os.path.join(
                  appicon,
                  "*.png"
              )
          ):
              os.remove(old)


          entries = [

              (
                  "iphone",
                  "20x20",
                  "2x",
                  40,
                  "Icon20-2.png"
              ),

              (
                  "iphone",
                  "20x20",
                  "3x",
                  60,
                  "Icon20-3.png"
              ),

              (
                  "iphone",
                  "29x29",
                  "2x",
                  58,
                  "Icon29-2.png"
              ),

              (
                  "iphone",
                  "29x29",
                  "3x",
                  87,
                  "Icon29-3.png"
              ),

              (
                  "iphone",
                  "40x40",
                  "2x",
                  80,
                  "Icon40-2.png"
              ),

              (
                  "iphone",
                  "40x40",
                  "3x",
                  120,
                  "Icon40-3.png"
              ),

              (
                  "iphone",
                  "60x60",
                  "2x",
                  120,
                  "Icon60-2.png"
              ),

              (
                  "iphone",
                  "60x60",
                  "3x",
                  180,
                  "Icon60-3.png"
              ),

              (
                  "ios-marketing",
                  "1024x1024",
                  "1x",
                  1024,
                  "Icon1024.png"
              )
          ]


          def get_font(size):

              options = [

                  "/System/Library/Fonts/"
                  "Supplemental/"
                  "Arial Bold.ttf",

                  "/System/Library/Fonts/"
                  "Supplemental/"
                  "Arial.ttf"
              ]


              for font_path in options:

                  if os.path.exists(
                      font_path
                  ):

                      return (
                          ImageFont.truetype(
                              font_path,
                              size
                          )
                      )


              return (
                  ImageFont.load_default()
              )


          def create(px, filename):

              img = Image.new(
                  "RGB",
                  (px, px),
                  (7, 7, 9)
              )


              draw = ImageDraw.Draw(
                  img
              )


              for y in range(px):

                  t = (
                      y /
                      max(
                          px - 1,
                          1
                      )
                  )

                  red = int(
                      110 *
                      (1 - t)
                      +
                      15 *
                      t
                  )

                  green = int(
                      5 *
                      (1 - t)
                      +
                      2 *
                      t
                  )

                  blue = int(
                      8 *
                      (1 - t)
                      +
                      5 *
                      t
                  )


                  draw.line(
                      (
                          0,
                          y,
                          px,
                          y
                      ),
                      fill=(
                          red,
                          green,
                          blue
                      )
                  )


              margin = int(
                  px * 0.10
              )


              draw.ellipse(
                  (
                      margin,
                      margin,
                      px - margin,
                      px - margin
                  ),
                  fill=(
                      8,
                      8,
                      11
                  ),
                  outline=(
                      230,
                      40,
                      35
                  ),
                  width=max(
                      2,
                      int(
                          px * 0.025
                      )
                  )
              )


              big_font = get_font(
                  max(
                      12,
                      int(
                          px * 0.31
                      )
                  )
              )


              small_font = get_font(
                  max(
                      8,
                      int(
                          px * 0.075
                      )
                  )
              )


              text = "MK"


              bbox = draw.textbbox(
                  (
                      0,
                      0
                  ),
                  text,
                  font=big_font
              )


              tw = (
                  bbox[2] -
                  bbox[0]
              )

              th = (
                  bbox[3] -
                  bbox[1]
              )


              draw.text(
                  (
                      (
                          px -
                          tw
                      ) / 2,
                      px * 0.39 -
                      th / 2
                  ),
                  text,
                  font=big_font,
                  fill=(
                      250,
                      250,
                      250
                  )
              )


              sub = "TRILOGY"


              bbox = draw.textbbox(
                  (
                      0,
                      0
                  ),
                  sub,
                  font=small_font
              )


              sw = (
                  bbox[2] -
                  bbox[0]
              )


              draw.text(
                  (
                      (
                          px -
                          sw
                      ) / 2,
                      px * 0.68
                  ),
                  sub,
                  font=small_font,
                  fill=(
                      245,
                      75,
                      70
                  )
              )


              img.save(
                  filename,
                  "PNG"
              )


          images = []


          for (
              idiom,
              size,
              scale,
              pixels,
              filename
          ) in entries:

              full = os.path.join(
                  appicon,
                  filename
              )


              create(
                  pixels,
                  full
              )


              images.append({

                  "idiom":
                      idiom,

                  "size":
                      size,

                  "scale":
                      scale,

                  "filename":
                      filename

              })


          contents = {

              "images":
                  images,

              "info": {

                  "author":
                      "xcode",

                  "version":
                      1

              }

          }


          with open(
              os.path.join(
                  appicon,
                  "Contents.json"
              ),
              "w"
          ) as f:

              json.dump(
                  contents,
                  f,
                  indent=2
              )


          print(
              "MK icon generated"
          )

          PY

