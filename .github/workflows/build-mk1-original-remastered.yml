name: Build MK1 ORIGINAL Remastered

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        run: |
          set -e

          brew install innoextract p7zip

          python3 -m pip install \
            --break-system-packages pillow || \
          python3 -m pip install \
            --user pillow

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== INNOEXTRACT ====="
          innoextract --version

      # ==========================================================
      # PREPARE
      # ==========================================================

      - name: Prepare folders
        run: |
          set -e

          rm -rf raw-installers
          rm -rf installers
          rm -rf release-files
          rm -rf extracted
          rm -rf game
          rm -rf dospad
          rm -rf build
          rm -rf Payload
          rm -rf output

          mkdir -p raw-installers
          mkdir -p installers
          mkdir -p release-files
          mkdir -p extracted
          mkdir -p game
          mkdir -p output

      # ==========================================================
      # FIND INSTALLERS IN REPOSITORY
      # ==========================================================

      - name: Collect repository installers
        run: |
          set -e

          COUNT=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            COUNT=$((COUNT + 1))

            echo "FOUND:"
            echo "$FILE"

            cp "$FILE" \
              "raw-installers/repo_${COUNT}.exe"

          done < <(
            find . \
              -type f \
              -iname "*.exe" \
              -not -path "./.git/*" \
              -not -path "./raw-installers/*" \
              -not -path "./installers/*" \
              -not -path "./release-files/*" \
              -not -path "./extracted/*" \
              -not -path "./game/*" \
              -not -path "./dospad/*" \
              -not -path "./build/*" \
              -not -path "./Payload/*" \
              -not -path "./output/*" \
              | sort
          )

          echo
          echo "===== REPOSITORY INSTALLERS ====="

          ls -lh raw-installers || true

      # ==========================================================
      # RELEASE ASSETS
      # ==========================================================

      - name: Download latest Release installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          TAG=$(
            gh release list \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName'
          )

          echo "LATEST TAG=$TAG"

          if [ -n "$TAG" ]; then

            gh release download "$TAG" \
              --dir release-files \
              --pattern "*.exe"

          fi

          INDEX=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            INDEX=$((INDEX + 1))

            cp "$FILE" \
              "raw-installers/release_${INDEX}.exe"

          done < <(
            find release-files \
              -type f \
              -iname "*.exe" \
              | sort
          )

          echo
          echo "===== ALL RAW INSTALLERS ====="

          ls -lh raw-installers || true

          exit 0

      # ==========================================================
      # DEDUPLICATE
      # ==========================================================

      - name: Deduplicate installers
        run: |
          set -e

          FOUND=0

          for FILE in raw-installers/*.exe; do

            [ -f "$FILE" ] || continue

            FOUND=1

            HASH=$(
              shasum -a 256 "$FILE" \
              | awk '{print $1}'
            )

            DEST="installers/${HASH}.exe"

            if [ ! -f "$DEST" ]; then

              cp "$FILE" "$DEST"

            fi

          done

          if [ "$FOUND" -eq 0 ]; then

            echo "ERROR: NO INSTALLERS FOUND"

            exit 1

          fi

          echo
          echo "===== UNIQUE INSTALLERS ====="

          ls -lh installers

      # ==========================================================
      # EXTRACT
      # ==========================================================

      - name: Extract installers
        run: |
          set -e

          INDEX=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            INDEX=$((INDEX + 1))

            DEST="extracted/pkg${INDEX}"

            mkdir -p "$DEST"

            echo
            echo "========================================"
            echo "EXTRACTING:"
            echo "$FILE"
            echo "========================================"

            set +e

            innoextract \
              --extract \
              --output-dir "$DEST" \
              "$FILE"

            STATUS=$?

            if [ "$STATUS" -ne 0 ]; then

              echo "Trying 7z..."

              7z x \
                "$FILE" \
                "-o$DEST" \
                -y

            fi

            set -e

          done < <(
            find installers \
              -type f \
              -iname "*.exe" \
              | sort
          )

          echo
          echo "===== MK1.EXE RESULTS ====="

          find extracted \
            -type f \
            -iname "MK1.EXE" \
            -print || true

      # ==========================================================
      # NORMALIZE REAL MK1
      # ==========================================================

      - name: Normalize real MK1
        run: |
          set -e

          MK1_EXE=$(
            find extracted \
              -type f \
              -iname "MK1.EXE" \
              -not -path "*/__support/*" \
              | head -1
          )

          echo "MK1_EXE=$MK1_EXE"

          if [ -z "$MK1_EXE" ]; then

            echo "ERROR: REAL MK1.EXE NOT FOUND"

            exit 1

          fi

          MK1_DIR="$(dirname "$MK1_EXE")"

          echo "MK1_DIR=$MK1_DIR"

          rm -rf game/MK1

          mkdir -p game/MK1

          cp -R \
            "$MK1_DIR"/. \
            game/MK1/

          if [ ! -f "game/MK1/MK1.EXE" ]; then

            echo "ERROR: MK1.EXE MISSING AFTER COPY"

            exit 1

          fi

          echo
          echo "===== MK1 FILE COUNT ====="

          find game/MK1 \
            -type f \
            | wc -l

          echo
          echo "===== GRAPHICS ====="

          find game/MK1 \
            -type f \
            -iname "*.GRA" \
            | head -60

      # ==========================================================
      # CLONE IDOS
      # ==========================================================

      - name: Clone iDOS
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/litchie/dospad.git \
            dospad

          echo
          echo "===== PROJECT ====="

          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -list

      # ==========================================================
      # CREATE CLASSIC + REMASTER CONFIGS
      # ==========================================================

      - name: Create Classic and Remastered configs
        run: |
          set -e

          BASE="dospad/Resources/configs/dospad.cfg"

          if [ ! -f "$BASE" ]; then

            echo "ERROR: BASE DOSPAD CONFIG NOT FOUND"

            exit 1

          fi

          cp "$BASE" \
            game/MK1/CLASSIC.CFG

          cp "$BASE" \
            game/MK1/REMASTER.CFG

          python3 <<'PY'
          from pathlib import Path
          import re

          configs = {
              "game/MK1/CLASSIC.CFG": {
                  "frameskip": "0",
                  "core": "dynamic",
                  "cycles": "max 95%",
                  "scaler": "normal2x"
              },

              "game/MK1/REMASTER.CFG": {
                  "frameskip": "0",
                  "core": "dynamic",
                  "cycles": "max 95%",
                  "scaler": "hq2x"
              }
          }

          def set_option(text, key, value):
              pattern = rf"(?m)^{re.escape(key)}\s*=.*$"

              if re.search(pattern, text):
                  return re.sub(
                      pattern,
                      f"{key}={value}",
                      text
                  )

              section = "[render]"

              if key in ("frameskip", "scaler") and section in text:
                  return text.replace(
                      section,
                      section + f"\n{key}={value}",
                      1
                  )

              section = "[cpu]"

              if key in ("core", "cycles") and section in text:
                  return text.replace(
                      section,
                      section + f"\n{key}={value}",
                      1
                  )

              return text + f"\n{key}={value}\n"

          for filename, options in configs.items():

              path = Path(filename)

              text = path.read_text(
                  errors="ignore"
              )

              for key, value in options.items():

                  text = set_option(
                      text,
                      key,
                      value
                  )

              path.write_text(
                  text
              )

          print("CLASSIC AND REMASTER CONFIGS READY")
          PY

          echo
          echo "===== CLASSIC ====="

          grep -E \
            "frameskip=|core=|cycles=|scaler=" \
            game/MK1/CLASSIC.CFG || true

          echo
          echo "===== REMASTER ====="

          grep -E \
            "frameskip=|core=|cycles=|scaler=" \
            game/MK1/REMASTER.CFG || true

      # ==========================================================
      # AUTOBOOT
      # ==========================================================

      - name: Create MK1 auto boot
        run: |
          set -e

          cat > game/MK1/MKAUTO.TXT <<'EOF'
          MK1.EXE
          EOF

          cp \
            game/MK1/CLASSIC.CFG \
            game/MK1/dospad.cfg

          echo "===== AUTOBOOT ====="

          cat game/MK1/MKAUTO.TXT

      # ==========================================================
      # PATCH AUTOBOOT INTO IDOS
      # ==========================================================

      - name: Patch real MK1 autoboot
        run: |
          set -e

          FILE="dospad/dospad/Main/DOSPadEmulator.m"

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:
              text = file.read()

          if "MK1_REAL_AUTOBOOT" in text:
              print("AUTOBOOT ALREADY PATCHED")
              raise SystemExit(0)

          marker = '[self.commandList addObject:@"REM END AUTOMOUNT"];'

          if marker not in text:
              raise SystemExit(
                  "ERROR: AUTOBOOT MARKER NOT FOUND"
              )

          patch = marker + r'''

              // ==================================================
              // MK1_REAL_AUTOBOOT
              // ==================================================

              NSString *mkBootPath =
                  [self.workingDirectory.path
                   stringByAppendingPathComponent:
                   @"MKAUTO.TXT"];

              if ([[NSFileManager defaultManager]
                   fileExistsAtPath:mkBootPath])
              {
                  NSError *mkError = nil;

                  NSString *mkText =
                      [NSString
                       stringWithContentsOfFile:
                       mkBootPath
                       encoding:
                       NSUTF8StringEncoding
                       error:
                       &mkError];

                  if (mkText.length > 0)
                  {
                      NSArray *mkLines =
                          [mkText
                           componentsSeparatedByCharactersInSet:
                           [NSCharacterSet
                            newlineCharacterSet]];

                      for (NSString *mkRaw in mkLines)
                      {
                          NSString *mkLine =
                              [mkRaw
                               stringByTrimmingCharactersInSet:
                               [NSCharacterSet
                                whitespaceAndNewlineCharacterSet]];

                          if (mkLine.length > 0)
                          {
                              [self.commandList
                               addObject:
                               mkLine];
                          }
                      }
                  }
              }

              // ===== END MK1_REAL_AUTOBOOT =====
          '''

          text = text.replace(
              marker,
              patch,
              1
          )

          with open(
              path,
              "w",
              encoding="utf-8"
          ) as file:
              file.write(text)

          print("REAL MK1 AUTOBOOT PATCHED")
          PY

      # ==========================================================
      # MAIN MENU
      # CLASSIC / REMASTERED
      # ==========================================================

      - name: Add original MK1 launcher
        run: |
          set -e

          FILE="dospad/dospad/Main/DPAppDelegate.m"

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:
              text = file.read()

          if "MK1_ORIGINAL_LAUNCHER" in text:
              print("LAUNCHER ALREADY PATCHED")
              raise SystemExit(0)

          import_marker = '#import <AVFoundation/AVFoundation.h>'

          if import_marker not in text:
              raise SystemExit(
                  "ERROR: AVFOUNDATION IMPORT MARKER NOT FOUND"
              )

          launcher = r'''

          // ======================================================
          // MK1_ORIGINAL_LAUNCHER
          // ======================================================

          @interface DPAppDelegate (MK1Original)

          - (void)mkShowOriginalLauncher;
          - (void)mkLaunchOriginalMode:(NSString *)mode;

          @end


          @interface MK1OriginalLauncherController
              : UIViewController

          @property(nonatomic, weak)
          DPAppDelegate *owner;

          @property(nonatomic, strong)
          UILabel *titleLabel;

          @property(nonatomic, strong)
          UILabel *subtitleLabel;

          @property(nonatomic, strong)
          UIButton *classicButton;

          @property(nonatomic, strong)
          UIButton *remasterButton;

          @end


          @implementation MK1OriginalLauncherController


          - (UIButton *)mkButton:
              (NSString *)title
          {
              UIButton *button =
                  [UIButton
                   buttonWithType:
                   UIButtonTypeSystem];

              [button
               setTitle:
               title
               forState:
               UIControlStateNormal];

              [button
               setTitleColor:
               UIColor.whiteColor
               forState:
               UIControlStateNormal];

              button.titleLabel.font =
                  [UIFont
                   systemFontOfSize:
                   22
                   weight:
                   UIFontWeightBlack];

              button.backgroundColor =
                  [UIColor
                   colorWithRed:
                   0.34
                   green:
                   0.018
                   blue:
                   0.022
                   alpha:
                   1.0];

              button.layer.cornerRadius =
                  14;

              button.layer.borderWidth =
                  1;

              button.layer.borderColor =
                  [UIColor
                   colorWithWhite:
                   1.0
                   alpha:
                   0.18].CGColor;

              return button;
          }


          - (void)viewDidLoad
          {
              [super viewDidLoad];

              self.view.backgroundColor =
                  [UIColor
                   colorWithRed:
                   0.015
                   green:
                   0.006
                   blue:
                   0.008
                   alpha:
                   1.0];


              self.titleLabel =
                  [[UILabel alloc] init];

              self.titleLabel.text =
                  @"MORTAL KOMBAT";

              self.titleLabel.textAlignment =
                  NSTextAlignmentCenter;

              self.titleLabel.textColor =
                  UIColor.whiteColor;

              self.titleLabel.font =
                  [UIFont
                   systemFontOfSize:
                   42
                   weight:
                   UIFontWeightBlack];

              [self.view
               addSubview:
               self.titleLabel];


              self.subtitleLabel =
                  [[UILabel alloc] init];

              self.subtitleLabel.text =
                  @"ORIGINAL • REMASTERED";

              self.subtitleLabel.textAlignment =
                  NSTextAlignmentCenter;

              self.subtitleLabel.textColor =
                  [UIColor
                   colorWithRed:
                   1.0
                   green:
                   0.18
                   blue:
                   0.15
                   alpha:
                   1.0];

              self.subtitleLabel.font =
                  [UIFont
                   systemFontOfSize:
                   17
                   weight:
                   UIFontWeightBlack];

              [self.view
               addSubview:
               self.subtitleLabel];


              self.classicButton =
                  [self
                   mkButton:
                   @"CLASSIC"];

              self.classicButton.tag =
                  1;

              [self.classicButton
               addTarget:
               self
               action:
               @selector(modePressed:)
               forControlEvents:
               UIControlEventTouchUpInside];

              [self.view
               addSubview:
               self.classicButton];


              self.remasterButton =
                  [self
                   mkButton:
                   @"REMASTERED"];

              self.remasterButton.tag =
                  2;

              [self.remasterButton
               addTarget:
               self
               action:
               @selector(modePressed:)
               forControlEvents:
               UIControlEventTouchUpInside];

              [self.view
               addSubview:
               self.remasterButton];


              UILabel *info =
                  [[UILabel alloc] init];

              info.tag =
                  9955;

              info.text =
                  @"ORIGINAL MK1 ENGINE";

              info.textAlignment =
                  NSTextAlignmentCenter;

              info.textColor =
                  [UIColor
                   colorWithWhite:
                   0.58
                   alpha:
                   1.0];

              info.font =
                  [UIFont
                   systemFontOfSize:
                   12
                   weight:
                   UIFontWeightBold];

              [self.view
               addSubview:
               info];
          }


          - (void)modePressed:
              (UIButton *)sender
          {
              self.classicButton.enabled =
                  NO;

              self.remasterButton.enabled =
                  NO;

              NSString *mode =
                  sender.tag == 2
                  ? @"REMASTERED"
                  : @"CLASSIC";

              self.subtitleLabel.text =
                  @"LOADING ORIGINAL MK1...";

              [self.owner
               mkLaunchOriginalMode:
               mode];
          }


          - (void)viewDidLayoutSubviews
          {
              [super viewDidLayoutSubviews];

              CGFloat width =
                  CGRectGetWidth(
                      self.view.bounds
                  );

              CGFloat height =
                  CGRectGetHeight(
                      self.view.bounds
                  );


              self.titleLabel.frame =
                  CGRectMake(
                      0,
                      height * 0.18,
                      width,
                      55
                  );


              self.subtitleLabel.frame =
                  CGRectMake(
                      0,
                      height * 0.18 + 55,
                      width,
                      30
                  );


              CGFloat buttonWidth =
                  MIN(
                      370,
                      width - 80
                  );

              CGFloat x =
                  (width - buttonWidth) / 2;


              self.classicButton.frame =
                  CGRectMake(
                      x,
                      height * 0.46,
                      buttonWidth,
                      58
                  );


              self.remasterButton.frame =
                  CGRectMake(
                      x,
                      height * 0.46 + 74,
                      buttonWidth,
                      58
                  );


              UILabel *info =
                  (UILabel *)
                  [self.view
                   viewWithTag:
                   9955];

              info.frame =
                  CGRectMake(
                      0,
                      height - 48,
                      width,
                      20
                  );
          }


          - (BOOL)prefersStatusBarHidden
          {
              return YES;
          }


          - (UIInterfaceOrientationMask)
              supportedInterfaceOrientations
          {
              return
                  UIInterfaceOrientationMaskLandscape;
          }


          @end

          // ===== END MK1_ORIGINAL_LAUNCHER =====

          '''

          text = text.replace(
              import_marker,
              import_marker + "\n" + launcher,
              1
          )

          old_start = (
              '[self performSelector:'
              '@selector(startDOS) '
              'withObject:nil '
              'afterDelay:1];'
          )

          new_start = (
              '[self performSelector:'
              '@selector(mkShowOriginalLauncher) '
              'withObject:nil '
              'afterDelay:0.25];'
          )

          if old_start not in text:
              raise SystemExit(
                  "ERROR: STARTDOS MARKER NOT FOUND"
              )

          text = text.replace(
              old_start,
              new_start,
              1
          )

          method_marker = (
              '-(void)setWindowTitle:(char *)title'
          )

          if method_marker not in text:
              raise SystemExit(
                  "ERROR: METHOD MARKER NOT FOUND"
              )

          methods = r'''

          // ======================================================
          // MK1 ORIGINAL LAUNCH METHODS
          // ======================================================

          - (void)mkShowOriginalLauncher
          {
              if ([DOSPadEmulator
                   sharedInstance].started)
              {
                  return;
              }

              MK1OriginalLauncherController *launcher =
                  [[MK1OriginalLauncherController
                    alloc] init];

              launcher.owner =
                  self;

              launcher.modalPresentationStyle =
                  UIModalPresentationFullScreen;

              [self.emulatorController
               presentViewController:
               launcher
               animated:
               NO
               completion:
               nil];
          }


          - (void)mkLaunchOriginalMode:
              (NSString *)mode
          {
              NSFileManager *fm =
                  [NSFileManager
                   defaultManager];


              NSString *bundleGame =
                  [[[NSBundle
                     mainBundle]
                    bundlePath]
                   stringByAppendingPathComponent:
                   @"MKGame"];


              NSString *documents =
                  [NSSearchPathForDirectoriesInDomains(
                      NSDocumentDirectory,
                      NSUserDomainMask,
                      YES
                   ) lastObject];


              NSString *destination =
                  [documents
                   stringByAppendingPathComponent:
                   @"MK1Original"];


              NSString *exe =
                  [destination
                   stringByAppendingPathComponent:
                   @"MK1.EXE"];


              if (![fm
                    fileExistsAtPath:
                    exe])
              {
                  [fm
                   removeItemAtPath:
                   destination
                   error:
                   nil];


                  NSError *copyError =
                      nil;


                  BOOL result =
                      [fm
                       copyItemAtPath:
                       bundleGame
                       toPath:
                       destination
                       error:
                       &copyError];


                  if (!result)
                  {
                      NSLog(
                          @"MK COPY ERROR: %@",
                          copyError
                      );

                      return;
                  }
              }


              NSString *configName =
                  [mode
                   isEqualToString:
                   @"REMASTERED"]
                  ? @"REMASTER.CFG"
                  : @"CLASSIC.CFG";


              NSString *sourceConfig =
                  [destination
                   stringByAppendingPathComponent:
                   configName];


              NSString *activeConfig =
                  [destination
                   stringByAppendingPathComponent:
                   @"dospad.cfg"];


              if ([fm
                   fileExistsAtPath:
                   activeConfig])
              {
                  [fm
                   removeItemAtPath:
                   activeConfig
                   error:
                   nil];
              }


              NSError *configError =
                  nil;


              [fm
               copyItemAtPath:
               sourceConfig
               toPath:
               activeConfig
               error:
               &configError];


              [[NSUserDefaults
                standardUserDefaults]
               setObject:
               mode
               forKey:
               @"MKRenderMode"];


              [[NSUserDefaults
                standardUserDefaults]
               synchronize];


              [DOSPadEmulator
               sharedInstance]
                  .workingDirectory =
                  [NSURL
                   fileURLWithPath:
                   destination
                   isDirectory:
                   YES];


              UIViewController *launcher =
                  self.emulatorController
                  .presentedViewController;


              [launcher
               dismissViewControllerAnimated:
               NO
               completion:^{

                  [self startDOS];

               }];
          }

          // ===== END MK1 ORIGINAL LAUNCH METHODS =====

          '''

          text = text.replace(
              method_marker,
              methods + method_marker,
              1
          )

          with open(
              path,
              "w",
              encoding="utf-8"
          ) as file:
              file.write(text)

          print("ORIGINAL MK1 LAUNCHER PATCHED")
          PY

      # ==========================================================
      # TOUCH CONTROLS + REMASTER DISPLAY
      # ==========================================================

      - name: Add MK1 touch controls and remaster renderer
        run: |
          set -e

          FILE="dospad/dospad/Main/DPEmulatorViewController.m"

          python3 - "$FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as file:
              text = file.read()

          if '#import <QuartzCore/QuartzCore.h>' not in text:

              marker = '#import <UIKit/UIKit.h>'

              if marker not in text:
                  raise SystemExit(
                      "ERROR: UIKIT IMPORT NOT FOUND"
                  )

              text = text.replace(
                  marker,
                  marker +
                  '\n#import <QuartzCore/QuartzCore.h>',
                  1
              )

          if "MK1_ORIGINAL_TOUCH" in text:

              print("TOUCH ALREADY PATCHED")

              raise SystemExit(0)

          marker = '// MARK: DPGamepadDelegate'

          if marker not in text:
              raise SystemExit(
                  "ERROR: DPGamepadDelegate MARKER NOT FOUND"
              )

          methods = r'''

          // ======================================================
          // MK1_ORIGINAL_TOUCH
          // ======================================================

          - (UIButton *)mkRealButton:
              (NSString *)title
              frame:(CGRect)frame
              key:(NSInteger)key
          {
              UIButton *button =
                  [UIButton
                   buttonWithType:
                   UIButtonTypeSystem];

              button.frame =
                  frame;

              button.tag =
                  key;

              button.accessibilityIdentifier =
                  @"MK1_REAL_CONTROL";

              [button
               setTitle:
               title
               forState:
               UIControlStateNormal];

              [button
               setTitleColor:
               UIColor.whiteColor
               forState:
               UIControlStateNormal];

              button.titleLabel.font =
                  [UIFont
                   systemFontOfSize:
                   14
                   weight:
                   UIFontWeightBlack];

              button.backgroundColor =
                  [UIColor
                   colorWithWhite:
                   0.0
                   alpha:
                   0.48];

              button.layer.cornerRadius =
                  14;

              button.layer.borderWidth =
                  1;

              button.layer.borderColor =
                  [UIColor
                   colorWithWhite:
                   1.0
                   alpha:
                   0.30].CGColor;

              [button
               addTarget:
               self
               action:
               @selector(mkRealDown:)
               forControlEvents:
               UIControlEventTouchDown];

              [button
               addTarget:
               self
               action:
               @selector(mkRealUp:)
               forControlEvents:
               UIControlEventTouchUpInside];

              [button
               addTarget:
               self
               action:
               @selector(mkRealUp:)
               forControlEvents:
               UIControlEventTouchUpOutside];

              [button
               addTarget:
               self
               action:
               @selector(mkRealUp:)
               forControlEvents:
               UIControlEventTouchCancel];

              return button;
          }


          - (void)mkRealDown:
              (UIButton *)button
          {
              [[DOSPadEmulator
                sharedInstance]
               sendKey:
               (int)button.tag
               pressed:
               YES];
          }


          - (void)mkRealUp:
              (UIButton *)button
          {
              [[DOSPadEmulator
                sharedInstance]
               sendKey:
               (int)button.tag
               pressed:
               NO];
          }


          - (void)mkRemoveRealControls
          {
              NSArray *views =
                  [_rootContainer.subviews
                   copy];

              for (UIView *view in views)
              {
                  if ([view.accessibilityIdentifier
                       isEqualToString:
                       @"MK1_REAL_CONTROL"])
                  {
                      [view
                       removeFromSuperview];
                  }
              }
          }


          - (void)mkApplyOriginalRenderMode
          {
              if (!_rootContainer)
                  return;

              NSString *mode =
                  [[NSUserDefaults
                    standardUserDefaults]
                   stringForKey:
                   @"MKRenderMode"];

              BOOL remastered =
                  [mode
                   isEqualToString:
                   @"REMASTERED"];


              self.screenView.layer.magnificationFilter =
                  remastered
                  ? kCAFilterLinear
                  : kCAFilterNearest;


              self.screenView.layer.minificationFilter =
                  remastered
                  ? kCAFilterLinear
                  : kCAFilterNearest;


              self.screenView.layer.contentsScale =
                  [UIScreen
                   mainScreen].scale;


              UIView *oldLabel =
                  [_rootContainer
                   viewWithTag:
                   8844];

              [oldLabel
               removeFromSuperview];


              UILabel *label =
                  [[UILabel alloc]
                   initWithFrame:
                   CGRectMake(
                       CGRectGetWidth(
                           _rootContainer.bounds
                       ) / 2 - 72,
                       7,
                       144,
                       28
                   )];


              label.tag =
                  8844;


              label.text =
                  remastered
                  ? @"REMASTERED"
                  : @"CLASSIC";


              label.textAlignment =
                  NSTextAlignmentCenter;


              label.textColor =
                  UIColor.whiteColor;


              label.font =
                  [UIFont
                   systemFontOfSize:
                   11
                   weight:
                   UIFontWeightBlack];


              label.backgroundColor =
                  [UIColor
                   colorWithWhite:
                   0.0
                   alpha:
                   0.38];


              label.layer.cornerRadius =
                  10;


              label.clipsToBounds =
                  YES;


              label.userInteractionEnabled =
                  NO;


              [_rootContainer
               addSubview:
               label];
          }


