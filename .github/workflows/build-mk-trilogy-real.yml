name: Build REAL MK Remastered Trilogy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        run: |
          set -e

          brew install innoextract p7zip

          python3 -m pip install \
            --break-system-packages pillow || \
          python3 -m pip install \
            --user pillow

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== INNOEXTRACT ====="
          innoextract --version

      # ==========================================================
      # CLEAN
      # ==========================================================

      - name: Prepare folders
        run: |
          set -e

          rm -rf raw-installers
          rm -rf installers
          rm -rf release-files
          rm -rf extracted
          rm -rf games
          rm -rf dospad
          rm -rf build
          rm -rf Payload
          rm -rf output

          mkdir -p raw-installers
          mkdir -p installers
          mkdir -p release-files
          mkdir -p extracted
          mkdir -p games/mk1
          mkdir -p games/mk2
          mkdir -p games/mk3
          mkdir -p output

      # ==========================================================
      # INSTALLERS FROM REPOSITORY
      # ==========================================================

      - name: Collect installers from repository
        run: |
          set -e

          COUNT=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            COUNT=$((COUNT + 1))

            echo "FOUND:"
            echo "$FILE"

            cp "$FILE" \
              "raw-installers/repo_${COUNT}.exe"

          done < <(
            find . \
              -type f \
              -iname "*.exe" \
              -not -path "./.git/*" \
              -not -path "./raw-installers/*" \
              -not -path "./installers/*" \
              -not -path "./release-files/*" \
              -not -path "./extracted/*" \
              -not -path "./games/*" \
              -not -path "./dospad/*" \
              | sort
          )

          echo
          echo "===== REPOSITORY INSTALLERS ====="

          ls -lh raw-installers || true

      # ==========================================================
      # INSTALLERS FROM RELEASE
      # ==========================================================

      - name: Download installers from latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          echo "===== RELEASE LIST ====="

          gh release list

          TAG=$(
            gh release list \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName'
          )

          echo "LATEST TAG:"
          echo "$TAG"

          if [ -n "$TAG" ]; then

            gh release download "$TAG" \
              --dir release-files \
              --pattern "*.exe"

          fi

          N=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            N=$((N + 1))

            cp "$FILE" \
              "raw-installers/release_${N}.exe"

          done < <(
            find release-files \
              -type f \
              -iname "*.exe" \
              | sort
          )

          echo
          echo "===== ALL RAW INSTALLERS ====="

          ls -lh raw-installers

          exit 0

      # ==========================================================
      # DEDUPLICATE
      # ==========================================================

      - name: Deduplicate installers
        run: |
          set -e

          for FILE in raw-installers/*.exe; do

            [ -f "$FILE" ] || continue

            HASH=$(
              shasum -a 256 "$FILE" \
                | awk '{print $1}'
            )

            DEST="installers/${HASH}.exe"

            if [ ! -f "$DEST" ]; then

              cp "$FILE" "$DEST"

            fi

          done

          echo
          echo "===== UNIQUE INSTALLERS ====="

          ls -lh installers

          COUNT=$(
            find installers \
              -type f \
              -iname "*.exe" \
              | wc -l \
              | tr -d ' '
          )

          echo "COUNT=$COUNT"

          if [ "$COUNT" -lt 3 ]; then

            echo "ERROR: NEED 3 INSTALLERS"

            exit 1

          fi

      # ==========================================================
      # EXTRACT
      # ==========================================================

      - name: Extract installers
        run: |
          set -e

          N=0

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            N=$((N + 1))

            DEST="extracted/pkg${N}"

            mkdir -p "$DEST"

            echo
            echo "======================================"
            echo "EXTRACTING"
            echo "$FILE"
            echo "======================================"

            set +e

            innoextract \
              --extract \
              --output-dir "$DEST" \
              "$FILE"

            RESULT=$?

            if [ "$RESULT" -ne 0 ]; then

              echo "INNOEXTRACT FAILED"
              echo "TRYING 7Z"

              7z x \
                "$FILE" \
                "-o$DEST" \
                -y

            fi

            set -e

          done < <(
            find installers \
              -type f \
              -iname "*.exe" \
              | sort
          )

          echo
          echo "===== SEARCH GAME EXES ====="

          find extracted \
            -type f \
            \( \
              -iname "MK1.EXE" \
              -o \
              -iname "MK2.EXE" \
              -o \
              -iname "MK3.EXE" \
            \) \
            -print

      # ==========================================================
      # NORMALIZE — FIXED __support BUG
      # ==========================================================

      - name: Normalize game folders
        run: |
          set -e

          echo
          echo "===== FIND REAL GAME EXECUTABLES ====="

          MK1_EXE=$(
            find extracted \
              -type f \
              -iname "MK1.EXE" \
              -not -path "*/__support/*" \
              | head -1
          )

          MK2_EXE=$(
            find extracted \
              -type f \
              -iname "MK2.EXE" \
              -not -path "*/__support/*" \
              | head -1
          )

          MK3_EXE=$(
            find extracted \
              -type f \
              -iname "MK3.EXE" \
              -not -path "*/__support/*" \
              | head -1
          )

          echo "MK1_EXE=$MK1_EXE"
          echo "MK2_EXE=$MK2_EXE"
          echo "MK3_EXE=$MK3_EXE"

          if [ -z "$MK1_EXE" ]; then
            echo "ERROR: REAL MK1.EXE NOT FOUND"
            exit 1
          fi

          if [ -z "$MK2_EXE" ]; then
            echo "ERROR: REAL MK2.EXE NOT FOUND"
            exit 1
          fi

          if [ -z "$MK3_EXE" ]; then
            echo "ERROR: REAL MK3.EXE NOT FOUND"
            exit 1
          fi

          MK1_SRC="$(dirname "$MK1_EXE")"
          MK2_SRC="$(dirname "$MK2_EXE")"
          MK3_SRC="$(dirname "$MK3_EXE")"

          echo
          echo "===== REAL DIRECTORIES ====="

          echo "MK1_SRC=$MK1_SRC"
          echo "MK2_SRC=$MK2_SRC"
          echo "MK3_SRC=$MK3_SRC"

          rm -rf games/mk1
          rm -rf games/mk2
          rm -rf games/mk3

          mkdir -p games/mk1
          mkdir -p games/mk2
          mkdir -p games/mk3

          cp -R \
            "$MK1_SRC"/. \
            games/mk1/

          cp -R \
            "$MK2_SRC"/. \
            games/mk2/

          cp -R \
            "$MK3_SRC"/. \
            games/mk3/

          echo
          echo "===== VALIDATE ====="

          MK1_FINAL=$(
            find games/mk1 \
              -maxdepth 1 \
              -type f \
              -iname "MK1.EXE" \
              | head -1
          )

          MK2_FINAL=$(
            find games/mk2 \
              -maxdepth 1 \
              -type f \
              -iname "MK2.EXE" \
              | head -1
          )

          MK3_FINAL=$(
            find games/mk3 \
              -maxdepth 1 \
              -type f \
              -iname "MK3.EXE" \
              | head -1
          )

          echo "MK1_FINAL=$MK1_FINAL"
          echo "MK2_FINAL=$MK2_FINAL"
          echo "MK3_FINAL=$MK3_FINAL"

          test -n "$MK1_FINAL"
          test -n "$MK2_FINAL"
          test -n "$MK3_FINAL"

          echo
          echo "===== COUNTS ====="

          echo "MK1 FILES: $(find games/mk1 -type f | wc -l)"
          echo "MK2 FILES: $(find games/mk2 -type f | wc -l)"
          echo "MK3 FILES: $(find games/mk3 -type f | wc -l)"

          echo
          echo "NORMALIZATION SUCCESS"

      # ==========================================================
      # CLONE IDOS
      # ==========================================================

      - name: Clone iDOS
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/litchie/dospad.git \
            dospad

          echo
          echo "===== IDOS PROJECT ====="

          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -list

      # ==========================================================
      # DOSBOX CONFIGS
      # ==========================================================

      - name: Create optimized DOS configs
        run: |
          set -e

          for GAME in mk1 mk2 mk3; do

            mkdir -p \
              "games/$GAME/config"

            cp \
              dospad/Resources/configs/dospad.cfg \
              "games/$GAME/config/dospad.cfg"

          done

          python3 <<'PY'
          from pathlib import Path
          import re

          for game in ["mk1", "mk2", "mk3"]:

              p = Path(
                  f"games/{game}/config/dospad.cfg"
              )

              text = p.read_text(
                  errors="ignore"
              )

              if re.search(
                  r"(?m)^frameskip\s*=",
                  text
              ):

                  text = re.sub(
                      r"(?m)^frameskip\s*=.*$",
                      "frameskip=0",
                      text
                  )

              if re.search(
                  r"(?m)^core\s*=",
                  text
              ):

                  text = re.sub(
                      r"(?m)^core\s*=.*$",
                      "core=dynamic",
                      text
                  )

              if re.search(
                  r"(?m)^cycles\s*=",
                  text
              ):

                  text = re.sub(
                      r"(?m)^cycles\s*=.*$",
                      "cycles=max 95%",
                      text
                  )

              p.write_text(text)

          print("DOS CONFIGS READY")
          PY

      # ==========================================================
      # AUTOBOOT
      # ==========================================================

      - name: Create auto boot commands
        run: |
          set -e

          cat > games/mk1/MKAUTO.TXT <<'EOF'
          MK1.EXE
          EOF

          cat > games/mk2/MKAUTO.TXT <<'EOF'
          MK2.EXE
          EOF

          if [ -f "games/mk3/IMAGE/MK3.cue" ]; then

            cat > games/mk3/MKAUTO.TXT <<'EOF'
          imgmount d "C:\IMAGE\MK3.cue" -t iso
          MK3.EXE
          EOF

          else

            cat > games/mk3/MKAUTO.TXT <<'EOF'
          MK3.EXE
          EOF

          fi

          echo "===== MK1 ====="
          cat games/mk1/MKAUTO.TXT

          echo "===== MK2 ====="
          cat games/mk2/MKAUTO.TXT

          echo "===== MK3 ====="
          cat games/mk3/MKAUTO.TXT

      # ==========================================================
      # PATCH DOSBOX AUTOBOOT
      # ==========================================================

      - name: Patch MK auto boot
        run: |
          set -e

          FILE="dospad/dospad/Main/DOSPadEmulator.m"

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          text = open(
              path,
              "r",
              encoding="utf-8"
          ).read()

          marker = (
              '[self.commandList '
              'addObject:@"REM END AUTOMOUNT"];'
          )

          if marker not in text:

              raise SystemExit(
                  "ERROR: AUTOBOOT MARKER NOT FOUND"
              )

          if "MKTRILOGY_AUTOBOOT" in text:

              print(
                  "AUTOBOOT ALREADY PATCHED"
              )

              raise SystemExit(0)

          patch = marker + r'''

              // ==================================================
              // MKTRILOGY_AUTOBOOT
              // ==================================================

              NSString *mkBootFile =
                  [self.workingDirectory.path
                   stringByAppendingPathComponent:
                   @"MKAUTO.TXT"];

              if ([[NSFileManager defaultManager]
                   fileExistsAtPath:mkBootFile])
              {
                  NSError *mkBootError = nil;

                  NSString *mkBootCommands =
                      [NSString
                       stringWithContentsOfFile:
                       mkBootFile
                       encoding:
                       NSUTF8StringEncoding
                       error:
                       &mkBootError];

                  if (mkBootCommands.length > 0)
                  {
                      NSArray *mkLines =
                          [mkBootCommands
                           componentsSeparatedByCharactersInSet:
                           [NSCharacterSet
                            newlineCharacterSet]];

                      for (NSString *rawLine in mkLines)
                      {
                          NSString *line =
                              [rawLine
                               stringByTrimmingCharactersInSet:
                               [NSCharacterSet
                                whitespaceAndNewlineCharacterSet]];

                          if (line.length > 0)
                          {
                              [self.commandList
                               addObject:line];
                          }
                      }
                  }
              }

              // ===== END MKTRILOGY_AUTOBOOT =====
          '''

          text = text.replace(
              marker,
              patch,
              1
          )

          open(
              path,
              "w",
              encoding="utf-8"
          ).write(text)

          print("MK AUTOBOOT PATCHED")
          PY

      # ==========================================================
      # TRILOGY MENU
      # ==========================================================

      - name: Add MK Trilogy launcher
        run: |
          set -e

          FILE="dospad/dospad/Main/DPAppDelegate.m"

          python3 - "$FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          text = open(
              path,
              "r",
              encoding="utf-8"
          ).read()

          if "MKTRILOGY_MAIN_MENU" in text:

              print(
                  "MENU ALREADY PATCHED"
              )

              raise SystemExit(0)

          marker = (
              '#import <AVFoundation/AVFoundation.h>'
          )

          if marker not in text:

              raise SystemExit(
                  "ERROR: DPAppDelegate IMPORT MARKER NOT FOUND"
              )

          menu = r'''

          // ======================================================
          // MKTRILOGY_MAIN_MENU
          // ======================================================

          @interface DPAppDelegate (MKTrilogy)

          - (void)mkShowLauncher;
          - (void)mkLaunchGame:(NSString *)game;

          @end


          @interface MKTrilogyLauncherViewController
              : UIViewController

          @property(nonatomic, weak)
          DPAppDelegate *owner;

          @property(nonatomic, strong)
          UILabel *titleLabel;

          @property(nonatomic, strong)
          UILabel *subtitleLabel;

          @property(nonatomic, strong)
          UILabel *chooseLabel;

          @property(nonatomic, strong)
          UISegmentedControl *filterControl;

          @property(nonatomic, strong)
          UIButton *mk1Button;

          @property(nonatomic, strong)
          UIButton *mk2Button;

          @property(nonatomic, strong)
          UIButton *mk3Button;

          @property(nonatomic, strong)
          UIButton *settingsButton;

          @property(nonatomic, strong)
          UIButton *creditsButton;

          @end


          @implementation
          MKTrilogyLauncherViewController


          - (void)viewDidLoad
          {
              [super viewDidLoad];

              self.view.backgroundColor =
                  [UIColor
                   colorWithRed:0.018
                   green:0.012
                   blue:0.015
                   alpha:1.0];


              UIView *topGlow =
                  [[UIView alloc]
                   initWithFrame:CGRectZero];

              topGlow.tag = 7001;

              topGlow.backgroundColor =
                  [UIColor
                   colorWithRed:0.25
                   green:0.01
                   blue:0.015
                   alpha:0.38];

              topGlow.userInteractionEnabled =
                  NO;

              [self.view
               addSubview:topGlow];


              self.titleLabel =
                  [[UILabel alloc] init];

              self.titleLabel.text =
                  @"MORTAL KOMBAT";

              self.titleLabel.textAlignment =
                  NSTextAlignmentCenter;

              self.titleLabel.textColor =
                  UIColor.whiteColor;

              self.titleLabel.font =
                  [UIFont
                   systemFontOfSize:40
                   weight:UIFontWeightBlack];

              [self.view
               addSubview:self.titleLabel];


              self.subtitleLabel =
                  [[UILabel alloc] init];

              self.subtitleLabel.text =
                  @"REMASTERED TRILOGY";

              self.subtitleLabel.textAlignment =
                  NSTextAlignmentCenter;

              self.subtitleLabel.textColor =
                  [UIColor
                   colorWithRed:1.0
                   green:0.10
                   blue:0.09
                   alpha:1.0];

              self.subtitleLabel.font =
                  [UIFont
                   systemFontOfSize:20
                   weight:UIFontWeightBlack];

              [self.view
               addSubview:self.subtitleLabel];


              self.chooseLabel =
                  [[UILabel alloc] init];

              self.chooseLabel.text =
                  @"CHOOSE YOUR MK";

              self.chooseLabel.textAlignment =
                  NSTextAlignmentCenter;

              self.chooseLabel.textColor =
                  [UIColor
                   colorWithWhite:0.82
                   alpha:1.0];

              self.chooseLabel.font =
                  [UIFont
                   systemFontOfSize:14
                   weight:UIFontWeightBold];

              [self.view
               addSubview:self.chooseLabel];


              self.filterControl =
                  [[UISegmentedControl alloc]
                   initWithItems:
                   @[
                     @"CLASSIC",
                     @"CRT+"
                   ]];

              BOOL enhanced =
                  [[NSUserDefaults
                    standardUserDefaults]
                   boolForKey:@"MKEnhanced"];

              self.filterControl
                  .selectedSegmentIndex =
                  enhanced ? 1 : 0;


              if (@available(iOS 13.0, *))
              {
                  self.filterControl
                      .selectedSegmentTintColor =
                      [UIColor
                       colorWithRed:0.58
                       green:0.02
                       blue:0.02
                       alpha:1.0];
              }


              [self.filterControl
               addTarget:self
               action:@selector(filterChanged:)
               forControlEvents:
               UIControlEventValueChanged];

              [self.view
               addSubview:self.filterControl];


              self.mk1Button =
                  [self mkButton:
                   @"MORTAL KOMBAT"
                   game:@"mk1"];

              self.mk2Button =
                  [self mkButton:
                   @"MORTAL KOMBAT II"
                   game:@"mk2"];

              self.mk3Button =
                  [self mkButton:
                   @"MORTAL KOMBAT 3"
                   game:@"mk3"];


              [self.view
               addSubview:self.mk1Button];

              [self.view
               addSubview:self.mk2Button];

              [self.view
               addSubview:self.mk3Button];


              self.settingsButton =
                  [self smallButton:
                   @"SETTINGS"];

              self.settingsButton.tag = 10;

              [self.settingsButton
               addTarget:self
               action:@selector(smallButtonPressed:)
               forControlEvents:
               UIControlEventTouchUpInside];


              self.creditsButton =
                  [self smallButton:
                   @"CREDITS"];

              self.creditsButton.tag = 11;

              [self.creditsButton
               addTarget:self
               action:@selector(smallButtonPressed:)
               forControlEvents:
               UIControlEventTouchUpInside];


              [self.view
               addSubview:self.settingsButton];

              [self.view
               addSubview:self.creditsButton];
          }


          - (UIButton *)mkButton:
              (NSString *)title
              game:(NSString *)game
          {
              UIButton *button =
                  [UIButton
                   buttonWithType:
                   UIButtonTypeSystem];

              [button
               setTitle:title
               forState:UIControlStateNormal];

              [button
               setTitleColor:
               UIColor.whiteColor
               forState:UIControlStateNormal];

              button.titleLabel.font =
                  [UIFont
                   systemFontOfSize:20
                   weight:UIFontWeightBlack];

              button.backgroundColor =
                  [UIColor
                   colorWithRed:0.37
                   green:0.018
                   blue:0.022
                   alpha:1.0];

              button.layer.cornerRadius = 14;

              button.layer.borderWidth = 1;

              button.layer.borderColor =
                  [UIColor
                   colorWithWhite:1
                   alpha:0.17].CGColor;

              button.accessibilityIdentifier =
                  game;


              [button
               addTarget:self
               action:@selector(gamePressed:)
               forControlEvents:
               UIControlEventTouchUpInside];

              return button;
          }


          - (UIButton *)smallButton:
              (NSString *)title
          {
              UIButton *button =
                  [UIButton
                   buttonWithType:
                   UIButtonTypeSystem];

              [button
               setTitle:title
               forState:UIControlStateNormal];

              [button
               setTitleColor:
               UIColor.whiteColor
               forState:UIControlStateNormal];

              button.titleLabel.font =
                  [UIFont
                   systemFontOfSize:15
                   weight:UIFontWeightBold];

              button.backgroundColor =
                  [UIColor
                   colorWithWhite:0.10
                   alpha:1.0];

              button.layer.cornerRadius = 11;

              button.layer.borderWidth = 1;

              button.layer.borderColor =
                  [UIColor
                   colorWithWhite:1
                   alpha:0.12].CGColor;

              return button;
          }


          - (void)filterChanged:
              (UISegmentedControl *)control
          {
              BOOL enhanced =
                  control.selectedSegmentIndex == 1;

              [[NSUserDefaults
                standardUserDefaults]
               setBool:enhanced
               forKey:@"MKEnhanced"];

              [[NSUserDefaults
                standardUserDefaults]
               synchronize];
          }


          - (void)gamePressed:
              (UIButton *)button
          {
              NSString *game =
                  button.accessibilityIdentifier;

              if (game.length == 0)
                  return;

              self.chooseLabel.text =
                  @"LOADING...";

              self.mk1Button.enabled = NO;
              self.mk2Button.enabled = NO;
              self.mk3Button.enabled = NO;

              [self.owner
               mkLaunchGame:game];
          }


          - (void)smallButtonPressed:
              (UIButton *)button
          {
              NSString *title = nil;
              NSString *message = nil;

              if (button.tag == 10)
              {
                  title = @"SETTINGS";

                  message =
                      @"CLASSIC = SHARP PIXELS\n"
                       "CRT+ = SMOOTH + SCANLINES\n\n"
                       "TOUCH CONTROLS ARE ENABLED "
                       "AUTOMATICALLY.";
              }

              else
              {
                  title =
                      @"CREDITS";

                  message =
                      @"MORTAL KOMBAT "
                       "REMASTERED TRILOGY\n\n"
                       "iOS CLASSIC ENGINE";
              }


              UIAlertController *alert =
                  [UIAlertController
                   alertControllerWithTitle:title
                   message:message
                   preferredStyle:
                   UIAlertControllerStyleAlert];


              [alert
               addAction:
               [UIAlertAction
                actionWithTitle:@"OK"
                style:
                UIAlertActionStyleDefault
                handler:nil]];


              [self
               presentViewController:alert
               animated:YES
               completion:nil];
          }


          - (void)viewDidLayoutSubviews
          {
              [super viewDidLayoutSubviews];

              CGFloat w =
                  CGRectGetWidth(
                      self.view.bounds
                  );

              CGFloat h =
                  CGRectGetHeight(
                      self.view.bounds
                  );


              UIView *glow =
                  [self.view
                   viewWithTag:7001];

              glow.frame =
                  CGRectMake(
                      0,
                      0,
                      w,
                      165
                  );


              self.titleLabel.frame =
                  CGRectMake(
                      0,
                      13,
                      w,
                      47
                  );


              self.subtitleLabel.frame =
                  CGRectMake(
                      0,
                      57,
                      w,
                      29
                  );


              self.chooseLabel.frame =
                  CGRectMake(
                      0,
                      88,
                      w,
                      20
                  );


              self.filterControl.frame =
                  CGRectMake(
                      (w - 250) / 2,
                      115,
                      250,
                      31
                  );


              CGFloat bw =
                  MIN(
                      430,
                      w - 90
                  );

              CGFloat x =
                  (w - bw) / 2;

              CGFloat bh = 54;
              CGFloat gap = 11;
              CGFloat y = 169;


              self.mk1Button.frame =
                  CGRectMake(
                      x,
                      y,
                      bw,
                      bh
                  );


              self.mk2Button.frame =
                  CGRectMake(
                      x,
                      y + bh + gap,
                      bw,
                      bh
                  );


              self.mk3Button.frame =
                  CGRectMake(
                      x,
                      y + (bh + gap) * 2,
                      bw,
                      bh
                  );


              CGFloat smallW =
                  (bw - 10) / 2;

              CGFloat smallY =
                  y +
                  (bh + gap) * 3 +
                  4;


              self.settingsButton.frame =
                  CGRectMake(
                      x,
                      smallY,
                      smallW,
                      43
                  );


              self.creditsButton.frame =
                  CGRectMake(
                      x + smallW + 10,
                      smallY,
                      smallW,
                      43
                  );


              if (smallY + 55 > h)
              {
                  self.settingsButton.hidden =
                      YES;

                  self.creditsButton.hidden =
                      YES;
              }
          }


          - (BOOL)prefersStatusBarHidden
          {
              return YES;
          }


          - (UIInterfaceOrientationMask)
              supportedInterfaceOrientations
          {
              return
