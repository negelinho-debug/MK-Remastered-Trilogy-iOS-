      # ==========================================================
      # GENERATE APP ICON
      # ==========================================================

      - name: Generate MK Trilogy icon
        run: |
          set -e

          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import json
          import os
          import glob

          candidates = glob.glob(
              "dospad/Resources/Assets.xcassets/*.appiconset"
          )

          if not candidates:
              raise SystemExit(
                  "ERROR: AppIcon set not found"
              )

          appicon = candidates[0]

          print("Using:", appicon)

          for f in glob.glob(
              os.path.join(appicon, "*.png")
          ):
              os.remove(f)

          entries = [
              ("iphone", "20x20", "2x", 40, "mk20-2.png"),
              ("iphone", "20x20", "3x", 60, "mk20-3.png"),
              ("iphone", "29x29", "2x", 58, "mk29-2.png"),
              ("iphone", "29x29", "3x", 87, "mk29-3.png"),
              ("iphone", "40x40", "2x", 80, "mk40-2.png"),
              ("iphone", "40x40", "3x", 120, "mk40-3.png"),
              ("iphone", "60x60", "2x", 120, "mk60-2.png"),
              ("iphone", "60x60", "3x", 180, "mk60-3.png"),
              ("ios-marketing", "1024x1024", "1x", 1024, "mk1024.png"),
          ]


          def font(size):
              paths = [
                  "/System/Library/Fonts/Supplemental/Arial Bold.ttf",
                  "/System/Library/Fonts/Supplemental/Arial.ttf",
              ]

              for p in paths:
                  if os.path.exists(p):
                      return ImageFont.truetype(
                          p,
                          size
                      )

              return ImageFont.load_default()


          def make_icon(px, output):
              img = Image.new(
                  "RGB",
                  (px, px),
                  (7, 7, 10)
              )

              draw = ImageDraw.Draw(img)

              for y in range(px):
                  t = y / max(px - 1, 1)

                  r = int(
                      105 * (1 - t) +
                      12 * t
                  )

                  g = int(
                      5 * (1 - t) +
                      3 * t
                  )

                  b = int(
                      8 * (1 - t) +
                      7 * t
                  )

                  draw.line(
                      (0, y, px, y),
                      fill=(r, g, b)
                  )


              outer = int(px * 0.09)
              inner = int(px * 0.16)

              draw.ellipse(
                  (
                      outer,
                      outer,
                      px - outer,
                      px - outer
                  ),
                  fill=(10, 10, 13),
                  outline=(225, 36, 32),
                  width=max(2, int(px * 0.022))
              )

              draw.ellipse(
                  (
                      inner,
                      inner,
                      px - inner,
                      px - inner
                  ),
                  outline=(120, 15, 15),
                  width=max(2, int(px * 0.010))
              )


              big = font(
                  max(12, int(px * 0.31))
              )

              small = font(
                  max(8, int(px * 0.075))
              )

              mk = "MK"

              box = draw.textbbox(
                  (0, 0),
                  mk,
                  font=big
              )

              tw = box[2] - box[0]
              th = box[3] - box[1]

              draw.text(
                  (
                      (px - tw) / 2,
                      px * 0.38 - th / 2
                  ),
                  mk,
                  font=big,
                  fill=(247, 247, 247)
              )


              word = "TRILOGY"

              box = draw.textbbox(
                  (0, 0),
                  word,
                  font=small
              )

              tw = box[2] - box[0]

              draw.text(
                  (
                      (px - tw) / 2,
                      px * 0.69
                  ),
                  word,
                  font=small,
                  fill=(245, 75, 70)
              )

              img.save(
                  output,
                  "PNG"
              )


          images = []

          for idiom, size, scale, px, filename in entries:
              path = os.path.join(
                  appicon,
                  filename
              )

              make_icon(
                  px,
                  path
              )

              images.append({
                  "idiom": idiom,
                  "size": size,
                  "scale": scale,
                  "filename": filename
              })


          contents = {
              "images": images,
              "info": {
                  "author": "xcode",
                  "version": 1
              }
          }

          with open(
              os.path.join(
                  appicon,
                  "Contents.json"
              ),
              "w"
          ) as f:
              json.dump(
                  contents,
                  f,
                  indent=2
              )

          print(
              "New app icon generated"
          )
          PY

      # ==========================================================
      # BUILD iDOS
      # ==========================================================

      - name: Build MK Trilogy engine
        run: |
          set -e
          set -o pipefail

          xattr -cr dospad || true

          xcodebuild \
            -project dospad/dospad.xcodeproj \
            -scheme iDOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.mkremastered.trilogy" \
            build \
            | tee output/xcodebuild.log

      # ==========================================================
      # FIND APP
      # ==========================================================

      - name: Locate built app
        run: |
          set -e

          echo "===== BUILT APPS ====="

          find build \
            -type d \
            -name "*.app" \
            -print

          APP=$(
            find build/Build/Products \
              -type d \
              -name "iDOS.app" \
              | head -1
          )

          if [ -z "$APP" ]; then

            APP=$(
              find build/Build/Products \
                -type d \
                -name "*.app" \
                | head -1
            )

          fi

          if [ -z "$APP" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi

          echo "$APP" > output/app-path.txt

          echo "APP=$APP"

      # ==========================================================
      # BUNDLE REAL MK1 + MK2 + MK3
      # ==========================================================

      - name: Put all three real games inside IPA
        run: |
          set -e

          APP="$(cat output/app-path.txt)"

          rm -rf "$APP/MKGames"

          mkdir -p "$APP/MKGames/mk1"
          mkdir -p "$APP/MKGames/mk2"
          mkdir -p "$APP/MKGames/mk3"

          cp -R games/mk1/. \
            "$APP/MKGames/mk1/"

          cp -R games/mk2/. \
            "$APP/MKGames/mk2/"

          cp -R games/mk3/. \
            "$APP/MKGames/mk3/"


          echo "===== REAL EXES INSIDE APP ====="

          find "$APP/MKGames" \
            -type f \
            \( \
              -iname "MK1.EXE" \
              -o -iname "MK2.EXE" \
              -o -iname "MK3.EXE" \
            \) \
            -print


          test -n "$(
            find "$APP/MKGames/mk1" \
              -maxdepth 1 \
              -type f \
              -iname "MK1.EXE" \
              | head -1
          )"

          test -n "$(
            find "$APP/MKGames/mk2" \
              -maxdepth 1 \
              -type f \
              -iname "MK2.EXE" \
              | head -1
          )"

          test -n "$(
            find "$APP/MKGames/mk3" \
              -maxdepth 1 \
              -type f \
              -iname "MK3.EXE" \
              | head -1
          )"


          echo "MK1 bundled: $(find "$APP/MKGames/mk1" -type f | wc -l)"
          echo "MK2 bundled: $(find "$APP/MKGames/mk2" -type f | wc -l)"
          echo "MK3 bundled: $(find "$APP/MKGames/mk3" -type f | wc -l)"

      # ==========================================================
      # FINAL BRAND NAME
      # ==========================================================

      - name: Finalize app plist
        run: |
          set -e

          APP="$(cat output/app-path.txt)"
          PLIST="$APP/Info.plist"

          plutil \
            -replace CFBundleDisplayName \
            -string "MK Remastered Trilogy" \
            "$PLIST"

          plutil \
            -replace CFBundleIdentifier \
            -string "com.mkremastered.trilogy" \
            "$PLIST"

          echo "===== FINAL INFO ====="
          plutil -p "$PLIST" | head -50

      # ==========================================================
      # BUILD REPORT
      # ==========================================================

      - name: Create build report
        run: |
          set -e

          APP="$(cat output/app-path.txt)"

          {
            echo "======================================"
            echo "MORTAL KOMBAT REMASTERED TRILOGY"
            echo "REAL CLASSIC BUILD"
            echo "======================================"
            echo
            echo "FEATURES:"
            echo "REAL MK1.EXE"
            echo "REAL MK2.EXE"
            echo "REAL MK3.EXE"
            echo "TRILOGY NATIVE MENU"
            echo "TOUCH GAMEPAD"
            echo "GAME-SPECIFIC KEY MAPPINGS"
            echo "PAUSE MENU"
            echo "CLASSIC FILTER"
            echo "CRT+ FILTER"
            echo "CUSTOM APP ICON"
            echo "PERSISTENT GAME FOLDERS"
            echo "MK3 CUE/CD AUDIO AUTO-MOUNT ATTEMPT"
            echo
            echo "COUNTS:"
            echo "MK1=$(find "$APP/MKGames/mk1" -type f | wc -l)"
            echo "MK2=$(find "$APP/MKGames/mk2" -type f | wc -l)"
            echo "MK3=$(find "$APP/MKGames/mk3" -type f | wc -l)"
            echo
            echo "IMPORTANT:"
            echo "CRT+ is an iOS display filter."
            echo "It is not the future full remaster engine."
            echo
            echo "The real Remastered and First Person engines"
            echo "will be added after the Classic trilogy is stable."
          } > output/BUILD-INFO.txt

          cat output/BUILD-INFO.txt

      # ==========================================================
      # PACKAGE IPA
      # ==========================================================

      - name: Create IPA
        run: |
          set -e

          APP="$(cat output/app-path.txt)"

          rm -rf Payload
          mkdir -p Payload

          cp -R \
            "$APP" \
            Payload/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            output/MK-Remastered-Trilogy-REAL-Classic.ipa

          echo
          echo "===== IPA CREATED ====="

          ls -lh \
            output/MK-Remastered-Trilogy-REAL-Classic.ipa

      # ==========================================================
      # UPLOAD SUCCESS
      # ==========================================================

      - name: Upload REAL Trilogy IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MK-Remastered-Trilogy-REAL-Classic
          path: |
            output/MK-Remastered-Trilogy-REAL-Classic.ipa
            output/BUILD-INFO.txt
          compression-level: 0

      # ==========================================================
      # UPLOAD LOG IF FAILED
      # ==========================================================

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MK-Trilogy-Build-FAIL
          path: |
            output/xcodebuild.log
            output/BUILD-INFO.txt
          if-no-files-found: ignore
