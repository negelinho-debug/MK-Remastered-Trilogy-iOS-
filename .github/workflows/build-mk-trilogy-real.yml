          def get_font(size):

              paths = [

                  "/System/Library/Fonts/"
                  "Supplemental/"
                  "Arial Bold.ttf",

                  "/System/Library/Fonts/"
                  "Supplemental/"
                  "Arial.ttf"

              ]


              for path in paths:

                  if os.path.exists(path):

                      return (
                          ImageFont.truetype(
                              path,
                              size
                          )
                      )


              return ImageFont.load_default()


          def create_icon(
              pixels,
              filename
          ):

              image = Image.new(
                  "RGB",
                  (
                      pixels,
                      pixels
                  ),
                  (
                      6,
                      6,
                      9
                  )
              )


              draw = ImageDraw.Draw(
                  image
              )


              for y in range(pixels):

                  t = (
                      y /
                      max(
                          pixels - 1,
                          1
                      )
                  )


                  red = int(
                      115 *
                      (1 - t)
                      +
                      12 *
                      t
