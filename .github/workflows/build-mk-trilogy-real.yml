          // =====================================================
          // MKTRILOGY_TOUCH_CONTROLS
          // =====================================================

          - (NSString *)mkCurrentGame
          {
              NSString *game =
                  [[NSUserDefaults
                    standardUserDefaults]
                   stringForKey:@"MKCurrentGame"];

              return game ?: @"mk1";
          }


          - (UIButton *)mkButton:
              (NSString *)title
              frame:(CGRect)frame
              scancode:(NSInteger)scancode
          {
              UIButton *button =
                  [UIButton
                   buttonWithType:
                   UIButtonTypeSystem];

              button.frame = frame;

              button.tag = scancode;

              [button
               setTitle:title
               forState:UIControlStateNormal];

              [button
               setTitleColor:
               UIColor.whiteColor
               forState:UIControlStateNormal];

              button.titleLabel.font =
