            -name "*.app" \
            -print


          APP=$(
            find build/Build/Products \
              -type d \
              -name "iDOS.app" \
              | head -1
          )


          if [ -z "$APP" ]; then

            APP=$(
              find build/Build/Products \
                -type d \
                -name "*.app" \
                | head -1
            )

          fi


          if [ -z "$APP" ]; then

            echo "ERROR: BUILT APP NOT FOUND"

            exit 1

          fi


          echo "$APP" \
            > output/app-path.txt


          echo "APP=$APP"

